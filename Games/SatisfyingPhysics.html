<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Molten Trace</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d0f17;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* UI Header Overlay */
    .ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }

    .ui-card {
      background: rgba(22, 27, 46, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 16px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      pointer-events: auto;
    }

    .ui-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #8a99ad;
      margin-bottom: 2px;
    }

    .ui-value {
      font-size: 18px;
      font-weight: 700;
      color: #00f0ff;
      text-shadow: 0 0 10px rgba(0,240,255,0.4);
    }

    /* Bottom Action Controls */
    .bottom-controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 10;
      pointer-events: auto;
    }

    .btn {
      background: linear-gradient(135deg, #1e2640 0%, #111625 100%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 28px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn:active {
      transform: scale(0.95);
      background: rgba(0, 240, 255, 0.2);
    }

    .btn-primary {
      background: linear-gradient(135deg, #00f0ff 0%, #0072ff 100%);
      border: none;
      color: #000;
      font-weight: 700;
      box-shadow: 0 4px 20px rgba(0, 240, 255, 0.4);
    }

    /* Modal / Drawer */
    .modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 12, 20, 0.85);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #161b2e;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      width: 85%;
      max-width: 380px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      text-align: center;
    }

    .modal-title {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #00f0ff, #ff007f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .shop-items {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 20px 0;
      max-height: 260px;
      overflow-y: auto;
    }

    .shop-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px;
      border-radius: 16px;
    }

    .shop-item-info {
      text-align: left;
    }

    .shop-item-name {
      font-size: 14px;
      font-weight: 600;
    }

    .shop-item-desc {
      font-size: 11px;
      color: #8a99ad;
    }

    /* Start Banner */
    #start-hint {
      position: absolute;
      top: 20%;
      width: 100%;
      text-align: center;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.6);
      pointer-events: none;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.9; }
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div class="ui-overlay">
      <div class="ui-card">
        <span class="ui-label">Level</span>
        <span id="ui-level" class="ui-value">1</span>
      </div>
      <div class="ui-card">
        <span class="ui-label">Coverage</span>
        <span id="ui-coverage" class="ui-value">0%</span>
      </div>
      <div class="ui-card">
        <span class="ui-label">Credits</span>
        <span id="ui-credits" class="ui-value">0</span>
      </div>
    </div>

    <div id="start-hint">Press & Drag to Extrude</div>

    <canvas id="gameCanvas"></canvas>

    <div class="bottom-controls">
      <button class="btn" id="btn-shop">🛠️ Upgrades</button>
      <button class="btn btn-primary" id="btn-next" style="display: none;">Next Mold ➔</button>
    </div>

    <!-- Upgrades Modal -->
    <div class="modal" id="modal-shop">
      <div class="modal-card">
        <div class="modal-title">Material & Extruder</div>
        <div class="shop-items" id="shop-container"></div>
        <button class="btn" id="btn-close-shop" style="width: 100%; justify-content: center;">Resume</button>
      </div>
    </div>
  </div>

  <script>
    // --- Audio Synthesizer (Web Audio API) ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.extruderOsc = null;
        this.extruderGain = null;
        this.isExtruding = false;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      startExtrude() {
        if (!this.ctx) return;
        if (this.isExtruding) return;

        this.extruderOsc = this.ctx.createOscillator();
        this.extruderGain = this.ctx.createGain();

        this.extruderOsc.type = 'sawtooth';
        this.extruderOsc.frequency.setValueAtTime(80, this.ctx.currentTime); // Low hum

        // Filter for smooth tactile sound
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(300, this.ctx.currentTime);

        this.extruderGain.gain.setValueAtTime(0.01, this.ctx.currentTime);
        this.extruderGain.gain.exponentialRampToValueAtTime(0.15, this.ctx.currentTime + 0.1);

        this.extruderOsc.connect(filter);
        filter.connect(this.extruderGain);
        this.extruderGain.connect(this.ctx.destination);

        this.extruderOsc.start();
        this.isExtruding = true;
      }

      stopExtrude() {
        if (this.isExtruding && this.extruderGain) {
          this.extruderGain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.1);
          setTimeout(() => {
            if (this.extruderOsc) {
              this.extruderOsc.stop();
              this.extruderOsc.disconnect();
            }
          }, 100);
          this.isExtruding = false;
        }
      }

      playCureSound() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(880, now + 0.4);

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);

        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.start(now);
        osc.stop(now + 0.4);
      }
    }

    // --- Game Logic & Renderer ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const audio = new SoundEngine();

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    // Upgrades state
    let credits = parseInt(localStorage.getItem('mt_credits') || '0');
    let levelIndex = 0;
    
    const materials = [
      { id: 'pla', name: 'Cyber Blue PLA', color: '#00f0ff', glow: 'rgba(0, 240, 255, 0.6)', cost: 0, flowRate: 14 },
      { id: 'tpu', name: 'Neon Pink TPU', color: '#ff007f', glow: 'rgba(255, 0, 127, 0.6)', cost: 150, flowRate: 18 },
      { id: 'gold', name: 'Molten Gold', color: '#ffd700', glow: 'rgba(255, 215, 0, 0.6)', cost: 400, flowRate: 22 }
    ];
    let currentMaterial = materials[0];

    // Offscreen Stamp Canvas for hard cured lines
    const offscreenCanvas = document.createElement('canvas');
    const offCtx = offscreenCanvas.getContext('2d');
    offscreenCanvas.width = width;
    offscreenCanvas.height = height;

    // Input state
    let isTracing = false;
    let touchPos = { x: 0, y: 0 };
    let lastPos = { x: 0, y: 0 };

    // Active Extrusion Particles
    let activeParticles = [];

    // Mold Levels (Defined via Path2D for bulletproof collision)
    const MOLD_TYPES = [
      { name: "Precision Ring", shape: 'ring', scale: 120 },
      { name: "Hexagon Core", shape: 'hexagon', scale: 130 },
      { name: "Star Node", shape: 'star', scale: 140 },
      { name: "Gear Wheel", shape: 'gear', scale: 130 }
    ];

    let currentMoldPath = new Path2D();
    let currentOuterPath = new Path2D();
    let moldSamplePoints = [];
    let filledSamplePoints = new Set();
    let currentCoverage = 0;
    let levelComplete = false;

    // Responsive Resizing
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      offscreenCanvas.width = width;
      offscreenCanvas.height = height;
      buildCurrentMold();
    }
    window.addEventListener('resize', resize);

    // Build Math Shapes for Levels
    function buildCurrentMold() {
      const cx = width / 2;
      const cy = height / 2;
      const moldInfo = MOLD_TYPES[levelIndex % MOLD_TYPES.length];
      const r = Math.min(width, height) * 0.25;

      currentMoldPath = new Path2D();
      moldSamplePoints = [];
      filledSamplePoints.clear();
      currentCoverage = 0;
      levelComplete = false;

      document.getElementById('btn-next').style.display = 'none';

      if (moldInfo.shape === 'ring') {
        // Outer circle
        currentMoldPath.arc(cx, cy, r, 0, Math.PI * 2);
        // Inner cutout
        currentMoldPath.arc(cx, cy, r * 0.5, 0, Math.PI * 2, true);
      } else if (moldInfo.shape === 'hexagon') {
        const sides = 6;
        for (let i = 0; i < sides; i++) {
          const a = (i / sides) * Math.PI * 2;
          const x = cx + Math.cos(a) * r;
          const y = cy + Math.sin(a) * r;
          if (i === 0) currentMoldPath.moveTo(x, y);
          else currentMoldPath.lineTo(x, y);
        }
        currentMoldPath.closePath();
      } else if (moldInfo.shape === 'star') {
        const pts = 5;
        for (let i = 0; i < pts * 2; i++) {
          const a = (i / (pts * 2)) * Math.PI * 2;
          const radius = (i % 2 === 0) ? r : r * 0.45;
          const x = cx + Math.cos(a) * radius;
          const y = cy + Math.sin(a) * radius;
          if (i === 0) currentMoldPath.moveTo(x, y);
          else currentMoldPath.lineTo(x, y);
        }
        currentMoldPath.closePath();
      } else if (moldInfo.shape === 'gear') {
        const teeth = 8;
        for (let i = 0; i < teeth * 2; i++) {
          const a = (i / (teeth * 2)) * Math.PI * 2;
          const radius = (i % 2 === 0) ? r : r * 0.75;
          const x = cx + Math.cos(a) * radius;
          const y = cy + Math.sin(a) * radius;
          if (i === 0) currentMoldPath.moveTo(x, y);
          else currentMoldPath.lineTo(x, y);
        }
        currentMoldPath.closePath();
      }

      // Generate Discrete Sample Grid Points inside the Path for 0-100% calculation
      const step = 14;
      for (let x = cx - r - 20; x <= cx + r + 20; x += step) {
        for (let y = cy - r - 20; y <= cy + r + 20; y += step) {
          if (ctx.isPointInPath(currentMoldPath, x, y)) {
            moldSamplePoints.push({ x: Math.round(x), y: Math.round(y) });
          }
        }
      }

      // Clear offscreen layer
      offCtx.clearRect(0, 0, width, height);
      updateUI();
    }

    // Extrude Liquid Material Point
    function extrude(x, y) {
      if (levelComplete) return;

      const size = currentMaterial.flowRate;

      // Stamp to Offscreen Canvas for Glossy Permanent Trace
      offCtx.save();
      offCtx.beginPath();
      offCtx.arc(x, y, size, 0, Math.PI * 2);
      offCtx.fillStyle = currentMaterial.color;
      offCtx.shadowColor = currentMaterial.glow;
      offCtx.shadowBlur = 12;
      offCtx.fill();
      offCtx.restore();

      // Check Sample Grid Fill
      let newlyFilled = 0;
      for (let i = 0; i < moldSamplePoints.length; i++) {
        if (!filledSamplePoints.has(i)) {
          const pt = moldSamplePoints[i];
          const dx = x - pt.x;
          const dy = y - pt.y;
          if (dx * dx + dy * dy <= size * size) {
            filledSamplePoints.add(i);
            newlyFilled++;
          }
        }
      }

      if (moldSamplePoints.length > 0) {
        currentCoverage = Math.min(100, Math.round((filledSamplePoints.size / moldSamplePoints.length) * 100));
      }

      // Complete Mold Trigger
      if (currentCoverage >= 92 && !levelComplete) {
        levelComplete = true;
        audio.playCureSound();
        credits += 50 + (levelIndex * 20);
        localStorage.setItem('mt_credits', credits.toString());
        document.getElementById('btn-next').style.display = 'flex';
      }

      updateUI();
    }

    // --- Input Event Listeners (Touch Friendly, No Zoom) ---
    function handleStart(e) {
      e.preventDefault();
      audio.init();
      audio.startExtrude();
      isTracing = true;

      document.getElementById('start-hint').style.display = 'none';

      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      touchPos = { x: clientX, y: clientY };
      lastPos = { x: clientX, y: clientY };

      extrude(clientX, clientY);
    }

    function handleMove(e) {
      if (!isTracing) return;
      e.preventDefault();

      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      touchPos = { x: clientX, y: clientY };

      // Interpolate lines between fast drag moves
      const dx = touchPos.x - lastPos.x;
      const dy = touchPos.y - lastPos.y;
      const dist = Math.hypot(dx, dy);
      const step = 6;

      if (dist > step) {
        const steps = Math.floor(dist / step);
        for (let i = 0; i < steps; i++) {
          const ix = lastPos.x + (dx / steps) * i;
          const iy = lastPos.y + (dy / steps) * i;
          extrude(ix, iy);
        }
      } else {
        extrude(touchPos.x, touchPos.y);
      }

      lastPos = { x: touchPos.x, y: touchPos.y };
    }

    function handleEnd(e) {
      e.preventDefault();
      isTracing = false;
      audio.stopExtrude();
    }

    canvas.addEventListener('touchstart', handleStart, { passive: false });
    canvas.addEventListener('touchmove', handleMove, { passive: false });
    canvas.addEventListener('touchend', handleEnd, { passive: false });

    canvas.addEventListener('mousedown', handleStart);
    canvas.addEventListener('mousemove', handleMove);
    canvas.addEventListener('mouseup', handleEnd);

    // Render Loop
    function render() {
      ctx.clearRect(0, 0, width, height);

      // 1. Draw Mold Channel Container
      ctx.save();
      ctx.lineWidth = 30;
      ctx.strokeStyle = '#1e2640';
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.stroke(currentMoldPath);

      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.4)';
      ctx.stroke(currentMoldPath);
      ctx.restore();

      // 2. Render Offscreen Solidified Material Layer
      ctx.drawImage(offscreenCanvas, 0, 0);

      // 3. Render Active Extruding Tip Animation
      if (isTracing) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(touchPos.x, touchPos.y, currentMaterial.flowRate + 4, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = currentMaterial.color;
        ctx.shadowBlur = 20;
        ctx.fill();
        ctx.restore();
      }

      requestAnimationFrame(render);
    }

    // UI Updates
    function updateUI() {
      document.getElementById('ui-level').textContent = (levelIndex + 1);
      document.getElementById('ui-coverage').textContent = currentCoverage + '%';
      document.getElementById('ui-credits').textContent = credits;
    }

    // Shop System
    function renderShop() {
      const container = document.getElementById('shop-container');
      container.innerHTML = '';

      materials.forEach(mat => {
        const isUnlocked = mat.cost <= credits || mat.id === currentMaterial.id;
        const item = document.createElement('div');
        item.className = 'shop-item';
        item.innerHTML = `
          <div class="shop-item-info">
            <div class="shop-item-name" style="color: ${mat.color}">${mat.name}</div>
            <div class="shop-item-desc">Extrude Width: ${mat.flowRate}px</div>
          </div>
          <button class="btn" ${mat.id === currentMaterial.id ? 'disabled' : ''}>
            ${mat.id === currentMaterial.id ? 'Equipped' : (isUnlocked ? 'Select' : mat.cost + ' 🪙')}
          </button>
        `;
        
        item.querySelector('button').onclick = () => {
          if (mat.cost <= credits) {
            currentMaterial = mat;
            renderShop();
            updateUI();
          }
        };
        container.appendChild(item);
      });
    }

    document.getElementById('btn-shop').onclick = () => {
      renderShop();
      document.getElementById('modal-shop').classList.add('active');
    };

    document.getElementById('btn-close-shop').onclick = () => {
      document.getElementById('modal-shop').classList.remove('active');
    };

    document.getElementById('btn-next').onclick = () => {
      levelIndex++;
      buildCurrentMold();
    };

    // Initialize Game
    buildCurrentMold();
    render();
  </script>
</body>
</html>
