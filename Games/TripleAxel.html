<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMC Sierra & MasterCraft Boat Ramp Simulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .header {
            text-align: center;
            margin-bottom: 1rem;
        }

        .header h1 {
            font-size: 1.5rem;
            color: #38bdf8;
        }

        .header p {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-top: 0.25rem;
        }

        #gameContainer {
            position: relative;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #334155;
        }

        canvas {
            display: block;
            background-color: #1e293b;
        }

        #statusBanner {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
            padding: 8px 14px;
            border-radius: 6px;
            border: 1px solid #334155;
            font-size: 0.85rem;
            font-weight: 600;
            color: #38bdf8;
        }

        #launchBtn {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: #10b981;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
            display: none;
            transition: all 0.2s ease;
        }

        #launchBtn:hover {
            background-color: #059669;
            transform: scale(1.05);
        }

        .controls-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 800px;
            margin-top: 1rem;
            background-color: #1e293b;
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            border: 1px solid #334155;
        }

        .keys {
            display: flex;
            gap: 1rem;
            font-size: 0.85rem;
            color: #cbd5e1;
        }

        .key-badge {
            background: #334155;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            color: #f8fafc;
        }

        .btn-reset {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-reset:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>GMC Sierra & MasterCraft Boat Ramp Simulator</h1>
        <p>Back trailer into the lake to launch and drive the boat!</p>
    </div>

    <div id="gameContainer">
        <div id="statusBanner">Controlling: <span id="activeVehicleText" style="color: #fff;">Truck</span></div>
        <button id="launchBtn" onclick="toggleBoatLaunch()">🚀 Launch Boat</button>
        <canvas id="simCanvas" width="800" height="500"></canvas>
    </div>

    <div class="controls-info">
        <div class="keys">
            <span><span class="key-badge">W</span> / <span class="key-badge">↑</span> Drive Forward</span>
            <span><span class="key-badge">S</span> / <span class="key-badge">↓</span> Reverse</span>
            <span><span class="key-badge">A</span> / <span class="key-badge">D</span> / <span class="key-badge">←</span> <span class="key-badge">→</span> Steer</span>
        </div>
        <button class="btn-reset" onclick="resetVehicle()">Reset All</button>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const launchBtn = document.getElementById('launchBtn');
        const activeVehicleText = document.getElementById('activeVehicleText');

        // Input Handling
        const keys = {};
        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);

        // Vehicle Setup & Dimensions
        const TRUCK_WIDTH = 26;
        const TRUCK_LENGTH = 52;
        const TRAILER_WIDTH = 28;
        const TRAILER_LENGTH = 65;
        
        // Exact hitch distance at the VERY REAR bumper tow ball:
        const HITCH_OFFSET = TRUCK_LENGTH / 2 + 6; 

        let truck, trailer, boat;
        let isBoatLaunched = false;
        let activeControl = 'truck';

        function resetVehicle() {
            isBoatLaunched = false;
            activeControl = 'truck';
            launchBtn.style.display = 'none';
            launchBtn.innerText = "🚀 Launch Boat";
            activeVehicleText.innerText = "Truck & Trailer";

            truck = {
                x: 200,
                y: 200,
                angle: 0,
                speed: 0,
                maxSpeed: 3,
                accel: 0.08,
                friction: 0.04,
                maxSteer: 0.04
            };

            // Calculate exact rear hitch ball position
            const initialHitchX = truck.x - Math.cos(truck.angle) * HITCH_OFFSET;
            const initialHitchY = truck.y - Math.sin(truck.angle) * HITCH_OFFSET;

            trailer = {
                x: initialHitchX - TRAILER_LENGTH / 2,
                y: initialHitchY,
                angle: 0
            };

            boat = {
                x: trailer.x,
                y: trailer.y,
                angle: 0,
                speed: 0,
                maxSpeed: 4.5,
                accel: 0.08,
                friction: 0.02,
                maxSteer: 0.04
            };
        }

        resetVehicle();

        function toggleBoatLaunch() {
            if (!isBoatLaunched) {
                isBoatLaunched = true;
                activeControl = 'boat';
                launchBtn.innerText = "⚓ Dock Boat to Trailer";
                activeVehicleText.innerText = "MasterCraft Boat";
            } else {
                isBoatLaunched = false;
                activeControl = 'truck';
                launchBtn.innerText = "🚀 Launch Boat";
                activeVehicleText.innerText = "Truck & Trailer";
            }
        }

        function updatePhysics() {
            // --- ORIGINAL STEERING & DRIVING PHYSICS ---
            if (activeControl === 'truck') {
                if (keys['w'] || keys['W'] || keys['ArrowUp']) {
                    if (truck.speed < truck.maxSpeed) truck.speed += truck.accel;
                } else if (keys['s'] || keys['S'] || keys['ArrowDown']) {
                    if (truck.speed > -truck.maxSpeed * 0.6) truck.speed -= truck.accel;
                } else {
                    if (truck.speed > 0) truck.speed = Math.max(0, truck.speed - truck.friction);
                    if (truck.speed < 0) truck.speed = Math.min(0, truck.speed + truck.friction);
                }

                if (keys['a'] || keys['A'] || keys['ArrowLeft']) {
                    truck.angle -= truck.maxSteer * (truck.speed / truck.maxSpeed);
                }
                if (keys['d'] || keys['D'] || keys['ArrowRight']) {
                    truck.angle += truck.maxSteer * (truck.speed / truck.maxSpeed);
                }
            } else {
                if (truck.speed > 0) truck.speed = Math.max(0, truck.speed - truck.friction);
                if (truck.speed < 0) truck.speed = Math.min(0, truck.speed + truck.friction);
            }

            // Move Truck
            truck.x += Math.cos(truck.angle) * truck.speed;
            truck.y += Math.sin(truck.angle) * truck.speed;

            // Hitch position (At the very rear tow ball)
            const hitchX = truck.x - Math.cos(truck.angle) * HITCH_OFFSET;
            const hitchY = truck.y - Math.sin(truck.angle) * HITCH_OFFSET;

            // --- ORIGINAL Snappy Trailer Physics ---
            const dx = hitchX - trailer.x;
            const dy = hitchY - trailer.y;
            trailer.angle = Math.atan2(dy, dx);

            // Set trailer position strictly behind hitch ball
            const trailerDistance = TRAILER_LENGTH / 2;
            trailer.x = hitchX - Math.cos(trailer.angle) * trailerDistance;
            trailer.y = hitchY - Math.sin(trailer.angle) * trailerDistance;

            // Check if trailer is in lake
            if (trailer.x > 610 && !isBoatLaunched) {
                launchBtn.style.display = 'block';
            } else if (!isBoatLaunched) {
                launchBtn.style.display = 'none';
            }

            // --- BOAT PHYSICS ---
            if (!isBoatLaunched) {
                boat.x = trailer.x;
                boat.y = trailer.y;
                boat.angle = trailer.angle;
            } else {
                if (activeControl === 'boat') {
                    if (keys['w'] || keys['W'] || keys['ArrowUp']) {
                        if (boat.speed < boat.maxSpeed) boat.speed += boat.accel;
                    } else if (keys['s'] || keys['S'] || keys['ArrowDown']) {
                        if (boat.speed > -boat.maxSpeed * 0.4) boat.speed -= boat.accel;
                    } else {
                        if (boat.speed > 0) boat.speed = Math.max(0, boat.speed - boat.friction);
                        if (boat.speed < 0) boat.speed = Math.min(0, boat.speed + boat.friction);
                    }

                    if (keys['a'] || keys['A'] || keys['ArrowLeft']) {
                        boat.angle -= boat.maxSteer * (Math.abs(boat.speed) / boat.maxSpeed);
                    }
                    if (keys['d'] || keys['D'] || keys['ArrowRight']) {
                        boat.angle += boat.maxSteer * (Math.abs(boat.speed) / boat.maxSpeed);
                    }
                }

                boat.x += Math.cos(boat.angle) * boat.speed;
                boat.y += Math.sin(boat.angle) * boat.speed;
            }
        }

        // Draw Environment & Objects
        function drawEnvironment() {
            // Asphalt Parking Lot
            ctx.fillStyle = '#334155';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Water Area
            ctx.fillStyle = '#0284c7';
            ctx.fillRect(600, 0, 200, canvas.height);

            // Concrete Boat Ramp
            ctx.fillStyle = '#64748b';
            ctx.beginPath();
            ctx.moveTo(480, 150);
            ctx.lineTo(650, 150);
            ctx.lineTo(650, 350);
            ctx.lineTo(480, 350);
            ctx.closePath();
            ctx.fill();

            // Ramp Grooves
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 2;
            for (let y = 160; y < 350; y += 12) {
                ctx.beginPath();
                ctx.moveTo(490, y);
                ctx.lineTo(640, y);
                ctx.stroke();
            }

            // Docks
            ctx.fillStyle = '#78350f';
            ctx.fillRect(610, 120, 170, 20);
            ctx.fillRect(610, 360, 170, 20);

            // Parking Stalls
            ctx.strokeStyle = '#fef08a';
            ctx.lineWidth = 2;
            for (let y = 30; y < 450; y += 70) {
                if (y < 120 || y > 360) {
                    ctx.beginPath();
                    ctx.moveTo(20, y);
                    ctx.lineTo(120, y);
                    ctx.stroke();
                }
            }

            // Labels
            ctx.fillStyle = '#94a3b8';
            ctx.font = '12px sans-serif';
            ctx.fillText('PARKING LOT', 30, 25);
            ctx.fillText('RAMP', 510, 140);
            ctx.fillStyle = '#e0f2fe';
            ctx.fillText('LAKE', 700, 50);
        }

        function drawEntities() {
            // --- DRAW TRAILER ---
            ctx.save();
            ctx.translate(trailer.x, trailer.y);
            ctx.rotate(trailer.angle);

            // Trailer Frame
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(-TRAILER_LENGTH / 2, -TRAILER_WIDTH / 2, TRAILER_LENGTH, TRAILER_WIDTH);

            // Triple Axle Wheels
            ctx.fillStyle = '#000000';
            const wheelOffsets = [-12, 0, 12];
            wheelOffsets.forEach(offset => {
                ctx.fillRect(offset - 4, -TRAILER_WIDTH / 2 - 3, 8, 4);
                ctx.fillRect(offset - 4, TRAILER_WIDTH / 2 - 1, 8, 4);
            });

            // Trailer V-Tongue extending forward to hitch ball
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-TRAILER_LENGTH / 2, 0);
            ctx.lineTo(-TRAILER_LENGTH / 2 - 6, 0);
            ctx.stroke();

            ctx.restore();

            // --- DRAW MASTERCRAFT BOAT ---
            ctx.save();
            ctx.translate(boat.x, boat.y);
            ctx.rotate(boat.angle);

            if (isBoatLaunched && Math.abs(boat.speed) > 0.2) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(-TRAILER_LENGTH / 2, 0, 15, -Math.PI / 2, Math.PI / 2);
                ctx.stroke();
            }

            // Boat Hull
            ctx.fillStyle = '#0284c7';
            ctx.beginPath();
            ctx.moveTo(-TRAILER_LENGTH / 2 + 5, -TRAILER_WIDTH / 2 + 4);
            ctx.lineTo(TRAILER_LENGTH / 2 - 10, -TRAILER_WIDTH / 2 + 4);
            ctx.lineTo(TRAILER_LENGTH / 2 + 10, 0);
            ctx.lineTo(TRAILER_LENGTH / 2 - 10, TRAILER_WIDTH / 2 - 4);
            ctx.lineTo(-TRAILER_LENGTH / 2 + 5, TRAILER_WIDTH / 2 - 4);
            ctx.closePath();
            ctx.fill();

            // Cockpit
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(-TRAILER_LENGTH / 2 + 10, -TRAILER_WIDTH / 2 + 7, TRAILER_LENGTH - 26, TRAILER_WIDTH - 14);

            ctx.restore();

            // --- DRAW TRUCK (GMC Sierra Denali) ---
            ctx.save();
            ctx.translate(truck.x, truck.y);
            ctx.rotate(truck.angle);

            // Tires
            ctx.fillStyle = '#000000';
            ctx.fillRect(-16, -TRUCK_WIDTH / 2 - 2, 10, 4);
            ctx.fillRect(-16, TRUCK_WIDTH / 2 - 2, 10, 4);
            ctx.fillRect(14, -TRUCK_WIDTH / 2 - 2, 10, 4);
            ctx.fillRect(14, TRUCK_WIDTH / 2 - 2, 10, 4);

            // Body
            ctx.fillStyle = '#090d16';
            ctx.fillRect(-TRUCK_LENGTH / 2, -TRUCK_WIDTH / 2, TRUCK_LENGTH, TRUCK_WIDTH);

            // Truck Bed
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(-TRUCK_LENGTH / 2 + 3, -TRUCK_WIDTH / 2 + 3, 24, TRUCK_WIDTH - 6);
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 1;
            for (let bx = -TRUCK_LENGTH / 2 + 6; bx < -TRUCK_LENGTH / 2 + 24; bx += 4) {
                ctx.beginPath();
                ctx.moveTo(bx, -TRUCK_WIDTH / 2 + 4);
                ctx.lineTo(bx, TRUCK_WIDTH / 2 - 4);
                ctx.stroke();
            }

            // Cab & Windshield
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(2, -TRUCK_WIDTH / 2 + 3, 14, TRUCK_WIDTH - 6);

            // Headlights
            ctx.fillStyle = '#fef08a';
            ctx.fillRect(TRUCK_LENGTH / 2 - 2, -TRUCK_WIDTH / 2 + 2, 2, 5);
            ctx.fillRect(TRUCK_LENGTH / 2 - 2, TRUCK_WIDTH / 2 - 7, 2, 5);

            // REAR TOW HITCH (Directly at back bumper)
            ctx.fillStyle = '#64748b';
            ctx.fillRect(-TRUCK_LENGTH / 2 - 5, -2, 5, 4);

            // Tow Ball
            ctx.fillStyle = '#cbd5e1';
            ctx.beginPath();
            ctx.arc(-TRUCK_LENGTH / 2 - 6, 0, 3, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        // Game Loop
        function loop() {
            updatePhysics();
            drawEnvironment();
            drawEntities();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
