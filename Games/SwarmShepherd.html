<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Swarm Shepherd - Mobile Ready</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
        }
        body {
            background-color: #111217;
            color: #f0f4f8;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 10px;
        }
        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            border-radius: 8px;
            overflow: hidden;
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            display: block;
            background: #181a20;
            width: 100%;
            height: auto;
            max-height: 70vh;
            touch-action: none;
        }
        #ui-layer {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            gap: 5px;
        }
        .hud-card {
            background: rgba(22, 25, 35, 0.85);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            flex: 1;
            text-align: center;
        }
        .hud-title {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8a99ad;
            margin-bottom: 2px;
        }
        .hud-value {
            font-size: 14px;
            font-weight: bold;
            color: #00f0ff;
        }
        .danger-text { color: #ff3366; }
        .warning-text { color: #ffaa00; }

        /* Mobile Controls Layout */
        #mobile-controls {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: #181a20;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        /* Touch D-Pad */
        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 40px);
            grid-template-rows: repeat(3, 40px);
            gap: 4px;
        }
        .dpad-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: white;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            touch-action: manipulation;
        }
        .dpad-btn:active {
            background: #00f0ff;
            color: #000;
        }
        .dpad-up { grid-column: 2; grid-row: 1; }
        .dpad-left { grid-column: 1; grid-row: 2; }
        .dpad-right { grid-column: 3; grid-row: 2; }
        .dpad-down { grid-column: 2; grid-row: 3; }

        /* Mobile Action Buttons */
        .action-buttons {
            display: flex;
            gap: 8px;
        }
        .action-btn {
            background: rgba(0, 240, 255, 0.15);
            border: 1px solid #00f0ff;
            color: #00f0ff;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .action-btn:active {
            background: #00f0ff;
            color: #000;
        }

        #game-over-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 11, 15, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            padding: 20px;
            text-align: center;
        }
        #game-over-screen.hidden { display: none; }
        button.reset-btn {
            background: #00f0ff;
            color: #000;
            border: none;
            padding: 12px 28px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="canvas" width="900" height="600"></canvas>
    
    <div id="ui-layer">
        <div class="hud-card">
            <div class="hud-title">Swarm</div>
            <div id="swarm-count" class="hud-value">50 / 50</div>
        </div>
        <div class="hud-card">
            <div class="hud-title">State</div>
            <div id="commander-state" class="hud-value warning-text">HALTED</div>
        </div>
        <div class="hud-card">
            <div class="hud-title">Items</div>
            <div id="inventory" class="hud-value" style="font-size: 11px; margin-top:2px;">
                Bait: <span id="bait-count" style="color:#00f0ff">3</span> | 
                Flare: <span id="flare-count" style="color:#00f0ff">3</span>
            </div>
        </div>
    </div>

    <!-- On-screen mobile touch controls -->
    <div id="mobile-controls">
        <div class="dpad">
            <div class="dpad-btn dpad-up" id="btn-up">▲</div>
            <div class="dpad-btn dpad-left" id="btn-left">◀</div>
            <div class="dpad-btn dpad-right" id="btn-right">▶</div>
            <div class="dpad-btn dpad-down" id="btn-down">▼</div>
        </div>

        <div class="action-buttons">
            <button class="action-btn" id="btn-bait">
                <span>BAIT</span>
            </button>
            <button class="action-btn" id="btn-flare">
                <span>FLARE</span>
            </button>
            <button class="action-btn" id="btn-march" style="border-color:#ffaa00; color:#ffaa00;">
                <span>TOGGLE</span>
                <span>MARCH</span>
            </button>
        </div>
    </div>

    <div id="game-over-screen" class="hidden">
        <h1 id="game-over-title" style="font-size: 32px; margin-bottom: 10px;">MISSION FAILED</h1>
        <p id="game-over-desc">The apex predators devoured your entire swarm.</p>
        <button class="reset-btn" onclick="resetGame()">Try Again</button>
    </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// --- Game State ---
let gameState = 'PLAYING';
let swarmCount = 50;
const totalSwarm = 50;
let baitRemaining = 3;
let flareRemaining = 3;

// Mouse/Touch Position (Commander Beacon)
const mouse = { x: 150, y: 300 };

// Key & Touch input states
const keys = {};
const touchInput = { up: false, down: false, left: false, right: false };

// --- Game Objects ---
const scout = {
    x: 180,
    y: 300,
    radius: 12,
    speed: 3.5,
    color: '#00f0ff'
};

const commander = {
    x: 100,
    y: 300,
    isMarching: false
};

class SwarmMember {
    constructor(x, y) {
        this.x = x + (Math.random() - 0.5) * 20;
        this.y = y + (Math.random() - 0.5) * 20;
        this.vx = 0;
        this.vy = 0;
        this.radius = 3;
        this.maxSpeed = 2.2;
        this.alive = true;
    }

    update() {
        if (!this.alive) return;

        let targetX = commander.x;
        let targetY = commander.y;

        if (commander.isMarching) {
            let dx = targetX - this.x;
            let dy = targetY - this.y;
            let dist = Math.hypot(dx, dy);

            if (dist > 15) {
                this.vx += (dx / dist) * 0.15;
                this.vy += (dy / dist) * 0.15;
            }
        }

        this.vx *= 0.92;
        this.vy *= 0.92;

        let speed = Math.hypot(this.vx, this.vy);
        if (speed > this.maxSpeed) {
            this.vx = (this.vx / speed) * this.maxSpeed;
            this.vy = (this.vy / speed) * this.maxSpeed;
        }

        this.x += this.vx;
        this.y += this.vy;
    }

    draw() {
        if (!this.alive) return;
        ctx.fillStyle = '#33ff88';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
    }
}

class Predator {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 16;
        this.speed = 1.4;
        this.state = 'PATROL';
        this.homeX = x;
        this.homeY = y;
        this.angle = Math.random() * Math.PI * 2;
    }

    update(swarms, baits, flares) {
        let target = null;
        let highestPriority = 0;

        for (let f of flares) {
            let d = Math.hypot(f.x - this.x, f.y - this.y);
            if (d < f.radius + 50) {
                let angle = Math.atan2(this.y - f.y, this.x - f.x);
                this.x += Math.cos(angle) * (this.speed * 1.5);
                this.y += Math.sin(angle) * (this.speed * 1.5);
                this.state = 'FLEE';
                return;
            }
        }

        for (let b of baits) {
            let d = Math.hypot(b.x - this.x, b.y - this.y);
            if (d < 250) {
                target = b;
                highestPriority = 2;
                this.state = 'ATTRACTED TO BAIT';
                break;
            }
        }

        if (highestPriority < 2) {
            let closestSwarm = null;
            let minDist = 180;

            for (let s of swarms) {
                if (!s.alive) continue;
                let d = Math.hypot(s.x - this.x, s.y - this.y);
                if (d < minDist) {
                    minDist = d;
                    closestSwarm = s;
                }
            }

            if (closestSwarm) {
                target = closestSwarm;
                highestPriority = 1;
                this.state = 'HUNTING';
            }
        }

        if (target) {
            let dx = target.x - this.x;
            let dy = target.y - this.y;
            let dist = Math.hypot(dx, dy);
            
            this.x += (dx / dist) * this.speed;
            this.y += (dy / dist) * this.speed;

            if (highestPriority === 1 && dist < this.radius + target.radius) {
                target.alive = false;
                swarmCount--;
                updateHUD();
            }
        } else {
            this.state = 'PATROL';
            this.angle += (Math.random() - 0.5) * 0.1;
            this.x += Math.cos(this.angle) * 0.5;
            this.y += Math.sin(this.angle) * 0.5;
            
            if (Math.hypot(this.x - this.homeX, this.y - this.homeY) > 80) {
                this.angle = Math.atan2(this.homeY - this.y, this.homeX - this.x);
            }
        }
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.fillStyle = this.state === 'FLEE' ? '#aa00ff' : (this.state === 'HUNTING' ? '#ff3366' : '#ffaa00');
        
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
            let a = (i / 6) * Math.PI * 2;
            let r = i % 2 === 0 ? this.radius : this.radius * 0.6;
            ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
        }
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = 'rgba(255, 51, 102, 0.15)';
        ctx.beginPath();
        ctx.arc(0, 0, 180, 0, Math.PI * 2);
        ctx.stroke();

        ctx.restore();
    }
}

let swarms = [];
let predators = [];
let baits = [];
let flares = [];

const exitZone = { x: 800, y: 250, w: 70, h: 100 };
const hazards = [
    { x: 350, y: 0, w: 40, h: 380, type: 'PIT' },
    { x: 350, y: 480, w: 40, h: 120, type: 'PIT' },
    { x: 600, y: 150, w: 40, h: 300, type: 'PIT' }
];
let bridges = [];

function init() {
    gameState = 'PLAYING';
    swarmCount = totalSwarm;
    baitRemaining = 3;
    flareRemaining = 3;
    scout.x = 180;
    scout.y = 300;
    commander.x = 100;
    commander.y = 300;
    commander.isMarching = false;

    swarms = [];
    for (let i = 0; i < totalSwarm; i++) {
        swarms.push(new SwarmMember(100, 300));
    }

    predators = [
        new Predator(480, 120),
        new Predator(500, 480),
        new Predator(720, 300)
    ];

    baits = [];
    flares = [];
    bridges = [];

    document.getElementById('game-over-screen').classList.add('hidden');
    updateHUD();
}

function updateHUD() {
    document.getElementById('swarm-count').innerText = `${swarmCount} / ${totalSwarm}`;
    document.getElementById('bait-count').innerText = baitRemaining;
    document.getElementById('flare-count').innerText = flareRemaining;
    
    const cmdUI = document.getElementById('commander-state');
    if (commander.isMarching) {
        cmdUI.innerText = "MARCHING";
        cmdUI.className = "hud-value";
    } else {
        cmdUI.innerText = "HALTED";
        cmdUI.className = "hud-value warning-text";
    }
}

// Helper to calculate canvas coordinates from Touch or Mouse
function setPointerPosition(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    mouse.x = (clientX - rect.left) * scaleX;
    mouse.y = (clientY - rect.top) * scaleY;
}

// --- Keyboard Input ---
window.addEventListener('keydown', (e) => {
    keys[e.key.toLowerCase()] = true;

    if (e.code === 'Space') {
        commander.isMarching = !commander.isMarching;
        updateHUD();
    }

    if (e.key.toLowerCase() === 'e') deployBait();
    if (e.key.toLowerCase() === 'q') deployFlare();
});

window.addEventListener('keyup', (e) => {
    keys[e.key.toLowerCase()] = false;
});

// --- Mouse Input ---
canvas.addEventListener('mousemove', (e) => {
    setPointerPosition(e.clientX, e.clientY);
});

// --- iOS / Mobile Touch Input for Canvas Target Beacon ---
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (e.touches.length > 0) {
        setPointerPosition(e.touches[0].clientX, e.touches[0].clientY);
    }
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (e.touches.length > 0) {
        setPointerPosition(e.touches[0].clientX, e.touches[0].clientY);
    }
}, { passive: false });

// Deploy Actions
function deployBait() {
    if (baitRemaining > 0) {
        baits.push({ x: scout.x, y: scout.y, duration: 300 });
        baitRemaining--;
        updateHUD();
    }
}

function deployFlare() {
    if (flareRemaining > 0) {
        flares.push({ x: scout.x, y: scout.y, radius: 120, duration: 240 });
        flareRemaining--;
        updateHUD();
    }
}

function toggleMarch() {
    commander.isMarching = !commander.isMarching;
    updateHUD();
}

// Setup D-Pad and Touch Buttons
function setupMobileButton(id, onPress, onRelease) {
    const el = document.getElementById(id);
    if (!el) return;

    const startHandler = (e) => {
        e.preventDefault();
        if (onPress) onPress();
    };

    const endHandler = (e) => {
        e.preventDefault();
        if (onRelease) onRelease();
    };

    el.addEventListener('touchstart', startHandler, { passive: false });
    el.addEventListener('touchend', endHandler, { passive: false });
    el.addEventListener('mousedown', startHandler);
    el.addEventListener('mouseup', endHandler);
}

setupMobileButton('btn-up', () => touchInput.up = true, () => touchInput.up = false);
setupMobileButton('btn-down', () => touchInput.down = true, () => touchInput.down = false);
setupMobileButton('btn-left', () => touchInput.left = true, () => touchInput.left = false);
setupMobileButton('btn-right', () => touchInput.right = true, () => touchInput.right = false);

setupMobileButton('btn-bait', deployBait, null);
setupMobileButton('btn-flare', deployFlare, null);
setupMobileButton('btn-march', toggleMarch, null);

// --- Main Update Loop ---
function update() {
    if (gameState !== 'PLAYING') return;

    // Scout Movement (Keyboard + Mobile D-Pad Support)
    if (keys['w'] || keys['arrowup'] || touchInput.up) scout.y -= scout.speed;
    if (keys['s'] || keys['arrowdown'] || touchInput.down) scout.y += scout.speed;
    if (keys['a'] || keys['arrowleft'] || touchInput.left) scout.x -= scout.speed;
    if (keys['d'] || keys['arrowright'] || touchInput.right) scout.x += scout.speed;

    scout.x = Math.max(scout.radius, Math.min(canvas.width - scout.radius, scout.x));
    scout.y = Math.max(scout.radius, Math.min(canvas.height - scout.radius, scout.y));

    // Scout Bridge Construction
    hazards.forEach(h => {
        if (scout.x > h.x - 15 && scout.x < h.x + h.w + 15 && scout.y > h.y && scout.y < h.y + h.h) {
            let exists = bridges.some(b => Math.abs(b.y - scout.y) < 30 && b.hazard === h);
            if (!exists) {
                bridges.push({ x: h.x, y: scout.y - 20, w: h.w, h: 40, hazard: h });
            }
        }
    });

    commander.x = mouse.x;
    commander.y = mouse.y;

    baits.forEach((b, index) => {
        b.duration--;
        if (b.duration <= 0) baits.splice(index, 1);
    });

    flares.forEach((f, index) => {
        f.duration--;
        if (f.duration <= 0) flares.splice(index, 1);
    });

    let savedCount = 0;
    swarms.forEach(s => {
        if (!s.alive) return;
        s.update();

        hazards.forEach(h => {
            if (s.x > h.x && s.x < h.x + h.w && s.y > h.y && s.y < h.y + h.h) {
                let onBridge = bridges.some(b => s.x >= b.x && s.x <= b.x + b.w && s.y >= b.y && s.y <= b.y + b.h);
                if (!onBridge) {
                    s.alive = false;
                    swarmCount--;
                    updateHUD();
                }
            }
        });

        if (s.x > exitZone.x && s.x < exitZone.x + exitZone.w &&
            s.y > exitZone.y && s.y < exitZone.y + exitZone.h) {
            savedCount++;
        }
    });

    predators.forEach(p => p.update(swarms, baits, flares));

    if (swarmCount <= 0) {
        endGame(false, "Your entire swarm was wiped out!");
    } else if (savedCount >= Math.floor(totalSwarm * 0.6)) {
        endGame(true, `You successfully escorted ${savedCount} swarmers to safety!`);
    }
}

function endGame(win, message) {
    gameState = win ? 'WON' : 'LOST';
    const screen = document.getElementById('game-over-screen');
    const title = document.getElementById('game-over-title');
    const desc = document.getElementById('game-over-desc');

    title.innerText = win ? "MISSION ACCOMPLISHED" : "MISSION FAILED";
    title.style.color = win ? "#00f0ff" : "#ff3366";
    desc.innerText = message;
    screen.classList.remove('hidden');
}

function resetGame() {
    init();
}

// --- Render Loop ---
function draw() {
    ctx.fillStyle = '#14161d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    hazards.forEach(h => {
        ctx.fillStyle = '#090a0d';
        ctx.fillRect(h.x, h.y, h.w, h.h);
        ctx.strokeStyle = 'rgba(255, 51, 102, 0.3)';
        ctx.strokeRect(h.x, h.y, h.w, h.h);
    });

    bridges.forEach(b => {
        ctx.fillStyle = '#4a5568';
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeStyle = '#00f0ff';
        ctx.strokeRect(b.x, b.y, b.w, b.h);
    });

    ctx.fillStyle = 'rgba(0, 240, 255, 0.15)';
    ctx.fillRect(exitZone.x, exitZone.y, exitZone.w, exitZone.h);
    ctx.strokeStyle = '#00f0ff';
    ctx.setLineDash([6, 6]);
    ctx.strokeRect(exitZone.x, exitZone.y, exitZone.w, exitZone.h);
    ctx.setLineDash([]);
    
    ctx.fillStyle = '#00f0ff';
    ctx.font = '12px sans-serif';
    ctx.fillText('ESCAPE ZONE', exitZone.x + 2, exitZone.y - 8);

    baits.forEach(b => {
        ctx.fillStyle = '#ffaa00';
        ctx.beginPath();
        ctx.arc(b.x, b.y, 8, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.strokeStyle = 'rgba(255, 170, 0, 0.4)';
        ctx.beginPath();
        ctx.arc(b.x, b.y, 15 + Math.sin(Date.now() * 0.01) * 5, 0, Math.PI * 2);
        ctx.stroke();
    });

    flares.forEach(f => {
        ctx.fillStyle = 'rgba(170, 0, 255, 0.2)';
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#aa00ff';
        ctx.beginPath();
        ctx.arc(f.x, f.y, 6, 0, Math.PI * 2);
        ctx.fill();
    });

    swarms.forEach(s => s.draw());
    predators.forEach(p => p.draw());

    if (commander.isMarching) {
        ctx.strokeStyle = 'rgba(0, 240, 255, 0.3)';
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(scout.x, scout.y);
        ctx.lineTo(commander.x, commander.y);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    ctx.strokeStyle = commander.isMarching ? '#00f0ff' : '#ff3366';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(commander.x, commander.y, 12, 0, Math.PI * 2);
    ctx.stroke();
    ctx.lineWidth = 1;

    ctx.fillStyle = scout.color;
    ctx.beginPath();
    ctx.arc(scout.x, scout.y, scout.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.stroke();
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

init();
loop();
</script>
    <script>window.GAME_NAME = "Swarm Shepherd";</script>
    <script src="analytics.js" defer></script>
</body>
</html>
