<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rover Rush — Lunar Buggy</title>
<style>
    :root {
        --rover-yellow: #d99b26;
        --panel-bg: rgba(10, 12, 18, 0.72);
        --panel-border: rgba(255, 255, 255, 0.12);
    }

    body {
        margin: 0;
        padding: 0;
        background-color: #030406;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
    }

    .stage {
        position: relative;
        width: 900px;
        height: 520px;
        border-radius: 12px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        overflow: hidden;
        background: #05070a;
    }

    canvas {
        display: block;
        width: 100%;
        height: 100%;
    }

    /* --- HUD --- */
    .hud {
        position: absolute;
        top: 0; left: 0; right: 0;
        display: flex;
        justify-content: space-between;
        padding: 12px 16px;
        pointer-events: none;
        font-family: 'Consolas', 'Courier New', monospace;
    }

    .hud-panel {
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        padding: 8px 14px;
        color: #e8e9ec;
        backdrop-filter: blur(2px);
    }

    .hud-label {
        font-size: 9px;
        letter-spacing: 1px;
        color: #9aa0a8;
        text-transform: uppercase;
    }

    .hud-value {
        font-size: 18px;
        font-weight: bold;
        color: #fff;
    }

    .hud-right { text-align: right; }

    .hint {
        position: absolute;
        bottom: 12px;
        left: 0; right: 0;
        text-align: center;
        color: rgba(232,233,236,0.55);
        font-size: 11px;
        letter-spacing: 0.5px;
        pointer-events: none;
        font-family: 'Consolas', 'Courier New', monospace;
    }

    /* --- Overlays --- */
    .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: rgba(3, 4, 6, 0.72);
        text-align: center;
        color: #e8e9ec;
        transition: opacity 0.25s ease;
    }

    .overlay.hidden {
        opacity: 0;
        pointer-events: none;
    }

    .overlay h1 {
        margin: 0 0 6px 0;
        font-size: 34px;
        letter-spacing: 1px;
        color: #fff;
        text-shadow: 0 0 20px rgba(217, 155, 38, 0.5);
    }

    .go-btn {
        background: linear-gradient(180deg, #f0b13c, var(--rover-yellow));
        border: none;
        color: #221a08;
        font-weight: bold;
        font-size: 15px;
        letter-spacing: 1px;
        padding: 12px 34px;
        border-radius: 30px;
        cursor: pointer;
        box-shadow: 0 6px 18px rgba(217, 155, 38, 0.35);
    }
    .go-btn:hover { filter: brightness(1.08); }

    .crash-title {
        color: #ff6b5b;
        text-shadow: 0 0 20px rgba(255, 107, 91, 0.6);
    }

    .stat-row {
        display: flex;
        gap: 30px;
        margin-bottom: 22px;
    }
    .stat-box { text-align: center; }
    .stat-box .n { font-size: 26px; font-weight: bold; color: #fff; }
    .stat-box .l { font-size: 10px; letter-spacing: 1.5px; color: #9aa0a8; text-transform: uppercase; }

    .flash {
        position: absolute;
        inset: 0;
        background: #fff;
        opacity: 0;
        pointer-events: none;
    }
</style>
</head>
<body>

    <div class="stage" id="stage">
        <canvas id="gameCanvas" width="900" height="520"></canvas>
        <div class="flash" id="flash"></div>

        <div class="hud">
            <div class="hud-panel">
                <div class="hud-label">Distance</div>
                <div class="hud-value"><span id="distanceVal">0</span> m</div>
            </div>
            <div class="hud-panel hud-right">
                <div class="hud-label">Best</div>
                <div class="hud-value"><span id="bestVal">0</span> m</div>
            </div>
        </div>

        <div class="hint">&rarr; gas &nbsp;&middot;&nbsp; &larr; brake / reverse &nbsp;&middot;&nbsp; gas hard enough on the ground and you'll wheelie — the rover auto-levels in the air</div>

        <div class="overlay hidden" id="crashScreen">
            <h1 class="crash-title">ROVER DOWN</h1>
            <div class="stat-row">
                <div class="stat-box"><div class="n" id="finalDist">0</div><div class="l">Meters</div></div>
                <div class="stat-box"><div class="n" id="bestDist">0</div><div class="l">Best</div></div>
            </div>
            <button class="go-btn" id="retryBtn">RETRY</button>
        </div>
    </div>

<script>
(function () {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;

    const distanceVal = document.getElementById('distanceVal');
    const bestVal = document.getElementById('bestVal');
    const crashScreen = document.getElementById('crashScreen');
    const retryBtn = document.getElementById('retryBtn');
    const finalDist = document.getElementById('finalDist');
    const bestDistEl = document.getElementById('bestDist');
    const flashEl = document.getElementById('flash');

    // ---------------------------------------------------------------
    // Constants
    // ---------------------------------------------------------------
    const GROUND_BASE = 330;
    const WHEEL_RADIUS = 15;
    const HALF_WHEELBASE = 56; // rear/front wheel offset — the middle wheel sits at 0
    const RIDE_LIFT = 18; // how high the body rides above the axle line
    const SCALE = 10; // world px per "meter"
    const CAMERA_MARGIN = 100; // keep the rover at least this far from the top/bottom edge
    const GROUND_BOTTOM_MARGIN = 60; // the ground below the rover must always stay at least this far from the bottom edge

    const MAX_SPEED = 6.4;
    const MAX_REVERSE_SPEED = 3.4;

    const GRAVITY = 0.14; // low lunar gravity — big, floaty air

    // Hill-Climb-style rigid body: each wheel is an independent spring against
    // the terrain, and the chassis's rotation is a real physical consequence
    // of those spring forces (and their lever arms) — never scripted to match
    // the slope. The gas pedal applies engine torque directly to the chassis
    // (not just the wheels), which is what causes the classic "gas makes you
    // wheelie" feel, and that same torque keeps working when you're airborne,
    // so gas/brake also control your rotation mid-flight.
    const INERTIA = 700; // rotational "mass" — resistance to torque
    const MAX_COMPRESS = 14; // suspension travel pushed in
    const MAX_DROOP = 22; // suspension travel drooped out (keeps wheels grounded over dips)
    const SPRING_K = 2.2;
    const SPRING_DAMP = 0.9;
    const MAX_DAMP_RATE = 8; // caps how much a single hard, fast impact can spike the
    // damper force — without this, a wheel that compresses very quickly (a hard
    // landing) computes an enormous instantaneous rate of change, which blows the
    // spring force up to 5-10x its normal max and launches/spins the rover
    // unrealistically. Capping it means an impact gets absorbed by the suspension
    // instead of catapulting or flinging the chassis.
    const DRIVE_FORCE = 0.34;
    const ENGINE_TORQUE = 3.0; // wheelie torque while a wheel is on the ground
    const ROLL_FRICTION = 0.05; // gentle coast-down friction when off the throttle
    const ANGULAR_DAMPING_GROUND = 0.85; // tires/suspension resist rotation
    const ANGULAR_DAMPING_AIR = 0.995; // floaty, slow tumble in the air
    const PHYSICS_SUBSTEPS = 8; // the spring is stiff enough that it needs finer integration steps than one per frame to stay stable

    // Airborne is entirely auto-level — no manual pitch control. This is a
    // spring-damper pulling the chassis back toward upright (angle 0), so it
    // naturally rights itself and comes down on its wheels.
    const AUTO_LEVEL_STIFFNESS = 14;
    const AUTO_LEVEL_DAMPING = 190;

    const CRASH_FLIP_ANGLE = 2.62; // radians (~150deg) — genuinely upside down, not just past 90

    // ---------------------------------------------------------------
    // Deterministic pseudo-random helpers (stable terrain / decor)
    // ---------------------------------------------------------------
    function hash(n) {
        const x = Math.sin(n * 12.9898) * 43758.5453;
        return x - Math.floor(x);
    }

    function terrainHeight(x) {
        return GROUND_BASE
            + Math.sin(x * 0.0018 + 3.1) * 20
            + craterProfile(x)
            + rampBump(x);
    }

    function rampBump(x) {
        const period = 640;
        const width = 130;
        // phase-shifted so the first ramp isn't right at the spawn point
        const t = ((x + 380) % period + period) % period;
        if (t < width) {
            const p = t / width;
            // raised-cosine hump: zero value AND zero slope at both ends,
            // so it blends smoothly into the terrain with no crease
            return (1 - Math.cos(p * Math.PI * 2)) * 0.5 * 58;
        }
        return 0;
    }

    // Crater dips: flat bottom, then a smooth (zero-slope-at-both-ends) wall
    // rounding up to a slightly raised lip at the rim, then tapering back to
    // the base level — a real crater profile, not just a sine-wave valley,
    // and one gentle enough on the walls to drive back out of.
    function craterShape(d) {
        const FLAT_R = 0.15, WALL_R = 0.55; // fractions of the crater radius
        const DEPTH = 28, LIP = 8;
        if (d <= FLAT_R) return DEPTH;
        if (d <= WALL_R) {
            const t = (d - FLAT_R) / (WALL_R - FLAT_R);
            const s = t * t * (3 - 2 * t); // smoothstep
            return DEPTH + s * (-LIP - DEPTH);
        }
        if (d <= 1) {
            const t = (d - WALL_R) / (1 - WALL_R);
            const s = t * t * (3 - 2 * t);
            return -LIP * (1 - s);
        }
        return 0;
    }

    function craterProfile(x) {
        const period = 580;
        const radius = 140;
        const phase = 250; // phase-shifted so the first crater isn't right at spawn
        const t = ((x + phase) % period + period) % period;
        if (t < radius * 2) {
            return craterShape(Math.abs(t - radius) / radius);
        }
        return 0;
    }

    function terrainAngle(x) {
        const eps = 2;
        const dy = terrainHeight(x + eps) - terrainHeight(x - eps);
        return Math.atan2(dy, eps * 2);
    }

    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
    function lerp(a, b, t) { return a + (b - a) * t; }
    function normalizeAngle(a) {
        while (a > Math.PI) a -= Math.PI * 2;
        while (a < -Math.PI) a += Math.PI * 2;
        return a;
    }

    // ---------------------------------------------------------------
    // Game state
    // ---------------------------------------------------------------
    let best = 0;
    try { best = parseFloat(localStorage.getItem('roverRushBest') || '0'); } catch (e) {}

    const input = { left: false, right: false };
    let state = 'playing'; // playing | crashed

    let rover, camera, particles, screenShake, lastTime, accumulator;

    function resetGame() {
        const startX = 120;
        const startAngle = terrainAngle(startX);
        const startY = terrainHeight(startX) - WHEEL_RADIUS;
        rover = {
            worldX: startX,
            y: startY,
            vx: 0,
            vy: 0,
            angle: startAngle,
            angVel: 0,
            grounded: true,
            wheelSpin: 0,
            frontComp: 0,
            midComp: 0,
            rearComp: 0,
            // raw per-wheel suspension compression, pre-seeded to the actual
            // starting compression so the first physics step doesn't see a
            // spurious damper spike from comparing against an unseeded 0
            rearRaw: 0,
            midRaw: 0,
            frontRaw: 0
        };
        const cosA0 = Math.cos(startAngle), sinA0 = Math.sin(startAngle);
        [['rearRaw', -HALF_WHEELBASE], ['midRaw', 0], ['frontRaw', HALF_WHEELBASE]].forEach(([key, lx]) => {
            const mwx = startX + cosA0 * lx;
            const mwy = startY + sinA0 * lx;
            rover[key] = findWheelCompression(mwx, mwy, cosA0, sinA0).comp;
        });
        camera = { x: 0, y: 0 };
        particles = [];
        screenShake = 0;
        lastTime = performance.now();
        accumulator = 0;
        bestVal.textContent = Math.floor(best);
    }

    // ---------------------------------------------------------------
    // Input
    // ---------------------------------------------------------------
    window.addEventListener('keydown', (e) => {
        if (e.code === 'ArrowLeft') { input.left = true; e.preventDefault(); }
        if (e.code === 'ArrowRight') { input.right = true; e.preventDefault(); }
        if (e.code === 'KeyR' && state === 'crashed') startGame();
    });
    window.addEventListener('keyup', (e) => {
        if (e.code === 'ArrowLeft') input.left = false;
        if (e.code === 'ArrowRight') input.right = false;
    });

    retryBtn.addEventListener('click', startGame);

    function startGame() {
        if (state === 'playing') return;
        resetGame();
        state = 'playing';
        crashScreen.classList.add('hidden');
    }

    function crash() {
        state = 'crashed';
        screenShake = 18;
        flashEl.style.transition = 'none';
        flashEl.style.opacity = '0.85';
        requestAnimationFrame(() => {
            flashEl.style.transition = 'opacity 0.4s ease';
            flashEl.style.opacity = '0';
        });

        const dist = Math.floor(rover.worldX / SCALE);
        if (dist > best) {
            best = dist;
            try { localStorage.setItem('roverRushBest', String(best)); } catch (e) {}
        }
        finalDist.textContent = dist;
        bestDistEl.textContent = Math.floor(best);
        bestVal.textContent = Math.floor(best);
        crashScreen.classList.remove('hidden');

        // tumbling debris
        for (let i = 0; i < 16; i++) {
            particles.push({
                x: rover.worldX, y: rover.y,
                vx: (Math.random() - 0.5) * 6,
                vy: -Math.random() * 6 - 1,
                life: 40 + Math.random() * 20,
                size: 2 + Math.random() * 3,
                color: Math.random() < 0.5 ? '#cdd3db' : '#d99b26'
            });
        }
    }

    // ---------------------------------------------------------------
    // Update
    // ---------------------------------------------------------------
    const WHEEL_MOUNTS = [
        { key: 'rearRaw', lx: -HALF_WHEELBASE },
        { key: 'midRaw', lx: 0 },
        { key: 'frontRaw', lx: HALF_WHEELBASE }
    ];

    // Finds how compressed/drooped a wheel's suspension is by searching along
    // the chassis's actual local-down direction for where it crosses the
    // terrain surface. A simple gap/cos(angle) projection blows up near 90°
    // (dividing by ~0) and falsely reports wheels as "touching" when the
    // rover is just spinning sideways in the air — this bisection works
    // correctly at any orientation, including upside down.
    function wheelGap(mountWX, mountWY, cosA, sinA, d) {
        const px = mountWX - sinA * d;
        const py = mountWY + cosA * d;
        return (terrainHeight(px) - WHEEL_RADIUS) - py;
    }

    function findWheelCompression(mountWX, mountWY, cosA, sinA) {
        const dMin = -MAX_COMPRESS, dMax = MAX_DROOP;
        const gapAtMin = wheelGap(mountWX, mountWY, cosA, sinA, dMin);
        const gapAtMax = wheelGap(mountWX, mountWY, cosA, sinA, dMax);

        if (gapAtMin <= 0) return { touching: true, comp: MAX_COMPRESS }; // bottomed out
        if (gapAtMax > 0) return { touching: false, comp: -MAX_DROOP }; // never reaches the ground

        // gap changes sign somewhere in [dMin, dMax] — bisect to find it
        let lo = dMin, hi = dMax;
        for (let i = 0; i < 8; i++) {
            const mid = (lo + hi) / 2;
            const g = wheelGap(mountWX, mountWY, cosA, sinA, mid);
            if (g > 0) lo = mid; else hi = mid;
        }
        const d = (lo + hi) / 2;
        return { touching: true, comp: clamp(-d, -MAX_DROOP, MAX_COMPRESS) };
    }

    // One physics substep: real spring forces at each wheel, real torque
    // from their lever arms, real engine-reaction torque from the throttle.
    // Nothing here scripts the chassis toward the terrain slope — rotation
    // is entirely a consequence of the forces below, the same way a
    // suspension-and-wheelie-driven game like Hill Climb Racing works.
    function physicsSubstep(sdt) {
        const cosA = Math.cos(rover.angle), sinA = Math.sin(rover.angle);

        let netFx = 0, netFy = GRAVITY;
        let netT = 0;
        let anyTouch = false;

        for (const wheel of WHEEL_MOUNTS) {
            const mwx = rover.worldX + cosA * wheel.lx;
            const mwy = rover.y + sinA * wheel.lx;
            const { touching, comp } = findWheelCompression(mwx, mwy, cosA, sinA);
            if (touching) anyTouch = true;

            const rate = clamp((comp - rover[wheel.key]) / sdt, -MAX_DAMP_RATE, MAX_DAMP_RATE);
            const forceMag = touching ? Math.max(0, SPRING_K * comp + SPRING_DAMP * rate) : 0;
            rover[wheel.key] = comp;

            netFy -= forceMag;
            netT += -(mwx - rover.worldX) * forceMag;
        }

        if (anyTouch) {
            if (input.right && !input.left) {
                netFx += DRIVE_FORCE * cosA;
                netFy += DRIVE_FORCE * sinA;
                netT += -ENGINE_TORQUE;
            } else if (input.left && !input.right) {
                netFx -= DRIVE_FORCE * cosA;
                netFy -= DRIVE_FORCE * sinA;
                netT += ENGINE_TORQUE;
            } else if (rover.vx !== 0) {
                netFx -= Math.sign(rover.vx) * ROLL_FRICTION;
            }
        } else {
            // auto-level: a spring-damper pulling the chassis back toward
            // upright, so it rights itself and lands on its wheels without
            // any input — gas/brake have no effect while airborne
            const levelError = normalizeAngle(rover.angle);
            netT += -AUTO_LEVEL_STIFFNESS * levelError - AUTO_LEVEL_DAMPING * rover.angVel;
        }

        rover.vx += netFx * sdt;
        rover.vy += netFy * sdt;
        rover.angVel += (netT / INERTIA) * sdt;

        const angDamp = anyTouch ? ANGULAR_DAMPING_GROUND : ANGULAR_DAMPING_AIR;
        rover.angVel *= Math.pow(angDamp, sdt);
        rover.vx = clamp(rover.vx, -MAX_REVERSE_SPEED, MAX_SPEED);

        rover.worldX += rover.vx * sdt;
        rover.y += rover.vy * sdt;
        rover.angle += rover.angVel * sdt;

        return anyTouch;
    }

    function update(dt) {
        const wasGrounded = rover.grounded;
        let anyTouch = rover.grounded;
        const sdt = dt / PHYSICS_SUBSTEPS;

        for (let i = 0; i < PHYSICS_SUBSTEPS; i++) {
            anyTouch = physicsSubstep(sdt);

            // crash only when a wheel is actually touching the ground AND
            // the rover is upside down — any other landing, however hard or
            // steep, just bounces on the suspension
            if (anyTouch && Math.abs(normalizeAngle(rover.angle)) > CRASH_FLIP_ANGLE) {
                crash();
                return;
            }
        }

        rover.grounded = anyTouch;
        rover.wheelSpin += rover.vx * 0.09 * dt;

        // just touched down — a little screen shake proportional to impact
        if (anyTouch && !wasGrounded) {
            screenShake = Math.max(screenShake, Math.min(8, Math.abs(rover.vy)));
        }

        // dust while driving on the ground
        if (anyTouch && Math.abs(rover.vx) > 0.5 && Math.random() < 0.5) {
            particles.push({
                x: rover.worldX - Math.sign(rover.vx) * HALF_WHEELBASE,
                y: terrainHeight(rover.worldX) - 3,
                vx: -rover.vx * 0.3 + (Math.random() - 0.5),
                vy: -Math.random() * 1.2,
                life: 20 + Math.random() * 10,
                size: 1.5 + Math.random() * 2,
                color: 'rgba(180,180,190,0.5)'
            });
        }

        // visual wheel offsets mirror the real physics compression directly
        rover.rearComp = -rover.rearRaw;
        rover.midComp = -rover.midRaw;
        rover.frontComp = -rover.frontRaw;

        // particles
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vy += 0.12 * dt;
            p.life -= dt;
            if (p.life <= 0) particles.splice(i, 1);
        }

        camera.x = rover.worldX - 260;

        // vertical camera: drifts back to the normal ground-level framing
        // whenever there's slack, but is hard-clamped so the rover can
        // never leave the safe viewing band — a soft lerp alone can't
        // guarantee this because a fast ascent/descent keeps moving the
        // target faster than the lerp closes the gap. The ground directly
        // below the rover is a second, independent floor so it's always
        // still visible near the bottom of the screen while airborne, even
        // if that means the rover itself sits higher up the frame.
        camera.y += (0 - camera.y) * clamp(0.06 * dt, 0, 1);
        const groundHere = terrainHeight(rover.worldX);
        const minCameraY = Math.max(
            rover.y - (H - CAMERA_MARGIN),
            groundHere - (H - GROUND_BOTTOM_MARGIN)
        );
        camera.y = clamp(camera.y, minCameraY, rover.y - CAMERA_MARGIN);

        if (screenShake > 0) screenShake = Math.max(0, screenShake - dt * 0.8);

        distanceVal.textContent = Math.floor(rover.worldX / SCALE);
    }

    // ---------------------------------------------------------------
    // Drawing
    // ---------------------------------------------------------------
    function drawSky() {
        const grad = ctx.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, '#020204');
        grad.addColorStop(0.55, '#080a0f');
        grad.addColorStop(1, '#12161f');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        // stars (parallax)
        const starOffset = (camera.x * 0.02) % 60;
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        for (let i = 0; i < 70; i++) {
            const sx = (i * 53 - starOffset * 3) % (W + 60) - 30;
            const sy = (hash(i) * H * 0.65);
            const r = hash(i * 3.1) > 0.85 ? 1.6 : 0.9;
            ctx.globalAlpha = 0.4 + hash(i * 7.2) * 0.6;
            ctx.beginPath();
            ctx.arc(((sx % (W + 60)) + (W + 60)) % (W + 60) - 30, sy, r, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;

        // Earth
        const earthX = 700 - camera.x * 0.04;
        ctx.save();
        ctx.translate(((earthX % (W + 200)) + (W + 200)) % (W + 200) - 100, 70);
        const eg = ctx.createRadialGradient(-8, -8, 4, 0, 0, 24);
        eg.addColorStop(0, '#7ec2ff');
        eg.addColorStop(0.6, '#2f6fe0');
        eg.addColorStop(1, '#1b3f9c');
        ctx.fillStyle = eg;
        ctx.beginPath(); ctx.arc(0, 0, 24, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.beginPath(); ctx.ellipse(-6, -4, 9, 5, 0.4, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(8, 6, 6, 3, -0.3, 0, Math.PI * 2); ctx.fill();
        ctx.restore();

        // distant mountains (parallax)
        ctx.fillStyle = '#181b21';
        ctx.beginPath();
        ctx.moveTo(0, 260);
        const mOffset = camera.x * 0.25;
        for (let x = 0; x <= W; x += 30) {
            const wx = x + mOffset;
            const y = 230 + Math.sin(wx * 0.006) * 26 + Math.sin(wx * 0.014 + 2) * 10;
            ctx.lineTo(x, y);
        }
        ctx.lineTo(W, 320); ctx.lineTo(0, 320);
        ctx.closePath();
        ctx.fill();
    }

    function drawTerrain() {
        ctx.beginPath();
        ctx.moveTo(0, H);
        for (let sx = 0; sx <= W; sx += 5) {
            const wx = camera.x + sx;
            ctx.lineTo(sx, terrainHeight(wx) - camera.y);
        }
        ctx.lineTo(W, H);
        ctx.closePath();
        const g = ctx.createLinearGradient(0, GROUND_BASE - 90, 0, H);
        g.addColorStop(0, '#3a3d44');
        g.addColorStop(0.35, '#24262b');
        g.addColorStop(1, '#121316');
        ctx.fillStyle = g;
        ctx.fill();

        // rim highlight
        ctx.beginPath();
        for (let sx = 0; sx <= W; sx += 5) {
            const wx = camera.x + sx;
            const y = terrainHeight(wx) - camera.y;
            if (sx === 0) ctx.moveTo(sx, y); else ctx.lineTo(sx, y);
        }
        ctx.strokeStyle = 'rgba(180,185,195,0.35)';
        ctx.lineWidth = 2;
        ctx.stroke();

        // craters / rocks (deterministic by world bucket)
        const spacing = 70;
        const startBucket = Math.floor(camera.x / spacing) - 1;
        const endBucket = Math.floor((camera.x + W) / spacing) + 1;
        for (let b = startBucket; b <= endBucket; b++) {
            const wx = b * spacing + hash(b) * spacing;
            const sx = wx - camera.x;
            if (sx < -30 || sx > W + 30) continue;
            const wy = terrainHeight(wx) - camera.y;
            const size = 3 + hash(b * 3.3) * 7;
            if (hash(b * 5.7) > 0.5) {
                ctx.fillStyle = 'rgba(0,0,0,0.35)';
                ctx.beginPath();
                ctx.ellipse(sx, wy + 2, size, size * 0.4, 0, 0, Math.PI * 2);
                ctx.fill();
            } else {
                ctx.fillStyle = '#4a4d54';
                ctx.beginPath();
                ctx.ellipse(sx, wy - size * 0.3, size * 0.6, size * 0.5, 0, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }

    function drawParticles() {
        for (const p of particles) {
            const sx = p.x - camera.x;
            const sy = p.y - camera.y;
            ctx.globalAlpha = clamp(p.life / 25, 0, 1);
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(sx, sy, p.size, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    }

    function drawWheel(cx, cy, spin) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.fillStyle = 'rgba(0,0,0,0.35)';
        ctx.beginPath(); ctx.ellipse(0, WHEEL_RADIUS + 2, WHEEL_RADIUS * 0.9, 4, 0, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = '#1c1e22';
        ctx.beginPath(); ctx.arc(0, 0, WHEEL_RADIUS, 0, Math.PI * 2); ctx.fill();
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#333842';
        ctx.setLineDash([3, 3]);
        ctx.beginPath(); ctx.arc(0, 0, WHEEL_RADIUS - 1.5, 0, Math.PI * 2); ctx.stroke();
        ctx.setLineDash([]);

        ctx.rotate(spin);
        ctx.fillStyle = '#c7cbd2';
        ctx.beginPath(); ctx.arc(0, 0, WHEEL_RADIUS * 0.42, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#5a5f68';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.strokeStyle = '#33363c';
        ctx.lineWidth = 2;
        for (let i = 0; i < 3; i++) {
            ctx.beginPath();
            const a = i * (Math.PI * 2 / 3);
            ctx.moveTo(Math.cos(a) * 2, Math.sin(a) * 2);
            ctx.lineTo(Math.cos(a) * WHEEL_RADIUS * 0.4, Math.sin(a) * WHEEL_RADIUS * 0.4);
            ctx.stroke();
        }
        ctx.restore();
    }

    function drawSuspensionArm(mountX, mountY, wheelX, wheelY) {
        ctx.strokeStyle = '#2a2d34';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(mountX, mountY - 3); ctx.lineTo(wheelX, wheelY - 2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(mountX, mountY + 4); ctx.lineTo(wheelX, wheelY + 3); ctx.stroke();

        // little coil shock
        ctx.strokeStyle = '#6b7280';
        ctx.lineWidth = 1.5;
        const steps = 4;
        ctx.beginPath();
        for (let i = 0; i <= steps; i++) {
            const t = i / steps;
            const px = lerp(mountX, wheelX, t);
            const py = lerp(mountY - 3, wheelY - 2, t) + (i % 2 === 0 ? -2 : 2);
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();
    }

    function drawRover(x, y, angle, frontComp, midComp, rearComp, spin) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);

        const fx = HALF_WHEELBASE, fy = frontComp;
        const rx = -HALF_WHEELBASE, ry = rearComp;
        const mx = 0, my = midComp;

        // rear wheel first (behind body) — arm drawn under the wheel, same as
        // the front wheel, so all three wheels read identically
        drawSuspensionArm(-38, -10 - RIDE_LIFT, rx, ry);
        drawWheel(rx, ry, spin);

        // middle wheel (also behind body) — six wheels total, three per side
        drawSuspensionArm(0, -8 - RIDE_LIFT, mx, my);
        drawWheel(mx, my, spin);

        // the cabin rides high above the axle line on tall, loose suspension
        ctx.save();
        ctx.translate(0, -RIDE_LIFT);

        // skid plate / undercarriage
        ctx.fillStyle = '#15171a';
        ctx.beginPath();
        ctx.roundRect(-58, -8, 116, 10, 4);
        ctx.fill();

        // main sporty wedge body
        const bodyGrad = ctx.createLinearGradient(0, -46, 0, -4);
        bodyGrad.addColorStop(0, '#eef0f3');
        bodyGrad.addColorStop(0.55, '#cfd2d9');
        bodyGrad.addColorStop(1, '#9aa0a8');
        ctx.fillStyle = bodyGrad;
        ctx.beginPath();
        ctx.moveTo(-52, -8);
        ctx.lineTo(-48, -30);
        ctx.quadraticCurveTo(-40, -38, -22, -39);
        ctx.lineTo(6, -37);
        ctx.quadraticCurveTo(24, -34, 32, -26);
        ctx.lineTo(56, -12);
        ctx.quadraticCurveTo(60, -8, 54, -4);
        ctx.lineTo(-50, -4);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#7b818a';
        ctx.lineWidth = 1;
        ctx.stroke();

        // racing stripe
        ctx.fillStyle = 'rgba(217,155,38,0.85)';
        ctx.beginPath();
        ctx.moveTo(-40, -30);
        ctx.lineTo(-30, -30);
        ctx.lineTo(10, -10);
        ctx.lineTo(-2, -10);
        ctx.closePath();
        ctx.fill();

        // side vent / panel line
        ctx.strokeStyle = 'rgba(0,0,0,0.18)';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(-46, -14); ctx.lineTo(30, -14); ctx.stroke();

        // roll cage
        ctx.strokeStyle = '#4b4f57';
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-30, -37);
        ctx.lineTo(-32, -64);
        ctx.lineTo(2, -66);
        ctx.lineTo(4, -36);
        ctx.stroke();
        ctx.strokeStyle = '#8a8f99';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(-30, -37); ctx.lineTo(-32, -64); ctx.lineTo(2, -66); ctx.lineTo(4, -36);
        ctx.stroke();

        // antenna
        ctx.strokeStyle = '#9aa0a8';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(-40, -34); ctx.lineTo(-58, -60); ctx.stroke();
        ctx.fillStyle = '#ff5c4d';
        ctx.beginPath(); ctx.arc(-58, -60, 2, 0, Math.PI * 2); ctx.fill();

        // rear equipment pod
        ctx.fillStyle = '#b7bcc4';
        ctx.beginPath();
        ctx.roundRect(-64, -22, 16, 16, 3);
        ctx.fill();
        ctx.strokeStyle = '#6b7280'; ctx.lineWidth = 1; ctx.stroke();
        ctx.fillStyle = '#d99b26';
        ctx.beginPath(); ctx.arc(-56, -14, 2.5, 0, Math.PI * 2); ctx.fill();

        // ---- astronaut driver ----
        ctx.save();
        ctx.translate(-14, -14);

        // torso / PLSS backpack peek
        ctx.fillStyle = '#c7cbd2';
        ctx.beginPath(); ctx.roundRect(-11, -22, 12, 10, 3); ctx.fill();

        // torso
        ctx.fillStyle = '#f2f3f5';
        ctx.beginPath(); ctx.roundRect(-9, -26, 17, 20, 6); ctx.fill();
        ctx.strokeStyle = '#c3c7cf'; ctx.lineWidth = 1; ctx.stroke();

        // chest control box
        ctx.fillStyle = '#8a8f99';
        ctx.beginPath(); ctx.roundRect(-4, -20, 8, 6, 1.5); ctx.fill();

        // arm reaching to steering grip
        ctx.strokeStyle = '#f2f3f5';
        ctx.lineWidth = 4.5;
        ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(6, -16); ctx.lineTo(20, -20); ctx.stroke();
        ctx.fillStyle = '#3a3d44';
        ctx.beginPath(); ctx.arc(21, -21, 3, 0, Math.PI * 2); ctx.fill();

        // helmet
        ctx.translate(0, -34);
        ctx.fillStyle = '#f5f6f8';
        ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#c3c7cf'; ctx.lineWidth = 1.2; ctx.stroke();

        // gold visor
        const visorGrad = ctx.createLinearGradient(-8, -6, 8, 8);
        visorGrad.addColorStop(0, '#ffe08a');
        visorGrad.addColorStop(0.5, '#e0a53a');
        visorGrad.addColorStop(1, '#8a5a1c');
        ctx.fillStyle = visorGrad;
        ctx.beginPath(); ctx.ellipse(1, 1, 8, 7.5, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.beginPath(); ctx.ellipse(-3, -3, 2.6, 1.4, -0.4, 0, Math.PI * 2); ctx.fill();

        // helmet comms light
        ctx.fillStyle = '#ff5c4d';
        ctx.beginPath(); ctx.arc(9, -2, 1.6, 0, Math.PI * 2); ctx.fill();

        ctx.restore(); // astronaut

        // headlights
        ctx.save();
        ctx.translate(50, -10);
        ctx.shadowColor = '#bfe0ff';
        ctx.shadowBlur = 10;
        ctx.fillStyle = '#eaf4ff';
        ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.restore();

        // front bumper / brush guard
        ctx.strokeStyle = '#3a3d44';
        ctx.lineWidth = 3.5;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(38, -2); ctx.lineTo(58, -8); ctx.lineTo(58, -16);
        ctx.stroke();

        ctx.restore(); // end cabin lift

        // front wheel + arm (drawn last, in front)
        drawSuspensionArm(30, -10 - RIDE_LIFT, fx, fy);
        drawWheel(fx, fy, spin);

        ctx.restore();
    }

    // ---------------------------------------------------------------
    // Main loop
    // ---------------------------------------------------------------
    function frame(t) {
        const dtMs = Math.min(t - (lastTime || t), 250);
        lastTime = t;

        // fixed-timestep physics so behavior doesn't depend on the display's
        // refresh rate (a 120Hz/144Hz browser would otherwise integrate the
        // physics in smaller, more numerous steps than a 60Hz one and land
        // jumps differently for the exact same input)
        if (state === 'playing') {
            accumulator = Math.min(accumulator + dtMs / 16.6667, 5);
            while (accumulator >= 1) {
                update(1);
                accumulator -= 1;
            }
        }

        ctx.save();
        if (screenShake > 0.1) {
            ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
        }

        drawSky();
        drawTerrain();

        const roverScreenX = rover.worldX - camera.x;
        const roverScreenY = rover.y - camera.y;
        drawRover(roverScreenX, roverScreenY, rover.angle, rover.frontComp, rover.midComp, rover.rearComp, rover.wheelSpin);
        drawParticles();

        ctx.restore();

        requestAnimationFrame(frame);
    }

    resetGame();
    requestAnimationFrame(frame);
})();
</script>

</body>
</html>
