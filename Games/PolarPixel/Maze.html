<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polar Pixel – Maze</title>
    <style>
      html, body { touch-action: manipulation; }
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.75);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --btn-hover: rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px;
        }

        .app-shell {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 1100px;
        }

        .game-menu {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 180px;
            flex-shrink: 0;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            padding: 16px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            position: sticky;
            top: 20px;
        }

        .menu-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .menu-link {
            display: block;
            padding: 10px 12px;
            border-radius: 8px;
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            border: 1px solid transparent;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .menu-link:hover {
            background: var(--btn-hover);
        }

        .menu-link.active {
            background: rgba(56, 189, 248, 0.15);
            border-color: rgba(56, 189, 248, 0.4);
            color: var(--accent-color);
        }

        @media (max-width: 720px) {
            .app-shell {
                flex-direction: column;
                align-items: center;
            }

            .game-menu {
                flex-direction: row;
                width: 100%;
                max-width: 700px;
                overflow-x: auto;
                position: static;
                justify-content: center;
            }

            .menu-title {
                display: none;
            }
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            max-width: 900px;
            width: 100%;
        }

        header {
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        p.subtitle {
            font-size: 0.875rem;
            color: #94a3b8;
        }

        #canvas-container {
            position: relative;
            width: min(100%, 700px, 55vh);
            aspect-ratio: 1 / 1;
            background: #020617;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), inset 0 0 0 1px var(--border-color);
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            width: 100%;
            max-width: 700px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            padding: 16px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.2);
            padding: 6px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .group-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            margin-right: 4px;
            font-weight: 600;
        }

        #stats {
            font-size: 0.875rem;
            font-weight: 600;
        }

        button {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        button:hover {
            background: var(--btn-hover);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .directional-pad {
            display: grid;
            grid-template-columns: repeat(3, 32px);
            grid-template-rows: repeat(2, 32px);
            gap: 4px;
        }

        .directional-pad button {
            padding: 0;
            justify-content: center;
            align-items: center;
            width: 32px;
            height: 32px;
            border-radius: 6px;
        }

        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }

        .color-swatches {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            max-width: 180px;
        }

        .color-swatch {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.4);
            cursor: pointer;
            padding: 0;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .color-swatch:hover {
            transform: scale(1.15);
            border-color: #ffffff;
        }

        .btn-isolate {
            background: rgba(56, 189, 248, 0.15);
            border-color: rgba(56, 189, 248, 0.4);
            color: #38bdf8;
        }

        .btn-isolate:hover {
            background: rgba(56, 189, 248, 0.25);
        }

        .btn-reset {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.3);
            color: #f87171;
        }

        .btn-reset:hover {
            background: rgba(239, 68, 68, 0.25);
        }
    </style>
</head>
<body>

    <div class="app-shell">
        <nav class="game-menu" aria-label="Minigame versions">
            <span class="menu-title">Polar Pixel</span>
            <a href="FreePlay.html" class="menu-link">Free Play</a>
            <a href="Maze.html" class="menu-link active">Maze</a>
            <a href="MiniGolf.html" class="menu-link">Mini Golf</a>
            <a href="FollowTheLeader.html" class="menu-link">Follow the Leader</a>
            <a href="ShapeShifter.html" class="menu-link">Shape Shifter</a>
        </nav>

        <div class="container">
            <header>
                <h1>Polar Pixel — Maze</h1>
                <p class="subtitle">Steer the dots through the maze and drop them into the pit near the corner</p>
            </header>

            <div id="canvas-container">
                <canvas id="sandbox"></canvas>
            </div>

            <div class="controls">
                <!-- Magnetic Directional Controls -->
                <div class="control-group">
                    <span class="group-label">Magnet</span>
                    <div class="directional-pad">
                        <button class="btn-up" onclick="applyForce('up')" title="Pull Up">▲</button>
                        <button class="btn-left" onclick="applyForce('left')" title="Pull Left">◄</button>
                        <button class="btn-right" onclick="applyForce('right')" title="Pull Right">►</button>
                        <button class="btn-down" onclick="applyForce('down')" title="Pull Down">▼</button>
                    </div>
                </div>

                <!-- Spatial Sorting Controls -->
                <div class="control-group">
                    <span class="group-label">Position</span>
                    <button onclick="applyForce('center')">Center</button>
                    <button onclick="applyForce('edges')">Edges</button>
                </div>

                <!-- Color Extraction Control -->
                <div class="control-group">
                    <span class="group-label">Filter</span>
                    <div class="color-swatches" id="colorSwatches"></div>
                </div>

                <!-- Maze Control -->
                <div class="control-group">
                    <span class="group-label">Maze</span>
                    <button class="btn-isolate" onclick="newMaze()">New Layout</button>
                </div>

                <!-- Progress Readout -->
                <div class="control-group">
                    <span class="group-label">Progress</span>
                    <span id="stats">0 / 100 dropped in</span>
                </div>

                <!-- Reset Control -->
                <div class="control-group">
                    <button class="btn-reset" onclick="resetDots()">Shuffle All</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('sandbox');
        const ctx = canvas.getContext('2d');

        const NUM_DOTS = 100;
        const DOT_RADIUS = 10;
        const WALL_THICKNESS = 6;
        // Exactly 12 selectable colors, evenly spaced around the hue wheel
        const PALETTE = Array.from({ length: 12 }, (_, i) => i * 30);
        let dots = [];
        let width, height;

        // Currently active steering behavior ('center', 'edges', 'up', 'down',
        // 'left', 'right', 'isolate', or null for idle). Recomputed every frame
        // so dots decelerate into place instead of drifting forever.
        let currentMode = null;
        let isolateHue = null;

        // Maze layout state: a grid of cells with per-side walls, plus the
        // corner pit dots fall into once captured.
        let mazeCols, mazeRows, cellW, cellH, mazeCells, wallSegments, hole;
        let collectedCount = 0;

        // Ensure crisp rendering on high-DPI screens
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            width = canvas.width;
            height = canvas.height;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }

        // Carve a perfect maze with a recursive backtracker, then knock down
        // extra interior walls (braiding) so multiple paths exist instead of
        // one strict corridor — keeps the free-flowing sandbox feel while
        // still giving the dots walls to bump around.
        function generateMaze(logicalWidth, logicalHeight) {
            const targetCellSize = 72;
            mazeCols = Math.max(6, Math.round(logicalWidth / targetCellSize));
            mazeRows = Math.max(6, Math.round(logicalHeight / targetCellSize));
            cellW = logicalWidth / mazeCols;
            cellH = logicalHeight / mazeRows;

            mazeCells = [];
            for (let r = 0; r < mazeRows; r++) {
                const row = [];
                for (let c = 0; c < mazeCols; c++) {
                    row.push({ top: true, right: true, bottom: true, left: true, visited: false });
                }
                mazeCells.push(row);
            }

            const OPPOSITE = { top: 'bottom', right: 'left', bottom: 'top', left: 'right' };
            const stack = [{ c: 0, r: 0 }];
            mazeCells[0][0].visited = true;
            while (stack.length) {
                const { c, r } = stack[stack.length - 1];
                const neighbors = [];
                if (r > 0 && !mazeCells[r - 1][c].visited) neighbors.push({ c, r: r - 1, dir: 'top' });
                if (c < mazeCols - 1 && !mazeCells[r][c + 1].visited) neighbors.push({ c: c + 1, r, dir: 'right' });
                if (r < mazeRows - 1 && !mazeCells[r + 1][c].visited) neighbors.push({ c, r: r + 1, dir: 'bottom' });
                if (c > 0 && !mazeCells[r][c - 1].visited) neighbors.push({ c: c - 1, r, dir: 'left' });

                if (neighbors.length === 0) { stack.pop(); continue; }

                const next = neighbors[Math.floor(Math.random() * neighbors.length)];
                mazeCells[r][c][next.dir] = false;
                mazeCells[next.r][next.c][OPPOSITE[next.dir]] = false;
                mazeCells[next.r][next.c].visited = true;
                stack.push({ c: next.c, r: next.r });
            }

            const BRAID_CHANCE = 0.35;
            for (let r = 0; r < mazeRows; r++) {
                for (let c = 0; c < mazeCols; c++) {
                    if (c < mazeCols - 1 && mazeCells[r][c].right && Math.random() < BRAID_CHANCE) {
                        mazeCells[r][c].right = false;
                        mazeCells[r][c + 1].left = false;
                    }
                    if (r < mazeRows - 1 && mazeCells[r][c].bottom && Math.random() < BRAID_CHANCE) {
                        mazeCells[r][c].bottom = false;
                        mazeCells[r + 1][c].top = false;
                    }
                }
            }

            // The pit sits a cell in from the top-left corner — "just off"
            // the corner rather than sealed into it.
            hole = {
                x: 1.5 * cellW,
                y: 1.5 * cellH,
                radius: Math.min(cellW, cellH) * 0.38
            };

            buildWallSegments();
        }

        // Flatten the per-cell wall flags into a de-duplicated list of line
        // segments for drawing (each interior wall only stroked once).
        function buildWallSegments() {
            wallSegments = [];
            for (let r = 0; r < mazeRows; r++) {
                for (let c = 0; c < mazeCols; c++) {
                    const cell = mazeCells[r][c];
                    const x0 = c * cellW, y0 = r * cellH;
                    const x1 = x0 + cellW, y1 = y0 + cellH;
                    if (cell.top) wallSegments.push({ x1: x0, y1: y0, x2: x1, y2: y0 });
                    if (cell.left) wallSegments.push({ x1: x0, y1: y0, x2: x0, y2: y1 });
                    if (c === mazeCols - 1 && cell.right) wallSegments.push({ x1: x1, y1: y0, x2: x1, y2: y1 });
                    if (r === mazeRows - 1 && cell.bottom) wallSegments.push({ x1: x0, y1: y1, x2: x1, y2: y1 });
                }
            }
        }

        function drawMaze(context) {
            context.strokeStyle = 'rgba(56, 189, 248, 0.35)';
            context.lineWidth = WALL_THICKNESS;
            context.lineCap = 'round';
            wallSegments.forEach(seg => {
                context.beginPath();
                context.moveTo(seg.x1, seg.y1);
                context.lineTo(seg.x2, seg.y2);
                context.stroke();
            });

            const gradient = context.createRadialGradient(hole.x, hole.y, 0, hole.x, hole.y, hole.radius);
            gradient.addColorStop(0, '#000000');
            gradient.addColorStop(0.7, '#0a0a12');
            gradient.addColorStop(1, 'rgba(56, 189, 248, 0.45)');
            context.beginPath();
            context.arc(hole.x, hole.y, hole.radius, 0, Math.PI * 2);
            context.fillStyle = gradient;
            context.fill();
        }

        // Push a dot back out along the closest point of a wall segment,
        // and cancel the velocity component driving it into the wall.
        function resolveSegmentCollision(dot, x1, y1, x2, y2) {
            const dx = x2 - x1, dy = y2 - y1;
            const lenSq = dx * dx + dy * dy;
            let t = lenSq === 0 ? 0 : ((dot.x - x1) * dx + (dot.y - y1) * dy) / lenSq;
            t = Math.max(0, Math.min(1, t));
            const closestX = x1 + t * dx;
            const closestY = y1 + t * dy;
            const distX = dot.x - closestX;
            const distY = dot.y - closestY;
            const dist = Math.hypot(distX, distY);
            const minDist = dot.radius + WALL_THICKNESS / 2;
            if (dist === 0 || dist >= minDist) return;

            const nx = distX / dist, ny = distY / dist;
            const overlap = minDist - dist;
            dot.x += nx * overlap;
            dot.y += ny * overlap;

            const vDotN = dot.vx * nx + dot.vy * ny;
            if (vDotN < 0) {
                dot.vx -= vDotN * nx * 1.3;
                dot.vy -= vDotN * ny * 1.3;
            }
        }

        // Only test the walls of the cell a dot is currently in (plus its
        // neighbors) rather than every wall in the maze.
        function resolveWallCollisions(dot) {
            const col = Math.floor(dot.x / cellW);
            const row = Math.floor(dot.y / cellH);
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    const r = row + dr, c = col + dc;
                    if (r < 0 || r >= mazeRows || c < 0 || c >= mazeCols) continue;
                    const cell = mazeCells[r][c];
                    const x0 = c * cellW, y0 = r * cellH, x1 = x0 + cellW, y1 = y0 + cellH;
                    if (cell.top) resolveSegmentCollision(dot, x0, y0, x1, y0);
                    if (cell.bottom) resolveSegmentCollision(dot, x0, y1, x1, y1);
                    if (cell.left) resolveSegmentCollision(dot, x0, y0, x0, y1);
                    if (cell.right) resolveSegmentCollision(dot, x1, y0, x1, y1);
                }
            }
        }

        // Once a dot wanders close enough to the pit it gets sucked in and
        // shrunk away, counting toward the completed total.
        function updateHoleCapture() {
            for (let i = dots.length - 1; i >= 0; i--) {
                const dot = dots[i];
                if (!dot.capturing) {
                    const dist = Math.hypot(dot.x - hole.x, dot.y - hole.y);
                    if (dist < hole.radius * 0.7) dot.capturing = true;
                }
                if (dot.capturing) {
                    dot.x += (hole.x - dot.x) * 0.25;
                    dot.y += (hole.y - dot.y) * 0.25;
                    dot.radius *= 0.85;
                    if (dot.radius < 1) {
                        dots.splice(i, 1);
                        collectedCount++;
                        updateStats();
                    }
                }
            }
        }

        function updateStats() {
            const statsEl = document.getElementById('stats');
            if (!statsEl) return;
            statsEl.textContent = collectedCount >= NUM_DOTS
                ? 'All balls dropped in! 🎉'
                : `${collectedCount} / ${NUM_DOTS} dropped in`;
        }

        function newMaze() {
            const logicalWidth = width / window.devicePixelRatio;
            const logicalHeight = height / window.devicePixelRatio;
            generateMaze(logicalWidth, logicalHeight);
            resetDots();
        }

        class Dot {
            constructor(x, y, hue) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.radius = DOT_RADIUS;
                this.hue = hue; // Hue value from 0 to 360
                this.color = `hsl(${hue}, 85%, 60%)`;
                this.targetVx = 0;
                this.targetVy = 0;
                this.capturing = false;
            }

            // Steer toward a fixed point with a proportional controller: speed
            // shrinks as distance shrinks, so the dot settles at the target
            // instead of overshooting and bouncing back.
            steerTo(targetX, targetY) {
                const dx = targetX - this.x;
                const dy = targetY - this.y;
                const dist = Math.hypot(dx, dy);
                const maxSpeed = 8;
                const gain = 0.15;

                if (dist < 0.75) {
                    this.targetVx = 0;
                    this.targetVy = 0;
                } else {
                    const speed = Math.min(maxSpeed, dist * gain);
                    this.targetVx = (dx / dist) * speed;
                    this.targetVy = (dy / dist) * speed;
                }
            }

            // Steer toward whichever wall is currently closest, moving along
            // that single axis only. This keeps dots spread along the nearest
            // side instead of drifting diagonally into corners.
            steerToNearestEdge(boundsWidth, boundsHeight, margin) {
                const distLeft = this.x;
                const distRight = boundsWidth - this.x;
                const distTop = this.y;
                const distBottom = boundsHeight - this.y;
                const minDist = Math.min(distLeft, distRight, distTop, distBottom);

                if (minDist === distLeft) {
                    this.steerTo(margin, this.y);
                } else if (minDist === distRight) {
                    this.steerTo(boundsWidth - margin, this.y);
                } else if (minDist === distTop) {
                    this.steerTo(this.x, margin);
                } else {
                    this.steerTo(this.x, boundsHeight - margin);
                }
            }

            update(boundsWidth, boundsHeight, mode, isolateTargetHue) {
                // Captured dots are animated separately (sucked toward the
                // hole and shrunk), so skip normal steering/physics for them.
                if (this.capturing) return;

                const centerX = boundsWidth / 2;
                const centerY = boundsHeight / 2;
                const margin = this.radius + 4;

                switch (mode) {
                    case 'center':
                        this.steerTo(centerX, centerY);
                        break;
                    case 'edges':
                        this.steerToNearestEdge(boundsWidth, boundsHeight, margin);
                        break;
                    case 'up':
                        this.steerTo(this.x, margin);
                        break;
                    case 'down':
                        this.steerTo(this.x, boundsHeight - margin);
                        break;
                    case 'left':
                        this.steerTo(margin, this.y);
                        break;
                    case 'right':
                        this.steerTo(boundsWidth - margin, this.y);
                        break;
                    case 'isolate': {
                        let hueDiff = Math.abs(this.hue - isolateTargetHue);
                        if (hueDiff > 180) hueDiff = 360 - hueDiff;
                        if (hueDiff < 15) {
                            this.steerTo(centerX, centerY);
                        } else {
                            // Leave non-matching colors where they are
                            this.targetVx = 0;
                            this.targetVy = 0;
                        }
                        break;
                    }
                    default:
                        // Idle: let velocity relax to zero rather than holding
                        // a stale target, so dots simply coast to a stop.
                        this.targetVx = 0;
                        this.targetVy = 0;
                }

                // Apply smooth velocity toward targeted velocity
                this.vx += (this.targetVx - this.vx) * 0.08;
                this.vy += (this.targetVy - this.vy) * 0.08;

                // Natural deceleration/friction
                this.vx *= 0.96;
                this.vy *= 0.96;

                // Position update
                this.x += this.vx;
                this.y += this.vy;

                // Boundary collision handling with rebound (safety clamp for
                // any momentum overshoot past the steering target)
                const r = this.radius;
                if (this.x - r < 0) {
                    this.x = r;
                    this.vx *= -0.5;
                }
                if (this.x + r > boundsWidth) {
                    this.x = boundsWidth - r;
                    this.vx *= -0.5;
                }
                if (this.y - r < 0) {
                    this.y = r;
                    this.vy *= -0.5;
                }
                if (this.y + r > boundsHeight) {
                    this.y = boundsHeight - r;
                    this.vy *= -0.5;
                }
            }

            draw(context) {
                context.beginPath();
                context.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                context.fillStyle = this.color;

                // Add subtle glowing halo for visual pleasure
                context.shadowColor = this.color;
                context.shadowBlur = 8;

                context.fill();
                context.closePath();
                context.shadowBlur = 0; // Reset shadow for performance
            }
        }

        function initDots() {
            dots = [];
            const logicalWidth = width / window.devicePixelRatio;
            const logicalHeight = height / window.devicePixelRatio;

            for (let i = 0; i < NUM_DOTS; i++) {
                // Cycle evenly through the 12-color palette
                const hue = PALETTE[i % PALETTE.length];
                const padding = 30;
                const x = padding + Math.random() * (logicalWidth - padding * 2);
                const y = padding + Math.random() * (logicalHeight - padding * 2);
                dots.push(new Dot(x, y, hue));
            }
        }

        function resetDots() {
            // Idle mode, no active isolation, full respawn of every dot
            // (including ones already dropped in the hole) and progress
            // reset — a clean slate to solve the maze again.
            currentMode = null;
            isolateHue = null;
            collectedCount = 0;
            initDots();
            updateStats();
        }

        function applyForce(type) {
            currentMode = type;
        }

        function isolateColor(hue) {
            isolateHue = hue;
            currentMode = 'isolate';
        }

        // Build the 12 fixed color swatch buttons used to pick an isolation hue
        function buildColorSwatches() {
            const container = document.getElementById('colorSwatches');
            PALETTE.forEach(hue => {
                const swatch = document.createElement('button');
                swatch.className = 'color-swatch';
                swatch.style.background = `hsl(${hue}, 85%, 60%)`;
                swatch.title = 'Isolate this color';
                swatch.onclick = () => isolateColor(hue);
                container.appendChild(swatch);
            });
        }

        // Push any overlapping dot pairs apart so they can touch and bump
        // but never sit on top of one another. Run a few iterations per
        // frame so clusters (e.g. dots piling up at the center) settle
        // into a stable, non-overlapping arrangement.
        function resolveCollisions() {
            for (let i = 0; i < dots.length; i++) {
                const a = dots[i];
                for (let j = i + 1; j < dots.length; j++) {
                    const b = dots[j];
                    const dx = b.x - a.x;
                    const dy = b.y - a.y;
                    let dist = Math.hypot(dx, dy);
                    const minDist = a.radius + b.radius;
                    if (dist >= minDist) continue;

                    if (dist === 0) {
                        // Perfectly coincident: nudge apart in a random direction
                        const angle = Math.random() * Math.PI * 2;
                        a.x -= Math.cos(angle) * 0.5;
                        a.y -= Math.sin(angle) * 0.5;
                        b.x += Math.cos(angle) * 0.5;
                        b.y += Math.sin(angle) * 0.5;
                        continue;
                    }

                    const nx = dx / dist;
                    const ny = dy / dist;
                    const overlap = minDist - dist;

                    // Separate positions so they no longer overlap
                    a.x -= nx * overlap * 0.5;
                    a.y -= ny * overlap * 0.5;
                    b.x += nx * overlap * 0.5;
                    b.y += ny * overlap * 0.5;

                    // Cancel the closing velocity along the contact normal so
                    // they bump rather than keep pushing into each other
                    const relVx = b.vx - a.vx;
                    const relVy = b.vy - a.vy;
                    const closingSpeed = relVx * nx + relVy * ny;
                    if (closingSpeed < 0) {
                        a.vx += closingSpeed * nx;
                        a.vy += closingSpeed * ny;
                        b.vx -= closingSpeed * nx;
                        b.vy -= closingSpeed * ny;
                    }
                }
            }
        }

        // Main animation loop
        function animate() {
            const logicalWidth = width / window.devicePixelRatio;
            const logicalHeight = height / window.devicePixelRatio;

            ctx.clearRect(0, 0, logicalWidth, logicalHeight);

            // Simple soft visual grid in the background
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
            ctx.lineWidth = 1;
            const gridSize = 40;
            for (let x = 0; x < logicalWidth; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, logicalHeight); ctx.stroke();
            }
            for (let y = 0; y < logicalHeight; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(logicalWidth, y); ctx.stroke();
            }

            // Update positions/velocities first...
            dots.forEach(dot => dot.update(logicalWidth, logicalHeight, currentMode, isolateHue));

            // ...then resolve any overlaps (dot-dot and dot-wall) so dots
            // never sit on top of each other or clip through maze walls
            for (let iter = 0; iter < 3; iter++) {
                resolveCollisions();
                dots.forEach(dot => { if (!dot.capturing) resolveWallCollisions(dot); });
            }

            // Collision push-apart can shove a dot past the wall; clamp back in
            dots.forEach(dot => {
                const r = dot.radius;
                if (dot.x - r < 0) dot.x = r;
                if (dot.x + r > logicalWidth) dot.x = logicalWidth - r;
                if (dot.y - r < 0) dot.y = r;
                if (dot.y + r > logicalHeight) dot.y = logicalHeight - r;
            });

            // Suck in any dots that wandered into the pit
            updateHoleCapture();

            // Draw the maze background, then the dots on top of it
            drawMaze(ctx);
            dots.forEach(dot => dot.draw(ctx));

            requestAnimationFrame(animate);
        }

        // Arrow keys mirror the directional pad buttons
        const ARROW_KEY_TO_FORCE = {
            ArrowUp: 'up',
            ArrowDown: 'down',
            ArrowLeft: 'left',
            ArrowRight: 'right'
        };
        window.addEventListener('keydown', (e) => {
            const type = ARROW_KEY_TO_FORCE[e.key];
            if (!type) return;
            e.preventDefault(); // stop the page itself from scrolling
            applyForce(type);
        });

        // Initialization
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('DOMContentLoaded', () => {
            resizeCanvas();
            const logicalWidth = width / window.devicePixelRatio;
            const logicalHeight = height / window.devicePixelRatio;
            generateMaze(logicalWidth, logicalHeight);
            initDots();
            buildColorSwatches();
            updateStats();
            animate();
        });
    </script>
</body>
</html>
