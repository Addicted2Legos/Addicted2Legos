<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Dot Magnetic Sandbox</title>
    <style>
      html, body { touch-action: manipulation; }
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.75);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --btn-hover: rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px;
        }

        .app-shell {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 1100px;
        }

        .game-menu {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 180px;
            flex-shrink: 0;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            padding: 16px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            position: sticky;
            top: 20px;
        }

        .menu-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .menu-link {
            display: block;
            padding: 10px 12px;
            border-radius: 8px;
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            border: 1px solid transparent;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .menu-link:hover {
            background: var(--btn-hover);
        }

        .menu-link.active {
            background: rgba(56, 189, 248, 0.15);
            border-color: rgba(56, 189, 248, 0.4);
            color: var(--accent-color);
        }

        @media (max-width: 720px) {
            .app-shell {
                flex-direction: column;
                align-items: center;
            }

            .game-menu {
                flex-direction: row;
                width: 100%;
                max-width: 700px;
                overflow-x: auto;
                position: static;
                justify-content: center;
            }

            .menu-title {
                display: none;
            }
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            max-width: 900px;
            width: 100%;
        }

        header {
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        p.subtitle {
            font-size: 0.875rem;
            color: #94a3b8;
        }

        #canvas-container {
            position: relative;
            width: min(100%, 700px, 55vh);
            aspect-ratio: 1 / 1;
            background: #020617;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), inset 0 0 0 1px var(--border-color);
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            width: 100%;
            max-width: 700px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            padding: 16px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.2);
            padding: 6px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .group-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            margin-right: 4px;
            font-weight: 600;
        }

        button {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        button:hover {
            background: var(--btn-hover);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .directional-pad {
            display: grid;
            grid-template-columns: repeat(3, 32px);
            grid-template-rows: repeat(2, 32px);
            gap: 4px;
        }

        .directional-pad button {
            padding: 0;
            justify-content: center;
            align-items: center;
            width: 32px;
            height: 32px;
            border-radius: 6px;
        }

        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }

        .color-swatches {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            max-width: 180px;
        }

        .color-swatch {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.4);
            cursor: pointer;
            padding: 0;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .color-swatch:hover {
            transform: scale(1.15);
            border-color: #ffffff;
        }

        .btn-isolate {
            background: rgba(56, 189, 248, 0.15);
            border-color: rgba(56, 189, 248, 0.4);
            color: #38bdf8;
        }

        .btn-isolate:hover {
            background: rgba(56, 189, 248, 0.25);
        }

        .btn-reset {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.3);
            color: #f87171;
        }

        .btn-reset:hover {
            background: rgba(239, 68, 68, 0.25);
        }
    </style>
</head>
<body>

    <div class="app-shell">
        <nav class="game-menu" aria-label="Minigame versions">
            <span class="menu-title">Polar Pixel</span>
            <a href="FreePlay.html" class="menu-link">Free Play</a>
            <a href="Maze.html" class="menu-link">Maze</a>
            <a href="MiniGolf.html" class="menu-link active">Mini Golf</a>
            <a href="FollowTheLeader.html" class="menu-link">Follow the Leader</a>
            <a href="ShapeShifter.html" class="menu-link">Shape Shifter</a>
        </nav>

        <div class="container">
        <header>
            <h1>Dot Sorting Mini Golf</h1>
            <p class="subtitle">Steer every dot through the obstacles and sink them all in the hole</p>
        </header>

        <div id="canvas-container">
            <canvas id="sandbox"></canvas>
        </div>

        <p class="subtitle" id="holeStatus">0 / 100 balls in the hole</p>

        <div class="controls">
            <!-- Magnetic Directional Controls -->
            <div class="control-group">
                <span class="group-label">Magnet</span>
                <div class="directional-pad">
                    <button class="btn-up" onclick="applyForce('up')" title="Pull Up">▲</button>
                    <button class="btn-left" onclick="applyForce('left')" title="Pull Left">◄</button>
                    <button class="btn-right" onclick="applyForce('right')" title="Pull Right">►</button>
                    <button class="btn-down" onclick="applyForce('down')" title="Pull Down">▼</button>
                </div>
            </div>

            <!-- Spatial Sorting Controls -->
            <div class="control-group">
                <span class="group-label">Position</span>
                <button onclick="applyForce('center')">Center</button>
                <button onclick="applyForce('edges')">Edges</button>
            </div>

            <!-- Color Extraction Control -->
            <div class="control-group">
                <span class="group-label">Filter</span>
                <div class="color-swatches" id="colorSwatches"></div>
            </div>

            <!-- Reset Control -->
            <div class="control-group">
                <button class="btn-reset" onclick="resetDots()">Shuffle All</button>
            </div>
        </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('sandbox');
        const ctx = canvas.getContext('2d');

        const NUM_DOTS = 100;
        const DOT_RADIUS = 10;
        // Exactly 12 selectable colors, evenly spaced around the hue wheel
        const PALETTE = Array.from({ length: 12 }, (_, i) => i * 30);
        let dots = [];
        let width, height;

        // Currently active steering behavior ('center', 'edges', 'up', 'down',
        // 'left', 'right', 'isolate', or null for idle). Recomputed every frame
        // so dots decelerate into place instead of drifting forever.
        let currentMode = null;
        let isolateHue = null;

        // The course layout (hole, walls, sand traps) is described as
        // fractions of the play area so it rescales cleanly whenever the
        // canvas resizes. Pixel versions are recomputed into `hole`,
        // `obstacles`, and `sandTraps` by layoutCourse().
        const OBSTACLE_LAYOUT = [
            { x: 0.15, y: 0.30, w: 0.30, h: 0.05 },
            { x: 0.65, y: 0.15, w: 0.05, h: 0.30 },
            { x: 0.55, y: 0.65, w: 0.30, h: 0.05 },
            { x: 0.30, y: 0.55, w: 0.05, h: 0.30 }
        ];
        const SAND_TRAP_LAYOUT = [
            { cx: 0.85, cy: 0.15, rx: 0.12, ry: 0.09 },
            { cx: 0.15, cy: 0.85, rx: 0.12, ry: 0.09 }
        ];
        let hole = { x: 0, y: 0, r: 18 };
        let obstacles = [];
        let sandTraps = [];
        let sunkCount = 0;

        function layoutCourse(boundsWidth, boundsHeight) {
            hole = {
                x: boundsWidth / 2,
                y: boundsHeight / 2,
                r: Math.max(14, Math.min(boundsWidth, boundsHeight) * 0.035)
            };
            obstacles = OBSTACLE_LAYOUT.map(o => ({
                x: o.x * boundsWidth,
                y: o.y * boundsHeight,
                w: o.w * boundsWidth,
                h: o.h * boundsHeight
            }));
            sandTraps = SAND_TRAP_LAYOUT.map(s => ({
                x: s.cx * boundsWidth,
                y: s.cy * boundsHeight,
                rx: s.rx * boundsWidth,
                ry: s.ry * boundsHeight
            }));
        }

        function isInSandTrap(x, y) {
            return sandTraps.some(s => {
                const dx = (x - s.x) / s.rx;
                const dy = (y - s.y) / s.ry;
                return dx * dx + dy * dy <= 1;
            });
        }

        // Ensure crisp rendering on high-DPI screens
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            width = canvas.width;
            height = canvas.height;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            layoutCourse(rect.width, rect.height);
        }

        class Dot {
            constructor(x, y, hue) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.radius = DOT_RADIUS;
                this.hue = hue; // Hue value from 0 to 360
                this.color = `hsl(${hue}, 85%, 60%)`;
                this.targetVx = 0;
                this.targetVy = 0;
                this.sunk = false;
                this.scale = 1;
            }

            // Push the dot back out of any wall obstacle it has driven into,
            // and reflect its velocity off the wall's nearest edge so it
            // bounces like a real ball hitting a course barrier.
            resolveObstacles(obstacleList) {
                for (const rect of obstacleList) {
                    const closestX = Math.max(rect.x, Math.min(this.x, rect.x + rect.w));
                    const closestY = Math.max(rect.y, Math.min(this.y, rect.y + rect.h));
                    const dx = this.x - closestX;
                    const dy = this.y - closestY;
                    const dist = Math.hypot(dx, dy);
                    if (dist === 0) {
                        // Center is inside the rect: push out along the shortest side
                        const pushLeft = this.x - rect.x;
                        const pushRight = rect.x + rect.w - this.x;
                        const pushTop = this.y - rect.y;
                        const pushBottom = rect.y + rect.h - this.y;
                        const minPush = Math.min(pushLeft, pushRight, pushTop, pushBottom);
                        if (minPush === pushLeft) { this.x = rect.x - this.radius; this.vx *= -0.5; }
                        else if (minPush === pushRight) { this.x = rect.x + rect.w + this.radius; this.vx *= -0.5; }
                        else if (minPush === pushTop) { this.y = rect.y - this.radius; this.vy *= -0.5; }
                        else { this.y = rect.y + rect.h + this.radius; this.vy *= -0.5; }
                        continue;
                    }
                    if (dist < this.radius) {
                        const nx = dx / dist;
                        const ny = dy / dist;
                        const overlap = this.radius - dist;
                        this.x += nx * overlap;
                        this.y += ny * overlap;
                        const dot = this.vx * nx + this.vy * ny;
                        if (dot < 0) {
                            this.vx -= dot * nx * 1.5;
                            this.vy -= dot * ny * 1.5;
                        }
                    }
                }
            }

            // Steer toward a fixed point with a proportional controller: speed
            // shrinks as distance shrinks, so the dot settles at the target
            // instead of overshooting and bouncing back.
            steerTo(targetX, targetY) {
                const dx = targetX - this.x;
                const dy = targetY - this.y;
                const dist = Math.hypot(dx, dy);
                const maxSpeed = 8;
                const gain = 0.15;

                if (dist < 0.75) {
                    this.targetVx = 0;
                    this.targetVy = 0;
                } else {
                    const speed = Math.min(maxSpeed, dist * gain);
                    this.targetVx = (dx / dist) * speed;
                    this.targetVy = (dy / dist) * speed;
                }
            }

            // Steer toward whichever wall is currently closest, moving along
            // that single axis only. This keeps dots spread along the nearest
            // side instead of drifting diagonally into corners.
            steerToNearestEdge(boundsWidth, boundsHeight, margin) {
                const distLeft = this.x;
                const distRight = boundsWidth - this.x;
                const distTop = this.y;
                const distBottom = boundsHeight - this.y;
                const minDist = Math.min(distLeft, distRight, distTop, distBottom);

                if (minDist === distLeft) {
                    this.steerTo(margin, this.y);
                } else if (minDist === distRight) {
                    this.steerTo(boundsWidth - margin, this.y);
                } else if (minDist === distTop) {
                    this.steerTo(this.x, margin);
                } else {
                    this.steerTo(this.x, boundsHeight - margin);
                }
            }

            update(boundsWidth, boundsHeight, mode, isolateTargetHue) {
                if (this.sunk) {
                    // Ease into the cup and shrink away instead of continuing
                    // to be steered around the course.
                    this.vx *= 0.85;
                    this.vy *= 0.85;
                    this.x += (hole.x - this.x) * 0.15;
                    this.y += (hole.y - this.y) * 0.15;
                    this.scale = Math.max(0, this.scale - 0.06);
                    return;
                }

                const centerX = boundsWidth / 2;
                const centerY = boundsHeight / 2;
                const margin = this.radius + 4;

                switch (mode) {
                    case 'center':
                        this.steerTo(centerX, centerY);
                        break;
                    case 'edges':
                        this.steerToNearestEdge(boundsWidth, boundsHeight, margin);
                        break;
                    case 'up':
                        this.steerTo(this.x, margin);
                        break;
                    case 'down':
                        this.steerTo(this.x, boundsHeight - margin);
                        break;
                    case 'left':
                        this.steerTo(margin, this.y);
                        break;
                    case 'right':
                        this.steerTo(boundsWidth - margin, this.y);
                        break;
                    case 'isolate': {
                        let hueDiff = Math.abs(this.hue - isolateTargetHue);
                        if (hueDiff > 180) hueDiff = 360 - hueDiff;
                        if (hueDiff < 15) {
                            this.steerTo(centerX, centerY);
                        } else {
                            // Leave non-matching colors where they are
                            this.targetVx = 0;
                            this.targetVy = 0;
                        }
                        break;
                    }
                    default:
                        // Idle: let velocity relax to zero rather than holding
                        // a stale target, so dots simply coast to a stop.
                        this.targetVx = 0;
                        this.targetVy = 0;
                }

                // Apply smooth velocity toward targeted velocity
                this.vx += (this.targetVx - this.vx) * 0.08;
                this.vy += (this.targetVy - this.vy) * 0.08;

                // Natural deceleration/friction, with extra drag while
                // sitting in a sand trap so balls bog down there
                const sandDrag = isInSandTrap(this.x, this.y) ? 0.88 : 0.96;
                this.vx *= sandDrag;
                this.vy *= sandDrag;

                // Position update
                this.x += this.vx;
                this.y += this.vy;

                // Bounce off any wall obstacles in the way
                this.resolveObstacles(obstacles);

                // Boundary collision handling with rebound (safety clamp for
                // any momentum overshoot past the steering target)
                const r = this.radius;
                if (this.x - r < 0) {
                    this.x = r;
                    this.vx *= -0.5;
                }
                if (this.x + r > boundsWidth) {
                    this.x = boundsWidth - r;
                    this.vx *= -0.5;
                }
                if (this.y - r < 0) {
                    this.y = r;
                    this.vy *= -0.5;
                }
                if (this.y + r > boundsHeight) {
                    this.y = boundsHeight - r;
                    this.vy *= -0.5;
                }

                // Sink once the ball has drifted mostly over the cup
                const distToHole = Math.hypot(this.x - hole.x, this.y - hole.y);
                if (distToHole < hole.r - this.radius * 0.3) {
                    this.sunk = true;
                }
            }

            draw(context) {
                if (this.scale <= 0) return;
                context.beginPath();
                context.arc(this.x, this.y, this.radius * this.scale, 0, Math.PI * 2);
                context.fillStyle = this.color;

                // Add subtle glowing halo for visual pleasure
                context.shadowColor = this.color;
                context.shadowBlur = 8;

                context.fill();
                context.closePath();
                context.shadowBlur = 0; // Reset shadow for performance
            }
        }

        // True if a spawn point would land inside a wall obstacle or the hole
        function isBlockedSpawn(x, y) {
            if (Math.hypot(x - hole.x, y - hole.y) < hole.r + DOT_RADIUS * 2) return true;
            return obstacles.some(o =>
                x > o.x - DOT_RADIUS && x < o.x + o.w + DOT_RADIUS &&
                y > o.y - DOT_RADIUS && y < o.y + o.h + DOT_RADIUS
            );
        }

        function randomSpawnPoint(logicalWidth, logicalHeight) {
            const padding = 30;
            let x, y, attempts = 0;
            do {
                x = padding + Math.random() * (logicalWidth - padding * 2);
                y = padding + Math.random() * (logicalHeight - padding * 2);
                attempts++;
            } while (isBlockedSpawn(x, y) && attempts < 20);
            return { x, y };
        }

        function initDots() {
            dots = [];
            const logicalWidth = width / window.devicePixelRatio;
            const logicalHeight = height / window.devicePixelRatio;

            for (let i = 0; i < NUM_DOTS; i++) {
                // Cycle evenly through the 12-color palette
                const hue = PALETTE[i % PALETTE.length];
                const { x, y } = randomSpawnPoint(logicalWidth, logicalHeight);
                dots.push(new Dot(x, y, hue));
            }
        }

        function resetDots() {
            // Idle mode so dots aren't steered anywhere, then give them a
            // random burst that decays via friction into a natural scatter.
            // Any ball that had sunk gets pulled back out onto the course.
            currentMode = null;
            isolateHue = null;
            const logicalWidth = width / window.devicePixelRatio;
            const logicalHeight = height / window.devicePixelRatio;
            dots.forEach(dot => {
                if (dot.sunk) {
                    dot.sunk = false;
                    dot.scale = 1;
                    const { x, y } = randomSpawnPoint(logicalWidth, logicalHeight);
                    dot.x = x;
                    dot.y = y;
                }
                dot.vx = (Math.random() - 0.5) * 10;
                dot.vy = (Math.random() - 0.5) * 10;
            });
        }

        function applyForce(type) {
            currentMode = type;
        }

        function isolateColor(hue) {
            isolateHue = hue;
            currentMode = 'isolate';
        }

        // Build the 12 fixed color swatch buttons used to pick an isolation hue
        function buildColorSwatches() {
            const container = document.getElementById('colorSwatches');
            PALETTE.forEach(hue => {
                const swatch = document.createElement('button');
                swatch.className = 'color-swatch';
                swatch.style.background = `hsl(${hue}, 85%, 60%)`;
                swatch.title = 'Isolate this color';
                swatch.onclick = () => isolateColor(hue);
                container.appendChild(swatch);
            });
        }

        // Push any overlapping dot pairs apart so they can touch and bump
        // but never sit on top of one another. Run a few iterations per
        // frame so clusters (e.g. dots piling up at the center) settle
        // into a stable, non-overlapping arrangement.
        function resolveCollisions() {
            for (let i = 0; i < dots.length; i++) {
                const a = dots[i];
                if (a.sunk) continue;
                for (let j = i + 1; j < dots.length; j++) {
                    const b = dots[j];
                    if (b.sunk) continue;
                    const dx = b.x - a.x;
                    const dy = b.y - a.y;
                    let dist = Math.hypot(dx, dy);
                    const minDist = a.radius + b.radius;
                    if (dist >= minDist) continue;

                    if (dist === 0) {
                        // Perfectly coincident: nudge apart in a random direction
                        const angle = Math.random() * Math.PI * 2;
                        a.x -= Math.cos(angle) * 0.5;
                        a.y -= Math.sin(angle) * 0.5;
                        b.x += Math.cos(angle) * 0.5;
                        b.y += Math.sin(angle) * 0.5;
                        continue;
                    }

                    const nx = dx / dist;
                    const ny = dy / dist;
                    const overlap = minDist - dist;

                    // Separate positions so they no longer overlap
                    a.x -= nx * overlap * 0.5;
                    a.y -= ny * overlap * 0.5;
                    b.x += nx * overlap * 0.5;
                    b.y += ny * overlap * 0.5;

                    // Cancel the closing velocity along the contact normal so
                    // they bump rather than keep pushing into each other
                    const relVx = b.vx - a.vx;
                    const relVy = b.vy - a.vy;
                    const closingSpeed = relVx * nx + relVy * ny;
                    if (closingSpeed < 0) {
                        a.vx += closingSpeed * nx;
                        a.vy += closingSpeed * ny;
                        b.vx -= closingSpeed * nx;
                        b.vy -= closingSpeed * ny;
                    }
                }
            }
        }

        // Draws the grass course background: mowed stripes, sand traps,
        // wall obstacles, and the hole with its flag.
        function drawCourse(logicalWidth, logicalHeight) {
            // Mowed-stripe grass field
            const stripeWidth = 36;
            for (let x = -stripeWidth, i = 0; x < logicalWidth; x += stripeWidth, i++) {
                ctx.fillStyle = i % 2 === 0 ? '#1f8a3d' : '#1c7d37';
                ctx.fillRect(x, 0, stripeWidth, logicalHeight);
            }

            // Sand traps
            ctx.fillStyle = '#d9c07a';
            sandTraps.forEach(s => {
                ctx.beginPath();
                ctx.ellipse(s.x, s.y, s.rx, s.ry, 0, 0, Math.PI * 2);
                ctx.fill();
            });

            // Wall obstacles
            obstacles.forEach(o => {
                ctx.fillStyle = '#8b5a2b';
                ctx.fillRect(o.x, o.y, o.w, o.h);
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.35)';
                ctx.lineWidth = 2;
                ctx.strokeRect(o.x, o.y, o.w, o.h);
            });

            // Hole (dark cup with soft rim shadow)
            ctx.beginPath();
            ctx.arc(hole.x, hole.y, hole.r + 4, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(hole.x, hole.y, hole.r, 0, Math.PI * 2);
            ctx.fillStyle = '#0a0a0a';
            ctx.fill();

            // Flag
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(hole.x, hole.y);
            ctx.lineTo(hole.x, hole.y - hole.r * 3.2);
            ctx.stroke();

            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.moveTo(hole.x, hole.y - hole.r * 3.2);
            ctx.lineTo(hole.x + hole.r * 1.6, hole.y - hole.r * 2.7);
            ctx.lineTo(hole.x, hole.y - hole.r * 2.2);
            ctx.closePath();
            ctx.fill();
        }

        function updateHoleStatus() {
            const statusEl = document.getElementById('holeStatus');
            if (!statusEl) return;
            sunkCount = dots.filter(d => d.sunk).length;
            statusEl.textContent = sunkCount >= dots.length
                ? `All ${dots.length} balls are in the hole!`
                : `${sunkCount} / ${dots.length} balls in the hole`;
        }

        // Main animation loop
        function animate() {
            const logicalWidth = width / window.devicePixelRatio;
            const logicalHeight = height / window.devicePixelRatio;

            ctx.clearRect(0, 0, logicalWidth, logicalHeight);
            drawCourse(logicalWidth, logicalHeight);

            // Update positions/velocities first...
            dots.forEach(dot => dot.update(logicalWidth, logicalHeight, currentMode, isolateHue));

            // ...then resolve any overlaps so dots never sit on top of each other
            for (let iter = 0; iter < 3; iter++) resolveCollisions();

            // Collision push-apart can shove a dot past the wall; clamp back in
            dots.forEach(dot => {
                if (dot.sunk) return;
                const r = dot.radius;
                if (dot.x - r < 0) dot.x = r;
                if (dot.x + r > logicalWidth) dot.x = logicalWidth - r;
                if (dot.y - r < 0) dot.y = r;
                if (dot.y + r > logicalHeight) dot.y = logicalHeight - r;
            });

            // Finally render
            dots.forEach(dot => dot.draw(ctx));
            updateHoleStatus();

            requestAnimationFrame(animate);
        }

        // Arrow keys mirror the directional pad buttons
        const ARROW_KEY_TO_FORCE = {
            ArrowUp: 'up',
            ArrowDown: 'down',
            ArrowLeft: 'left',
            ArrowRight: 'right'
        };
        window.addEventListener('keydown', (e) => {
            const type = ARROW_KEY_TO_FORCE[e.key];
            if (!type) return;
            e.preventDefault(); // stop the page itself from scrolling
            applyForce(type);
        });

        // Initialization
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('DOMContentLoaded', () => {
            resizeCanvas();
            initDots();
            buildColorSwatches();
            animate();
        });
    </script>
</body>
