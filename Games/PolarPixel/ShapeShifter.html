<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Dot Magnetic Sandbox</title>
    <style>
      html, body { touch-action: manipulation; }
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.75);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --btn-hover: rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 20px;
        }

        .app-shell {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 1100px;
        }

        .game-menu {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 180px;
            flex-shrink: 0;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            padding: 16px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            position: sticky;
            top: 20px;
        }

        .menu-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .menu-link {
            display: block;
            padding: 10px 12px;
            border-radius: 8px;
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            border: 1px solid transparent;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .menu-link:hover {
            background: var(--btn-hover);
        }

        .menu-link.active {
            background: rgba(56, 189, 248, 0.15);
            border-color: rgba(56, 189, 248, 0.4);
            color: var(--accent-color);
        }

        @media (max-width: 720px) {
            .app-shell {
                flex-direction: column;
                align-items: center;
            }

            .game-menu {
                flex-direction: row;
                width: 100%;
                max-width: 700px;
                overflow-x: auto;
                position: static;
                justify-content: center;
            }

            .menu-title {
                display: none;
            }
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            max-width: 900px;
            width: 100%;
        }

        header {
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        p.subtitle {
            font-size: 0.875rem;
            color: #94a3b8;
        }

        #canvas-container {
            position: relative;
            width: min(100%, 700px, 55vh);
            aspect-ratio: 1 / 1;
            background: #020617;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), inset 0 0 0 1px var(--border-color);
            overflow: hidden;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            width: 100%;
            max-width: 700px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            padding: 16px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.2);
            padding: 6px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .group-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
            margin-right: 4px;
            font-weight: 600;
        }

        button {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        button:hover {
            background: var(--btn-hover);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);

        button:active {

        .directional-pad {

        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }

        .color-swatches {

        .color-swatch {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.4);

            transition: transform 0.15s ease, border-color 0.15s ease;

        .color-swatch:hover {
            transform: scale(1.15);
            border-color: #ffffff;
        }

        .btn-isolate {
            background: rgba(56, 189, 248, 0.15);
            border-color: rgba(56, 189, 248, 0.4);
            color: #38bdf8;
        }

        .btn-isolate:hover {
            background: rgba(56, 189, 248, 0.25);
        }

        .btn-reset {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.3);
            color: #f87171;
        }

        .btn-reset:hover {
            background: rgba(239, 68, 68, 0.25);
        }

<body>

    <div class="app-shell">
        <nav class="game-menu" aria-label="Minigame versions">
            <span class="menu-title">Polar Pixel</span>
            <a href="FreePlay.html" class="menu-link">Free Play</a>
            <a href="Maze.html" class="menu-link">Maze</a>
            <a href="MiniGolf.html" class="menu-link">Mini Golf</a>
            <a href="FollowTheLeader.html" class="menu-link">Follow the Leader</a>
            <a href="ShapeShifter.html" class="menu-link active">Shape Shifter</a>
        </nav>

        <div class="container">
        <header>
            <h1>Dot Sorting Sandbox</h1>
            <p class="subtitle">Satisfying physics, color isolation, and magnetic forces</p>
        </header>

        <div id="canvas-container">
            <canvas id="sandbox"></canvas>
        </div>

        <div class="controls">
            <!-- Magnetic Directional Controls -->
            <div class="control-group">
                <span class="group-label">Magnet</span>
                <div class="directional-pad">
                    <button class="btn-up" onclick="applyForce('up')" title="Pull Up">▲</button>
                    <button class="btn-left" onclick="applyForce('left')" title="Pull Left">◄</button>
                    <button class="btn-right" onclick="applyForce('right')" title="Pull Right">►</button>
                    <button class="btn-down" onclick="applyForce('down')" title="Pull Down">▼</button>
                </div>
            </div>

            <!-- Spatial Sorting Controls -->
            <div class="control-group">
                <span class="group-label">Position</span>
                <button onclick="applyForce('center')">Center</button>
                <button onclick="applyForce('edges')">Edges</button>
            </div>

            <!-- Shape Morphing Controls -->
            <div class="control-group">
                <span class="group-label">Shapes</span>
                <button onclick="setShape('line')">Line</button>
                <button onclick="setShape('circle')">Circle</button>
                <button onclick="setShape('triangle')">Triangle</button>
                <button onclick="setShape('square')">Square</button>
                <button onclick="setShape('smiley')">😊 Smiley</button>
                <button onclick="setShape('kitten')">🐱 Kitten</button>
                <button onclick="setShape('dolphin')">🐬 Dolphin</button>
                <button onclick="setShape('banana')">🍌 Banana</button>
            </div>

            <!-- Color Extraction Control -->
            <div class="control-group">
                <span class="group-label">Filter</span>
                <div class="color-swatches" id="colorSwatches"></div>
            </div>

            <!-- Reset Control -->
            <div class="control-group">
                <button class="btn-reset" onclick="resetDots()">Shuffle All</button>
            </div>
        </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('sandbox');
        const ctx = canvas.getContext('2d');

        const NUM_DOTS = 100;
        const DOT_RADIUS = 10;
        // Exactly 12 selectable colors, evenly spaced around the hue wheel
        const PALETTE = Array.from({ length: 12 }, (_, i) => i * 30);
        let dots = [];
        let width, height;

        // Currently active steering behavior ('center', 'edges', 'up', 'down',
        // 'left', 'right', 'isolate', 'shape', or null for idle). Recomputed
        // every frame so dots decelerate into place instead of drifting forever.
        let currentMode = null;
        let isolateHue = null;

        // Ensure crisp rendering on high-DPI screens
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            width = canvas.width;
            height = canvas.height;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }

        class Dot {
            constructor(x, y, hue) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.radius = DOT_RADIUS;
                this.hue = hue; // Hue value from 0 to 360
                this.color = `hsl(${hue}, 85%, 60%)`;
                this.targetVx = 0;
                this.targetVy = 0;
                // Fractional (0-1) position within the canvas this dot steers
                // toward while in 'shape' mode, so shapes stay correct if the
                // canvas is resized.
                this.shapeXFrac = 0.5;
                this.shapeYFrac = 0.5;
                // Whether this dot is one of the ones claimed by the current
                // shape (some shapes use fewer than NUM_DOTS dots).
                this.inShape = false;
            }

            // Steer toward a fixed point with a proportional controller: speed
            // shrinks as distance shrinks, so the dot settles at the target
            // instead of overshooting and bouncing back.
            steerTo(targetX, targetY) {
                const dx = targetX - this.x;
                const dy = targetY - this.y;
                const dist = Math.hypot(dx, dy);
                const maxSpeed = 8;
                const gain = 0.15;

                if (dist < 0.75) {
                    this.targetVx = 0;
                    this.targetVy = 0;
                } else {
                    const speed = Math.min(maxSpeed, dist * gain);
                    this.targetVx = (dx / dist) * speed;
                    this.targetVy = (dy / dist) * speed;
                }
            }

            // Steer toward whichever wall is currently closest, moving along
            // that single axis only. This keeps dots spread along the nearest
            // side instead of drifting diagonally into corners.
            steerToNearestEdge(boundsWidth, boundsHeight, margin) {
                const distLeft = this.x;
                const distRight = boundsWidth - this.x;
                const distTop = this.y;
                const distBottom = boundsHeight - this.y;
                const minDist = Math.min(distLeft, distRight, distTop, distBottom);

                if (minDist === distLeft) {
                    this.steerTo(margin, this.y);
                } else if (minDist === distRight) {
                    this.steerTo(boundsWidth - margin, this.y);
                } else if (minDist === distTop) {
                    this.steerTo(this.x, margin);
                } else {
                    this.steerTo(this.x, boundsHeight - margin);
                }
            }

            // Steer toward whichever of the 4 corners is currently closest.
            // Used to tuck away dots that a shape isn't using.
            steerToNearestCorner(boundsWidth, boundsHeight, margin) {
                const corners = [
                    [margin, margin],
                    [boundsWidth - margin, margin],
                    [margin, boundsHeight - margin],
                    [boundsWidth - margin, boundsHeight - margin]
                ];
                let closest = corners[0];
                let closestDist = Infinity;
                for (const [cx, cy] of corners) {
                    const d = Math.hypot(cx - this.x, cy - this.y);
                    if (d < closestDist) { closestDist = d; closest = [cx, cy]; }
                }
                this.steerTo(closest[0], closest[1]);
            }

            update(boundsWidth, boundsHeight, mode, isolateTargetHue) {
                const centerX = boundsWidth / 2;
                const centerY = boundsHeight / 2;
                const margin = this.radius + 4;

                switch (mode) {
                    case 'center':
                        this.steerTo(centerX, centerY);
                        break;
                    case 'edges':
                        this.steerToNearestEdge(boundsWidth, boundsHeight, margin);
                        break;
                    case 'up':
                        this.steerTo(this.x, margin);
                        break;
                    case 'down':
                        this.steerTo(this.x, boundsHeight - margin);
                        break;
                    case 'left':
                        this.steerTo(margin, this.y);
                        break;
                    case 'right':
                        this.steerTo(boundsWidth - margin, this.y);
                        break;
                    case 'shape':
                        if (this.inShape) {
                            this.steerTo(this.shapeXFrac * boundsWidth, this.shapeYFrac * boundsHeight);
                        } else {
                            // Not part of this shape (shapes that use fewer
                            // than NUM_DOTS dots) - tuck it into a corner
                            // instead of leaving it in the middle of the shape.
                            this.steerToNearestCorner(boundsWidth, boundsHeight, margin);
                        }
                        break;
                    case 'isolate': {
                        let hueDiff = Math.abs(this.hue - isolateTargetHue);
                        if (hueDiff > 180) hueDiff = 360 - hueDiff;
                        if (hueDiff < 15) {
                            this.steerTo(centerX, centerY);
                        } else {
                            // Leave non-matching colors where they are
                            this.targetVx = 0;
                            this.targetVy = 0;
                        }
                        break;
                    }
                    default:
                        // Idle: let velocity relax to zero rather than holding
                        // a stale target, so dots simply coast to a stop.
                        this.targetVx = 0;
                        this.targetVy = 0;
                }

                // Apply smooth velocity toward targeted velocity
                this.vx += (this.targetVx - this.vx) * 0.08;
                this.vy += (this.targetVy - this.vy) * 0.08;

                // Natural deceleration/friction
                this.vx *= 0.96;
                this.vy *= 0.96;

                // Position update
                this.x += this.vx;
                this.y += this.vy;

                // Boundary collision handling with rebound (safety clamp for
                // any momentum overshoot past the steering target)
                const r = this.radius;
                if (this.x - r < 0) {
                    this.x = r;
                    this.vx *= -0.5;
                }
                if (this.x + r > boundsWidth) {
                    this.x = boundsWidth - r;
                    this.vx *= -0.5;
                }
                if (this.y - r < 0) {
                    this.y = r;
                    this.vy *= -0.5;
                }
                if (this.y + r > boundsHeight) {
                    this.y = boundsHeight - r;
                    this.vy *= -0.5;
                }
            }

            draw(context) {
                context.beginPath();
                context.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                context.fillStyle = this.color;
                
                // Add subtle glowing halo for visual pleasure
                context.shadowColor = this.color;
                context.shadowBlur = 8;
                
                context.fill();
                context.closePath();
                context.shadowBlur = 0; // Reset shadow for performance
            }
        }

        function initDots() {
            dots = [];
            const logicalWidth = width / window.devicePixelRatio;
            const logicalHeight = height / window.devicePixelRatio;

            for (let i = 0; i < NUM_DOTS; i++) {
                // Cycle evenly through the 12-color palette
                const hue = PALETTE[i % PALETTE.length];
                const padding = 30;
                const x = padding + Math.random() * (logicalWidth - padding * 2);
                const y = padding + Math.random() * (logicalHeight - padding * 2);
                dots.push(new Dot(x, y, hue));
            }
        }

        function resetDots() {
            // Idle mode so dots aren't steered anywhere, then give them a
            // random burst that decays via friction into a natural scatter.
            currentMode = null;
            isolateHue = null;
            dots.forEach(dot => {
                dot.vx = (Math.random() - 0.5) * 10;
                dot.vy = (Math.random() - 0.5) * 10;
            });
        }

        function applyForce(type) {
            currentMode = type;
        }

        function isolateColor(hue) {
            isolateHue = hue;
            currentMode = 'isolate';
        }

        // --- Shape morphing ---------------------------------------------
        // Every shape is described as a set of "loops" (open or closed
        // polylines) in an arbitrary local coordinate space. To turn that
        // into exactly NUM_DOTS target points we distribute points across
        // loops proportional to their arc length, then space them evenly
        // along each loop. This lets simple shapes (line, circle) and
        // multi-part shapes (a smiley's face + eyes + mouth) share the same
        // machinery.

        function polyLoop(points, closed = true) {
            return { points, closed };
        }

        function polygonLoop(sides, radius, cx = 0, cy = 0, rotationDeg = -90) {
            const points = [];
            for (let i = 0; i < sides; i++) {
                const angle = (rotationDeg + (i * 360) / sides) * Math.PI / 180;
                points.push([cx + radius * Math.cos(angle), cy + radius * Math.sin(angle)]);
            }
            return polyLoop(points, true);
        }

        function circleLoop(radius, cx = 0, cy = 0, segments = 48) {
            return polygonLoop(segments, radius, cx, cy, 0);
        }

        function lineLoop(x1, y1, x2, y2) {
            return polyLoop([[x1, y1], [x2, y2]], false);
        }

        // Arc using standard math angles (0deg = right, CCW), with y flipped
        // so it reads naturally on a y-down canvas.
        function arcLoop(cx, cy, radius, startDeg, endDeg, segments = 24) {
            const points = [];
            for (let i = 0; i <= segments; i++) {
                const t = i / segments;
                const angle = (startDeg + (endDeg - startDeg) * t) * Math.PI / 180;
                points.push([cx + radius * Math.cos(angle), cy - radius * Math.sin(angle)]);
            }
            return polyLoop(points, false);
        }

        const SHAPES = {
            line: () => [lineLoop(-100, 0, 100, 0)],

            circle: () => [circleLoop(100, 0, 0, 64)],

            triangle: () => [polyLoop([[0, -100], [87, 50], [-87, 50]], true)],

            square: () => [polyLoop([[-90, -90], [90, -90], [90, 90], [-90, 90]], true)],

            smiley: () => [
                circleLoop(100, 0, 0, 48),           // face outline
                circleLoop(12, -35, -25, 16),         // left eye
                circleLoop(12, 35, -25, 16),          // right eye
                arcLoop(0, -10, 65, 200, 340, 24)     // smiling mouth
            ],

            kitten: () => [
                circleLoop(85, 0, 15, 40),                              // head
                polyLoop([[-75, -30], [-95, -110], [-25, -50]], true),  // left ear
                polyLoop([[75, -30], [95, -110], [25, -50]], true),     // right ear
                circleLoop(10, -32, 5, 12),                             // left eye
                circleLoop(10, 32, 5, 12),                              // right eye
                polyLoop([[-8, 35], [8, 35], [0, 45]], true)            // nose
            ],

            dolphin: () => [
                polyLoop([
                    [90, 10], [68, -12], [48, -26], [28, -36], [18, -58],
                    [8, -36], [-22, -26], [-52, -14], [-72, 2],
                    [-96, -20], [-76, 4], [-96, 28], [-64, 16],
                    [-38, 26], [-8, 30], [22, 24], [50, 14], [70, 20]
                ], true),
                circleLoop(6, 62, -8, 10) // eye
            ],

            banana: () => [
                polyLoop([
                    ...Array.from({ length: 21 }, (_, i) => {
                        const t = i / 20;
                        return [-90 + 180 * t, -70 * Math.sin(Math.PI * t)];
                    }),
                    ...Array.from({ length: 21 }, (_, i) => {
                        const t = 1 - i / 20;
                        return [-90 + 180 * t, -28 * Math.sin(Math.PI * t) + 12];
                    })
                ], true)
            ]
        };

        // Optional per-shape recoloring. When a shape has an entry here, the
        // dots that morph into it are recolored by cycling through these
        // hues (instead of keeping whatever color they already had).
        const SHAPE_COLOR_SCHEMES = {
            // Three color slots (stem/body/spots) reserved for a future
            // multi-tone banana - all set to the same yellow hue for now.
            banana: [50, 50, 50],
            // Dolphins should read as a single-tone animal, so only use
            // half of the 12-color palette instead of the full rainbow.
            dolphin: PALETTE.filter((_, i) => i % 2 === 0)
        };

        function getShapeColorHues(name, count) {
            const scheme = SHAPE_COLOR_SCHEMES[name];
            if (!scheme) return null;
            return Array.from({ length: count }, (_, i) => scheme[i % scheme.length]);
        }

        function loopLength(loop) {
            const pts = loop.points;
            let len = 0;
            for (let i = 0; i < pts.length - 1; i++) {
                len += Math.hypot(pts[i + 1][0] - pts[i][0], pts[i + 1][1] - pts[i][1]);
            }
            if (loop.closed) {
                len += Math.hypot(pts[0][0] - pts[pts.length - 1][0], pts[0][1] - pts[pts.length - 1][1]);
            }
            return len;
        }

        function pointAtDistance(loop, dist) {
            const pts = loop.points;
            const segs = loop.closed ? pts.length : pts.length - 1;
            for (let i = 0; i < segs; i++) {
                const a = pts[i];
                const b = pts[(i + 1) % pts.length];
                const segLen = Math.hypot(b[0] - a[0], b[1] - a[1]);
                if (dist <= segLen || i === segs - 1) {
                    const t = segLen === 0 ? 0 : dist / segLen;
                    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
                }
                dist -= segLen;
            }
            return pts[0];
        }

        // Distribute `totalPoints` across the loops (proportional to arc
        // length, largest-remainder rounding) and space them evenly within
        // each loop.
        function sampleShapePoints(loops, totalPoints) {
            const lengths = loops.map(loopLength);
            const totalLength = lengths.reduce((a, b) => a + b, 0) || 1;

            const raw = lengths.map(l => (l / totalLength) * totalPoints);
            const counts = raw.map(r => Math.max(1, Math.floor(r)));
            let allocated = counts.reduce((a, b) => a + b, 0);

            const remainders = raw
                .map((r, i) => ({ i, rem: r - Math.floor(r) }))
                .sort((a, b) => b.rem - a.rem);

            let idx = 0;
            while (allocated < totalPoints) {
                counts[remainders[idx % remainders.length].i]++;
                allocated++;
                idx++;
            }
            while (allocated > totalPoints) {
                const maxIdx = counts.indexOf(Math.max(...counts));
                if (counts[maxIdx] <= 1) break;
                counts[maxIdx]--;
                allocated--;
            }

            const result = [];
            loops.forEach((loop, li) => {
                const n = counts[li];
                const len = lengths[li];
                for (let k = 0; k < n; k++) {
                    const dist = n === 1 ? len / 2 : (k / n) * len;
                    result.push(pointAtDistance(loop, dist));
                }
            });
            return result;
        }

        // Some shapes only use a subset of the dots (the rest stay put
        // wherever they are). Anything not listed here uses all NUM_DOTS.
        const SHAPE_DOT_COUNTS = {
            banana: 30,
            dolphin: 30
        };

        // Fit a shape's local-space points into the canvas as (0-1)
        // fractional coordinates, preserving aspect ratio and centering.
        function shapeToFractionalPoints(shapeName, count) {
            const loops = SHAPES[shapeName]();
            const rawPoints = sampleShapePoints(loops, count);

            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            rawPoints.forEach(([x, y]) => {
                minX = Math.min(minX, x); maxX = Math.max(maxX, x);
                minY = Math.min(minY, y); maxY = Math.max(maxY, y);
            });
            const shapeWidth = maxX - minX || 1;
            const shapeHeight = maxY - minY || 1;
            const shapeCx = (minX + maxX) / 2;
            const shapeCy = (minY + maxY) / 2;

            const marginFrac = 0.12; // keep the shape off the canvas edges
            const scale = (1 - marginFrac * 2) / Math.max(shapeWidth, shapeHeight);

            return rawPoints.map(([x, y]) => [
                0.5 + (x - shapeCx) * scale,
                0.5 + (y - shapeCy) * scale
            ]);
        }

        function setShape(name) {
            const shapeCount = SHAPE_DOT_COUNTS[name] || NUM_DOTS;
            const targets = shapeToFractionalPoints(name, shapeCount);
            const colorHues = getShapeColorHues(name, targets.length);
            const logicalWidth = width / window.devicePixelRatio;
            const logicalHeight = height / window.devicePixelRatio;

            // Dots not claimed below (only relevant when shapeCount <
            // NUM_DOTS) simply idle in place rather than joining the shape.
            dots.forEach(dot => { dot.inShape = false; });

            // For each target point, claim whichever unclaimed dot is
            // closest to it, so the shape forms from nearby dots along
            // short, mostly non-crossing paths.
            const availableDots = dots.map((_, i) => i);
            targets.forEach((target, targetIdx) => {
                const tx = target[0] * logicalWidth;
                const ty = target[1] * logicalHeight;
                let bestSlot = -1, bestDist = Infinity;
                for (let k = 0; k < availableDots.length; k++) {
                    const dot = dots[availableDots[k]];
                    const d = Math.hypot(tx - dot.x, ty - dot.y);
                    if (d < bestDist) { bestDist = d; bestSlot = k; }
                }
                const dot = dots[availableDots.splice(bestSlot, 1)[0]];
                dot.inShape = true;
                dot.shapeXFrac = target[0];
                dot.shapeYFrac = target[1];

                if (colorHues) {
                    dot.hue = colorHues[targetIdx];
                    dot.color = `hsl(${dot.hue}, 85%, 60%)`;
                }
            });

            currentMode = 'shape';
        }

        // Build the 12 fixed color swatch buttons used to pick an isolation hue
        function buildColorSwatches() {
            const container = document.getElementById('colorSwatches');
            PALETTE.forEach(hue => {
                const swatch = document.createElement('button');
                swatch.className = 'color-swatch';
                swatch.style.background = `hsl(${hue}, 85%, 60%)`;
                swatch.title = 'Isolate this color';
                swatch.onclick = () => isolateColor(hue);
                container.appendChild(swatch);
            });
        }

        // Push any overlapping dot pairs apart so they can touch and bump
        // but never sit on top of one another. Run a few iterations per
        // frame so clusters (e.g. dots piling up at the center) settle
        // into a stable, non-overlapping arrangement.
        function resolveCollisions() {
            for (let i = 0; i < dots.length; i++) {
                const a = dots[i];
                for (let j = i + 1; j < dots.length; j++) {
                    const b = dots[j];
                    const dx = b.x - a.x;
                    const dy = b.y - a.y;
                    let dist = Math.hypot(dx, dy);
                    const minDist = a.radius + b.radius;
                    if (dist >= minDist) continue;

                    if (dist === 0) {
                        // Perfectly coincident: nudge apart in a random direction
                        const angle = Math.random() * Math.PI * 2;
                        a.x -= Math.cos(angle) * 0.5;
                        a.y -= Math.sin(angle) * 0.5;
                        b.x += Math.cos(angle) * 0.5;
                        b.y += Math.sin(angle) * 0.5;
                        continue;
                    }

                    const nx = dx / dist;
                    const ny = dy / dist;
                    const overlap = minDist - dist;

                    // Separate positions so they no longer overlap
                    a.x -= nx * overlap * 0.5;
                    a.y -= ny * overlap * 0.5;
                    b.x += nx * overlap * 0.5;
                    b.y += ny * overlap * 0.5;

                    // Cancel the closing velocity along the contact normal so
                    // they bump rather than keep pushing into each other
                    const relVx = b.vx - a.vx;
                    const relVy = b.vy - a.vy;
                    const closingSpeed = relVx * nx + relVy * ny;
                    if (closingSpeed < 0) {
                        a.vx += closingSpeed * nx;
                        a.vy += closingSpeed * ny;
                        b.vx -= closingSpeed * nx;
                        b.vy -= closingSpeed * ny;
                    }
                }
            }
        }

        // Main animation loop
        function animate() {
            const logicalWidth = width / window.devicePixelRatio;
            const logicalHeight = height / window.devicePixelRatio;

            ctx.clearRect(0, 0, logicalWidth, logicalHeight);

            // Simple soft visual grid in the background
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.02)';
            ctx.lineWidth = 1;
            const gridSize = 40;
            for (let x = 0; x < logicalWidth; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, logicalHeight); ctx.stroke();
            }
            for (let y = 0; y < logicalHeight; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(logicalWidth, y); ctx.stroke();
            }

            // Update positions/velocities first...
            dots.forEach(dot => dot.update(logicalWidth, logicalHeight, currentMode, isolateHue));

            // ...then resolve any overlaps so dots never sit on top of each other
            for (let iter = 0; iter < 3; iter++) resolveCollisions();

            // Collision push-apart can shove a dot past the wall; clamp back in
            dots.forEach(dot => {
                const r = dot.radius;
                if (dot.x - r < 0) dot.x = r;
                if (dot.x + r > logicalWidth) dot.x = logicalWidth - r;
                if (dot.y - r < 0) dot.y = r;
                if (dot.y + r > logicalHeight) dot.y = logicalHeight - r;
            });

            // Finally render
            dots.forEach(dot => dot.draw(ctx));

            requestAnimationFrame(animate);
        }

        // Arrow keys mirror the directional pad buttons
        const ARROW_KEY_TO_FORCE = {
            ArrowUp: 'up',
            ArrowDown: 'down',
            ArrowLeft: 'left',
            ArrowRight: 'right'
        };
        window.addEventListener('keydown', (e) => {
            const type = ARROW_KEY_TO_FORCE[e.key];
            if (!type) return;
            e.preventDefault(); // stop the page itself from scrolling
            applyForce(type);
        });

        // Initialization
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('DOMContentLoaded', () => {
            resizeCanvas();
            initDots();
            buildColorSwatches();
            animate();
        });
    </script>
</body>
</html>
