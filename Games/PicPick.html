<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pic Pick!</title>
<style>
    html, body { touch-action: manipulation; }
    * { box-sizing: border-box; }
    html, body {
        margin: 0;
        min-height: 100vh;
    }
    body {
        background: radial-gradient(circle at 20% 15%, #ff9de2 0%, transparent 45%),
                    radial-gradient(circle at 85% 10%, #7ee8ff 0%, transparent 40%),
                    radial-gradient(circle at 50% 100%, #ffe27a 0%, transparent 45%),
                    linear-gradient(160deg, #4b1fa8 0%, #9226c9 45%, #ff5da2 100%);
        background-attachment: fixed;
        font-family: 'Baloo 2', 'Comic Sans MS', 'Segoe UI', sans-serif;
        color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding: 20px 12px 60px;
        min-height: 100vh;
        overflow-x: hidden;
    }

    .wrap {
        width: min(560px, 100%);
        background: rgba(20, 8, 40, 0.35);
        border: 2px solid rgba(255,255,255,0.25);
        border-radius: 28px;
        box-shadow: 0 20px 50px rgba(20,0,50,0.45), inset 0 0 40px rgba(255,255,255,0.06);
        backdrop-filter: blur(6px);
        padding: 18px 18px 24px;
        text-align: center;
    }

    h1 {
        margin: 0 0 4px;
        font-size: clamp(1.8rem, 6vw, 2.6rem);
        letter-spacing: 0.03em;
        background: linear-gradient(180deg, #fff9c4 0%, #ffd166 40%, #ff6fb0 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 3px 0 rgba(0,0,0,0.25);
        animation: bob 2.2s ease-in-out infinite;
    }
    @keyframes bob {
        0%, 100% { transform: translateY(0) rotate(-1deg); }
        50% { transform: translateY(-5px) rotate(1deg); }
    }

    .subtitle {
        margin: 0 0 14px;
        font-size: 0.85rem;
        color: rgba(255,255,255,0.85);
        text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }

    .hud {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-bottom: 14px;
        flex-wrap: wrap;
    }
    .stat {
        background: rgba(0,0,0,0.28);
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 14px;
        padding: 6px 14px;
        min-width: 78px;
    }
    .stat .label {
        font-size: 0.62rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        opacity: 0.75;
    }
    .stat .value {
        font-size: 1.25rem;
        font-weight: 800;
        color: #ffe27a;
        text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    }
    #shuffleBtn {
        background: linear-gradient(180deg, #ff8fd6, #ff5da2);
        border: none;
        color: #fff;
        font-weight: 800;
        font-size: 0.8rem;
        letter-spacing: 0.03em;
        padding: 10px 16px;
        border-radius: 14px;
        cursor: pointer;
        box-shadow: 0 4px 0 #b23c76, 0 6px 12px rgba(0,0,0,0.3);
        transition: transform 0.1s ease;
    }
    #shuffleBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b23c76; }

    .board-wrap {
        position: relative;
        width: 100%;
    }

    .board {
        position: relative;
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        grid-template-rows: repeat(8, 1fr);
        gap: 4px;
        width: 100%;
        aspect-ratio: 1 / 1;
        padding: 8px;
        background: rgba(0,0,0,0.25);
        border-radius: 18px;
        border: 2px solid rgba(255,255,255,0.18);
        box-shadow: inset 0 0 24px rgba(0,0,0,0.35);
    }

    .tile {
        position: relative;
        cursor: pointer;
        background-color: #241236;
        background-repeat: no-repeat;
        border: 1px solid rgba(255,255,255,0.25);
        border-radius: 0;
        box-shadow: 0 2px 5px rgba(0,0,0,0.35);
        transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease, opacity 0.25s ease;
        transform-origin: center;
        opacity: 1;
    }

    .tile:hover { filter: brightness(1.15); }
    .tile.selected {
        transform: scale(1.12);
        box-shadow: 0 0 0 3px #fff, 0 0 16px 4px #ffe27a;
        z-index: 2;
    }
    .tile.hidden {
        opacity: 0;
        pointer-events: none;
    }
    .tile.dropping {
        animation: drop 0.32s ease;
    }
    @keyframes drop {
        0% { transform: translateY(-130%); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
    }

    .reveal {
        position: absolute;
        background-repeat: no-repeat;
        background-size: 100% 100%;
        background-position: center;
        border-radius: 10px;
        box-shadow: 0 0 0 3px #fff, 0 0 26px 8px rgba(255, 225, 120, 0.85);
        opacity: 0;
        transform: scale(0.85);
        transition: opacity 0.28s ease, transform 0.28s ease;
        z-index: 4;
        pointer-events: none;
    }
    .reveal.show {
        opacity: 1;
        transform: scale(1);
    }
    .reveal.fading {
        opacity: 0;
        transform: scale(0.92);
        transition: opacity 0.45s ease, transform 0.45s ease;
    }

    .floater {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        font-weight: 900;
        font-size: 1.4rem;
        color: #fff9c4;
        text-shadow: 0 2px 6px rgba(0,0,0,0.6), 0 0 12px #ff5da2;
        pointer-events: none;
        animation: floatUp 0.95s ease forwards;
        z-index: 5;
        white-space: nowrap;
    }
    @keyframes floatUp {
        0% { opacity: 0; transform: translate(-50%, -30%) scale(0.7); }
        15% { opacity: 1; transform: translate(-50%, -55%) scale(1.15); }
        100% { opacity: 0; transform: translate(-50%, -140%) scale(1); }
    }

    .credit {
        margin-top: 14px;
        font-size: 0.68rem;
        opacity: 0.6;
    }
</style>
</head>
<body>
    <main class="wrap">
        <h1>Pic Pick!</h1>
        <p class="subtitle">Swap pieces to assemble a full Buff Man photo — match all 4 corners to clear it!</p>
        <div class="hud">
            <div class="stat">
                <div class="label">Score</div>
                <div class="value" id="scoreVal">0</div>
            </div>
            <button id="shuffleBtn">🔀 Shuffle</button>
            <div class="stat">
                <div class="label">Best</div>
                <div class="value" id="bestVal">0</div>
            </div>
        </div>
        <div class="board-wrap" id="boardWrap">
            <div class="board" id="board"></div>
        </div>
        <p class="credit">Endless mode • pieces keep dropping from the top</p>
    </main>

<script>
(function () {
    const SIZE = 8;
    const QUADS = ['TL', 'TR', 'BL', 'BR'];
    const IMAGES = [
        "BuffMan/Buff Man - Big Red Balls.png",
        "BuffMan/Buff Man - Big Red Dounut.png",
        "BuffMan/Buff Man - Flying.png",
        "BuffMan/Buff Man - I'm Buff Man.png",
        "BuffMan/Buff Man - Super Buff Super Strong Oh Yeah.png",
        "BuffMan/BuffmanGame.png",
    ];
    const QUAD_POS = {
        TL: '0% 0%',
        TR: '100% 0%',
        BL: '0% 100%',
        BR: '100% 100%',
    };

    const boardEl = document.getElementById('board');
    const boardWrapEl = document.getElementById('boardWrap');
    const scoreEl = document.getElementById('scoreVal');
    const bestEl = document.getElementById('bestVal');
    const shuffleBtn = document.getElementById('shuffleBtn');

    let board = [];
    let cells = [];
    let selected = null;
    let busy = false;
    let score = 0;
    let best = Number(localStorage.getItem('picpick_best') || 0);
    bestEl.textContent = best;

    let audioCtx = null;
    function beep(freq, dur, type, gain) {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.type = type || 'sine';
            osc.frequency.value = freq;
            g.gain.value = gain || 0.08;
            osc.connect(g);
            g.connect(audioCtx.destination);
            osc.start();
            g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
            osc.stop(audioCtx.currentTime + dur);
        } catch (e) { /* audio unsupported, ignore */ }
    }

    function randomTile() {
        return {
            img: Math.floor(Math.random() * IMAGES.length),
            quad: QUADS[Math.floor(Math.random() * QUADS.length)],
        };
    }

    function buildInitialBoard() {
        const pool = [];
        QUADS.forEach(q => {
            for (let i = 0; i < (SIZE * SIZE) / QUADS.length; i++) {
                pool.push({ img: Math.floor(Math.random() * IMAGES.length), quad: q });
            }
        });
        for (let i = pool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [pool[i], pool[j]] = [pool[j], pool[i]];
        }
        board = [];
        let k = 0;
        for (let r = 0; r < SIZE; r++) {
            board.push([]);
            for (let c = 0; c < SIZE; c++) {
                board[r].push(pool[k++]);
            }
        }
    }

    function buildDom() {
        boardEl.innerHTML = '';
        cells = [];
        for (let r = 0; r < SIZE; r++) {
            cells.push([]);
            for (let c = 0; c < SIZE; c++) {
                const div = document.createElement('div');
                div.className = 'tile';
                div.addEventListener('click', () => onTileClick(r, c));
                boardEl.appendChild(div);
                cells[r].push(div);
            }
        }
    }

    function renderTile(r, c) {
        const tile = board[r][c];
        const el = cells[r][c];
        el.className = 'tile';
        el.style.backgroundImage = `url("${encodeURI(IMAGES[tile.img])}")`;
        el.style.backgroundSize = '200% 200%';
        el.style.backgroundPosition = QUAD_POS[tile.quad];
        if (selected && selected.r === r && selected.c === c) {
            el.classList.add('selected');
        }
    }

    function renderAll() {
        for (let r = 0; r < SIZE; r++) {
            for (let c = 0; c < SIZE; c++) renderTile(r, c);
        }
    }

    function swap(a, b) {
        const tmp = board[a.r][a.c];
        board[a.r][a.c] = board[b.r][b.c];
        board[b.r][b.c] = tmp;
    }

    function findMatches() {
        const cellSet = new Set();
        const blocks = [];
        for (let r = 0; r < SIZE - 1; r++) {
            for (let c = 0; c < SIZE - 1; c++) {
                const tl = board[r][c], tr = board[r][c + 1];
                const bl = board[r + 1][c], br = board[r + 1][c + 1];
                if (!tl || !tr || !bl || !br) continue;
                if (tl.quad === 'TL' && tr.quad === 'TR' && bl.quad === 'BL' && br.quad === 'BR' &&
                    tl.img === tr.img && tl.img === bl.img && tl.img === br.img) {
                    blocks.push({ r, c, img: tl.img });
                    cellSet.add(r + ',' + c);
                    cellSet.add(r + ',' + (c + 1));
                    cellSet.add((r + 1) + ',' + c);
                    cellSet.add((r + 1) + ',' + (c + 1));
                }
            }
        }
        return { cellSet, blocks };
    }

    function createReveal(block) {
        const elA = cells[block.r][block.c];
        const elB = cells[block.r + 1][block.c + 1];
        const rectA = elA.getBoundingClientRect();
        const rectB = elB.getBoundingClientRect();
        const wrapRect = boardWrapEl.getBoundingClientRect();
        const div = document.createElement('div');
        div.className = 'reveal';
        div.style.left = (rectA.left - wrapRect.left) + 'px';
        div.style.top = (rectA.top - wrapRect.top) + 'px';
        div.style.width = (rectB.right - rectA.left) + 'px';
        div.style.height = (rectB.bottom - rectA.top) + 'px';
        div.style.backgroundImage = `url("${encodeURI(IMAGES[block.img])}")`;
        boardWrapEl.appendChild(div);
        requestAnimationFrame(() => requestAnimationFrame(() => div.classList.add('show')));
        return div;
    }

    function showFloater(text, r, c) {
        const el = cells[r][c];
        const f = document.createElement('div');
        f.className = 'floater';
        f.textContent = text;
        const rect = el.getBoundingClientRect();
        const wrapRect = boardWrapEl.getBoundingClientRect();
        f.style.left = (rect.left - wrapRect.left + rect.width / 2) + 'px';
        f.style.top = (rect.top - wrapRect.top + rect.height / 2) + 'px';
        boardWrapEl.appendChild(f);
        f.addEventListener('animationend', () => f.remove());
    }

    function updateScore(delta) {
        score += delta;
        scoreEl.textContent = score;
        if (score > best) {
            best = score;
            bestEl.textContent = best;
            localStorage.setItem('picpick_best', String(best));
        }
    }

    const REVEAL_HOLD_MS = 2000;
    const REVEAL_FADE_MS = 450;

    function resolveBoard(comboChain, silent) {
        const { cellSet, blocks } = findMatches();
        if (blocks.length === 0) {
            busy = false;
            renderAll();
            return;
        }
        if (!silent) {
            const gain = blocks.length * 100 * comboChain;
            updateScore(gain);
            const first = blocks[0];
            showFloater(comboChain > 1 ? `+${gain} combo x${comboChain}!` : `+${gain}`, first.r, first.c);
            beep(440 + comboChain * 80, 0.18, 'triangle', 0.09);
        }

        cellSet.forEach(key => {
            const [r, c] = key.split(',').map(Number);
            cells[r][c].classList.add('hidden');
        });
        const reveals = blocks.map(createReveal);

        setTimeout(() => {
            reveals.forEach(el => el.classList.add('fading'));
            setTimeout(() => {
                reveals.forEach(el => el.remove());
                cellSet.forEach(key => {
                    const [r, c] = key.split(',').map(Number);
                    board[r][c] = null;
                });
                dropAndFill();
                renderAll();
                markDropAnimation(cellSet);
                setTimeout(() => resolveBoard(comboChain + 1, silent), 260);
            }, REVEAL_FADE_MS);
        }, REVEAL_HOLD_MS);
    }

    function dropAndFill() {
        for (let c = 0; c < SIZE; c++) {
            const stack = [];
            for (let r = SIZE - 1; r >= 0; r--) {
                if (board[r][c]) stack.push(board[r][c]);
            }
            for (let r = SIZE - 1; r >= 0; r--) {
                board[r][c] = stack.length ? stack.shift() : null;
            }
            for (let r = 0; r < SIZE; r++) {
                if (!board[r][c]) board[r][c] = randomTile();
            }
        }
    }

    function markDropAnimation(cellSet) {
        const cols = new Set();
        cellSet.forEach(key => cols.add(Number(key.split(',')[1])));
        cols.forEach(c => {
            for (let r = 0; r < SIZE; r++) {
                cells[r][c].classList.add('dropping');
            }
        });
    }

    function onTileClick(r, c) {
        if (busy) return;
        if (!selected) {
            selected = { r, c };
            renderAll();
            beep(660, 0.06, 'sine', 0.05);
            return;
        }
        if (selected.r === r && selected.c === c) {
            selected = null;
            renderAll();
            return;
        }
        const a = selected, b = { r, c };
        selected = null;
        swap(a, b);
        busy = true;
        renderAll();
        beep(300, 0.08, 'square', 0.05);
        setTimeout(() => resolveBoard(1, false), 180);
    }

    function shuffleBoard() {
        if (busy) return;
        const flat = [];
        for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) flat.push(board[r][c]);
        for (let i = flat.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [flat[i], flat[j]] = [flat[j], flat[i]];
        }
        let k = 0;
        for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) board[r][c] = flat[k++];
        selected = null;
        renderAll();
        busy = true;
        setTimeout(() => resolveBoard(1, true), 120);
    }

    shuffleBtn.addEventListener('click', shuffleBoard);

    buildInitialBoard();
    buildDom();
    renderAll();
    busy = true;
    setTimeout(() => resolveBoard(1, true), 250);
})();
</script>
    <script>window.GAME_NAME = "Pic Pick";</script>
    <script src="analytics.js" defer></script>
</body>
</html>
