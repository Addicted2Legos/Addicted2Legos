<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Hazard Engine - Reverse Tower Defense</title>
  <style>
      html, body { touch-action: manipulation; }
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 20px;
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    h1 {
      margin: 0 0 5px 0;
      color: #58a6ff;
      letter-spacing: 1.5px;
      font-size: 24px;
      text-transform: uppercase;
    }
    p.subtitle {
      margin: 0 0 15px 0;
      color: #8b949e;
      font-size: 14px;
    }
    #game-container {
      position: relative;
      background: #161b22;
      border: 2px solid #30363d;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      width: 800px;
    }
    canvas {
      display: block;
      background: #090d12;
      cursor: crosshair;
    }
    .hud-panel {
      padding: 12px 16px;
      background: #161b22;
      border-top: 1px solid #30363d;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0d1117;
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #21262d;
      font-weight: bold;
      font-size: 14px;
    }
    .stat-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stat-value {
      color: #58a6ff;
    }
    .controls-row {
      display: flex;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
    }
    .btn-group {
      display: flex;
      gap: 8px;
    }
    button {
      background: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    button:hover:not(:disabled) {
      background: #30363d;
      border-color: #8b949e;
      color: #ffffff;
    }
    button.active {
      background: #1f6beb;
      border-color: #58a6ff;
      color: #ffffff;
      box-shadow: 0 0 8px rgba(31, 107, 235, 0.4);
    }
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    button.btn-primary {
      background: #238636;
      border-color: #2ea043;
      color: #ffffff;
    }
    button.btn-primary:hover:not(:disabled) {
      background: #2ea043;
    }
    button.btn-ability {
      background: #8957e5;
      border-color: #a371f7;
      color: #ffffff;
    }
    button.btn-ability:hover:not(:disabled) {
      background: #a371f7;
    }
    .keybind {
      background: rgba(255, 255, 255, 0.15);
      font-size: 10px;
      padding: 2px 5px;
      border-radius: 3px;
    }
    .alert-banner {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(218, 54, 51, 0.9);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-size: 13px;
      pointer-events: none;
      box-shadow: 0 0 15px rgba(218, 54, 51, 0.6);
      display: none;
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      from { opacity: 0.8; transform: translateX(-50%) scale(0.98); }
      to { opacity: 1; transform: translateX(-50%) scale(1.02); }
    }
  </style>
</head>
<body>

  <h1>The Hazard Engine</h1>
  <p class="subtitle">Reverse Tower Defense: Protect the horde through the factory corridor</p>

  <div id="game-container">
    <div id="alert-banner" class="alert-banner">⚠️ BOSS WARNING: ORBITAL SMELTER BEAM INBOUND ⚠️</div>
    <canvas id="gameCanvas" width="800" height="480"></canvas>
    
    <div class="hud-panel">
      <div class="stats-bar">
        <div class="stat-item">Energy: <span id="val-energy" class="stat-value">120</span></div>
        <div class="stat-item">Wave: <span id="val-wave" class="stat-value">1</span></div>
        <div class="stat-item">Saved: <span id="val-saved" class="stat-value">0</span></div>
        <div class="stat-item">Next Horde: <span id="val-horde" class="stat-value" style="font-size: 12px; color: #a5d6ff;">3 Walkers, 2 Runners</span></div>
      </div>

      <div class="controls-row">
        <div class="btn-group">
          <button id="btn-shield" class="active" onclick="selectTool('shield')">
            Shield ($30) <span class="keybind">1</span>
          </button>
          <button id="btn-fan" onclick="selectTool('fan')">
            Fan ($25) <span class="keybind">2</span>
          </button>
          <button id="btn-radiator" onclick="selectTool('radiator')">
            Radiator ($20) <span class="keybind">3</span>
          </button>
          <button id="btn-emp" class="btn-ability" onclick="triggerEMP()">
            ⚡ EMP ($40) <span class="keybind">E</span>
          </button>
        </div>

        <div class="btn-group">
          <button id="btn-clear" onclick="clearDefenses()">Clear All</button>
          <button id="btn-start" class="btn-primary" onclick="startWave()">Start Wave ▶</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Grid & Map configuration
    const GRID_SIZE = 40;
    const PATH = [
      {x: 0, y: 2}, {x: 3, y: 2}, {x: 3, y: 6}, 
      {x: 7, y: 6}, {x: 7, y: 2}, {x: 12, y: 2}, 
      {x: 12, y: 9}, {x: 16, y: 9}, {x: 20, y: 9}
    ];

    // Converts grid points to a detailed waypoint list
    let waypoints = [];
    function buildWaypoints() {
      waypoints = [];
      for (let i = 0; i < PATH.length - 1; i++) {
        let p1 = PATH[i];
        let p2 = PATH[i+1];
        let dx = p2.x - p1.x;
        let dy = p2.y - p1.y;
        let steps = Math.max(Math.abs(dx), Math.abs(dy));
        for (let s = 0; s < steps; s++) {
          waypoints.push({
            x: (p1.x + (dx / steps) * s) * GRID_SIZE + GRID_SIZE / 2,
            y: (p1.y + (dy / steps) * s) * GRID_SIZE + GRID_SIZE / 2
          });
        }
      }
      waypoints.push({
        x: PATH[PATH.length - 1].x * GRID_SIZE + GRID_SIZE / 2,
        y: PATH[PATH.length - 1].y * GRID_SIZE + GRID_SIZE / 2
      });
    }
    buildWaypoints();

    // Game state
    let energy = 120;
    let wave = 1;
    let savedCount = 0;
    let selectedTool = 'shield';
    let waveInProgress = false;
    let empCooldown = 0;

    // Objects
    let defenses = [];
    let creatures = [];
    let hazards = [];
    let particles = [];
    let smelterBeam = { active: false, x: 0, warningTimer: 0, duration: 0 };

    // Tool Configurations
    const TOOLS = {
      shield: { cost: 30, color: '#38d9a9', label: 'Energy Shield' },
      fan: { cost: 25, color: '#4dabf7', label: 'Ventilation Fan' },
      radiator: { cost: 20, color: '#ff922b', label: 'Heat Radiator' }
    };

    // Initialize Hazard Zones
    function initHazards() {
      hazards = [
        { type: 'rain', x: 4 * GRID_SIZE, y: 6 * GRID_SIZE, w: 3 * GRID_SIZE, h: GRID_SIZE, timer: 0 },
        { type: 'laser', x: 9 * GRID_SIZE, y: 2 * GRID_SIZE, w: GRID_SIZE, h: 3 * GRID_SIZE, offset: 0 },
        { type: 'gas', x: 12 * GRID_SIZE, y: 5 * GRID_SIZE, w: GRID_SIZE, h: 3 * GRID_SIZE }
      ];
    }
    initHazards();

    // Keybindings listener
    window.addEventListener('keydown', (e) => {
      if (e.key === '1') selectTool('shield');
      if (e.key === '2') selectTool('fan');
      if (e.key === '3') selectTool('radiator');
      if (e.key === 'e' || e.key === 'E') triggerEMP();
    });

    function selectTool(tool) {
      selectedTool = tool;
      document.querySelectorAll('.btn-group button').forEach(b => {
        if (b.id.startsWith('btn-') && b.id !== 'btn-emp') b.classList.remove('active');
      });
      const target = document.getElementById(`btn-${tool}`);
      if (target) target.classList.add('active');
    }

    canvas.addEventListener('click', (e) => {
      const rect = canvas.getBoundingClientRect();
      const gx = Math.floor((e.clientX - rect.left) / GRID_SIZE);
      const gy = Math.floor((e.clientY - rect.top) / GRID_SIZE);

      // Prevent placing on track or out of bounds
      const cost = TOOLS[selectedTool].cost;
      if (energy < cost) return;

      const existingIndex = defenses.findIndex(d => d.gx === gx && d.gy === gy);
      if (existingIndex !== -1) {
        // Remove existing defense
        defenses.splice(existingIndex, 1);
        energy += Math.floor(cost / 2);
      } else {
        defenses.push({ gx, gy, type: selectedTool, hp: 100, empTimer: 0 });
        energy -= cost;
      }
      updateHUD();
    });

    function clearDefenses() {
      if (waveInProgress) return;
      defenses = [];
      energy = 100 + (wave - 1) * 30;
      updateHUD();
    }

    function triggerEMP() {
      if (energy < 40 || empCooldown > 0) return;
      energy -= 40;
      empCooldown = 300; // 5 seconds at 60fps

      // Particle wave
      for (let i = 0; i < 50; i++) {
        let angle = Math.random() * Math.PI * 2;
        let speed = 3 + Math.random() * 5;
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 40,
          color: '#a371f7'
        });
      }

      // Temporarily disable hazards
      hazards.forEach(h => h.disabled = 180); // 3 seconds disabled
      updateHUD();
    }

    function startWave() {
      if (waveInProgress) return;
      waveInProgress = true;
      document.getElementById('btn-start').disabled = true;

      // Spawn Wave Composition
      let queue = [];
      let walkers = 3 + wave * 2;
      let runners = Math.floor(wave * 1.5);
      let behemoths = Math.floor(wave / 2);

      for (let i = 0; i < walkers; i++) queue.push('walker');
      for (let i = 0; i < runners; i++) queue.push('runner');
      for (let i = 0; i < behemoths; i++) queue.push('behemoth');

      // Shuffle queue slightly
      queue.sort(() => Math.random() - 0.5);

      let spawnInterval = setInterval(() => {
        if (queue.length === 0) {
          clearInterval(spawnInterval);
          return;
        }
        let type = queue.pop();
        let creature = {
          type,
          x: waypoints[0].x,
          y: waypoints[0].y,
          wpIndex: 0,
          hp: type === 'behemoth' ? 250 : (type === 'runner' ? 25 : 60),
          maxHp: type === 'behemoth' ? 250 : (type === 'runner' ? 25 : 60),
          speed: type === 'runner' ? 2.5 : (type === 'behemoth' ? 0.6 : 1.2),
          radius: type === 'behemoth' ? 12 : (type === 'runner' ? 6 : 8),
          color: type === 'behemoth' ? '#ff922b' : (type === 'runner' ? '#fcc419' : '#22b8cf')
        };
        creatures.push(creature);
      }, 800);

      // Trigger Boss Event on multiples of 3
      if (wave % 3 === 0) {
        document.getElementById('alert-banner').style.display = 'block';
        smelterBeam = { active: true, x: 200, warningTimer: 180, duration: 240 };
      }
    }

    function updateHUD() {
      document.getElementById('val-energy').innerText = energy;
      document.getElementById('val-wave').innerText = wave;
      document.getElementById('val-saved').innerText = savedCount;

      let nextWalkers = 3 + (wave + 1) * 2;
      let nextRunners = Math.floor((wave + 1) * 1.5);
      let nextBehemoths = Math.floor((wave + 1) / 2);
      document.getElementById('val-horde').innerText = `${nextWalkers} Walkers, ${nextRunners} Runners, ${nextBehemoths} Behemoths`;

      document.getElementById('btn-emp').disabled = energy < 40 || empCooldown > 0;
    }

    // Main Update Cycle
    function update() {
      if (empCooldown > 0) empCooldown--;

      // Update Creatures
      for (let i = creatures.length - 1; i >= 0; i--) {
        let c = creatures[i];
        let target = waypoints[c.wpIndex + 1];

        if (target) {
          let dx = target.x - c.x;
          let dy = target.y - c.y;
          let dist = Math.hypot(dx, dy);

          if (dist < c.speed) {
            c.wpIndex++;
          } else {
            c.x += (dx / dist) * c.speed;
            c.y += (dy / dist) * c.speed;
          }
        } else {
          // Reached Exit
          savedCount++;
          energy += 15;
          creatures.splice(i, 1);
          continue;
        }

        // Apply Hazards to Creatures
        hazards.forEach(h => {
          if (h.disabled > 0) return;

          let inX = c.x >= h.x && c.x <= h.x + h.w;
          let inY = c.y >= h.y && c.y <= h.y + h.h;

          if (inX && inY) {
            let mitigated = false;
            // Check adjacent defenses
            defenses.forEach(d => {
              let dx = (d.gx * GRID_SIZE + GRID_SIZE/2) - c.x;
              let dy = (d.gy * GRID_SIZE + GRID_SIZE/2) - c.y;
              if (Math.hypot(dx, dy) < GRID_SIZE * 1.5) {
                if (h.type === 'rain' && d.type === 'shield') mitigated = true;
                if (h.type === 'laser' && d.type === 'shield') mitigated = true;
                if (h.type === 'gas' && d.type === 'fan') mitigated = true;
              }
            });

            if (!mitigated) {
              c.hp -= h.type === 'gas' ? 0.3 : 1.5;
            }
          }
        });

        // Boss Smelter Beam
        if (smelterBeam.active && smelterBeam.warningTimer <= 0) {
          if (Math.abs(c.x - smelterBeam.x) < 30) {
            c.hp -= 4; // Devastating damage
          }
        }

        // Check Death
        if (c.hp <= 0) {
          // Death explosion particles
          for (let p = 0; p < 8; p++) {
            particles.push({
              x: c.x, y: c.y,
              vx: (Math.random() - 0.5) * 4,
              vy: (Math.random() - 0.5) * 4,
              life: 20, color: c.color
            });
          }
          creatures.splice(i, 1);
        }
      }

      // Update Hazard timers
      hazards.forEach(h => {
        if (h.disabled > 0) h.disabled--;
      });

      // Update Boss Smelter Event
      if (smelterBeam.active) {
        if (smelterBeam.warningTimer > 0) {
          smelterBeam.warningTimer--;
        } else {
          smelterBeam.x += 1.5;
          smelterBeam.duration--;
          if (smelterBeam.duration <= 0) {
            smelterBeam.active = false;
            document.getElementById('alert-banner').style.display = 'none';
          }
        }
      }

      // Check Wave Completion
      if (waveInProgress && creatures.length === 0) {
        waveInProgress = false;
        wave++;
        energy += 40; // Wave completion bonus
        document.getElementById('btn-start').disabled = false;
        updateHUD();
      }

      // Update Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    // Render Function
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw Grid Lines
      ctx.strokeStyle = '#161b22';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += GRID_SIZE) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += GRID_SIZE) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // Draw Pathway
      ctx.strokeStyle = '#21262d';
      ctx.lineWidth = GRID_SIZE * 0.8;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      waypoints.forEach((wp, index) => {
        if (index === 0) ctx.moveTo(wp.x, wp.y);
        else ctx.lineTo(wp.x, wp.y);
      });
      ctx.stroke();

      // Draw Pathway Inner Core
      ctx.strokeStyle = '#0d1117';
      ctx.lineWidth = GRID_SIZE * 0.6;
      ctx.stroke();

      // Draw Hazards
      hazards.forEach(h => {
        if (h.disabled > 0) {
          ctx.fillStyle = 'rgba(100, 100, 100, 0.2)';
          ctx.fillRect(h.x, h.y, h.w, h.h);
          return;
        }

        if (h.type === 'rain') {
          ctx.fillStyle = 'rgba(56, 217, 169, 0.25)';
          ctx.fillRect(h.x, h.y, h.w, h.h);
          ctx.fillStyle = '#38d9a9';
          for (let i = 0; i < 3; i++) {
            let rx = h.x + Math.random() * h.w;
            let ry = h.y + Math.random() * h.h;
            ctx.fillRect(rx, ry, 2, 6);
          }
        } else if (h.type === 'laser') {
          ctx.fillStyle = 'rgba(255, 107, 107, 0.2)';
          ctx.fillRect(h.x, h.y, h.w, h.h);
          ctx.strokeStyle = '#ff6b6b';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(h.x + h.w/2, h.y);
          ctx.lineTo(h.x + h.w/2, h.y + h.h);
          ctx.stroke();
        } else if (h.type === 'gas') {
          ctx.fillStyle = 'rgba(81, 207, 102, 0.3)';
          ctx.fillRect(h.x, h.y, h.w, h.h);
        }
      });

      // Draw Defenses
      defenses.forEach(d => {
        let cx = d.gx * GRID_SIZE + GRID_SIZE/2;
        let cy = d.gy * GRID_SIZE + GRID_SIZE/2;

        ctx.fillStyle = TOOLS[d.type].color;
        ctx.beginPath();
        ctx.arc(cx, cy, GRID_SIZE * 0.35, 0, Math.PI * 2);
        ctx.fill();

        // Aura Radius
        ctx.strokeStyle = TOOLS[d.type].color;
        ctx.lineWidth = 1;
        ctx.globalAlpha = 0.2;
        ctx.beginPath();
        ctx.arc(cx, cy, GRID_SIZE * 1.2, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1.0;
      });

      // Draw Boss Smelter Beam Event
      if (smelterBeam.active) {
        if (smelterBeam.warningTimer > 0) {
          // Warning laser line
          ctx.strokeStyle = 'rgba(255, 0, 0, 0.4)';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(smelterBeam.x, 0); ctx.lineTo(smelterBeam.x, canvas.height);
          ctx.stroke();
        } else {
          // Active Smelter Beam
          ctx.fillStyle = 'rgba(255, 87, 34, 0.4)';
          ctx.fillRect(smelterBeam.x - 25, 0, 50, canvas.height);
          ctx.fillStyle = '#ff5722';
          ctx.fillRect(smelterBeam.x - 5, 0, 10, canvas.height);
        }
      }

      // Draw Creatures
      creatures.forEach(c => {
        ctx.fillStyle = c.color;
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
        ctx.fill();

        // Draw HP Bar
        if (c.hp < c.maxHp) {
          ctx.fillStyle = '#c9d1d9';
          ctx.fillRect(c.x - 10, c.y - c.radius - 8, 20, 3);
          ctx.fillStyle = '#2ea043';
          ctx.fillRect(c.x - 10, c.y - c.radius - 8, (c.hp / c.maxHp) * 20, 3);
        }
      });

      // Draw Particles
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 3, 3);
      });
    }

    // Main Game Loop
    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    updateHUD();
    loop();
  </script>
    <script>window.GAME_NAME = "Hazzard Whopper";</script>
    <script src="analytics.js" defer></script>
</body>
</html>

<!--
Reverse Tower Defense (The Hazard Engine)
In standard Tower Defense, you build towers to destroy enemies. Here, the world is an active factory or storm trying to kill your horde, and you build defense structures to protect the pathway.
You place temporary energy shields, wind deflectors, heat radiators, or gravity wells along the creature's path to absorb incoming environmental hazards (acid rain, falling debris, laser grids) just long enough for the swarm to pass through safely.
-->
