<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Upriver Navigator - Fish Market Edition</title>
  <style>
    * {
      box-sizing: border-box;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #08111a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 850px;
      overflow: hidden;
      background: #113859;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .hud-box {
      position: absolute;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 8px 12px;
      font-weight: bold;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
      z-index: 5;
      pointer-events: none;
    }
    #hud-left { 
      top: 12px; 
      left: 12px; 
      font-size: 14px; 
      line-height: 1.4; 
    }
    #hud-right { 
      top: 12px; 
      right: 12px; 
      font-size: 15px; 
      text-align: right; 
      line-height: 1.4;
      border-color: rgba(241, 196, 15, 0.4);
    }

    #dock-prompt {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #f39c12 0%, #d35400 100%);
      border: 2px solid #f1c40f;
      color: #fff;
      padding: 10px 20px;
      border-radius: 25px;
      font-weight: 900;
      font-size: 16px;
      letter-spacing: 1px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      z-index: 8;
      cursor: pointer;
      display: none;
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      from { transform: translateX(-50%) scale(1); }
      to { transform: translateX(-50%) scale(1.06); }
    }

    .controls-overlay {
      position: absolute;
      bottom: 15px;
      left: 12px;
      right: 12px;
      height: 85px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 6;
      pointer-events: none;
    }
    .steer-group, .gas-group {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }
    .ctrl-btn {
      background: linear-gradient(180deg, #2b4258 0%, #172736 100%);
      border: 2px solid #486a8a;
      border-radius: 12px;
      color: #72a5d4;
      font-size: 24px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      cursor: pointer;
    }
    .ctrl-btn:active, .ctrl-btn.active {
      transform: scale(0.95);
      background: #172736;
      border-color: #3b82f6;
      color: #fff;
    }
    .steer-btn { width: 68px; height: 68px; }
    .drive-btn { width: 72px; height: 68px; font-size: 15px; }
    .gas-btn {
      background: linear-gradient(180deg, #27ae60 0%, #1e8449 100%);
      border-color: #2ecc71;
      color: #e8f8f5;
    }
    .rev-btn {
      background: linear-gradient(180deg, #c0392b 0%, #922b21 100%);
      border-color: #e74c3c;
      color: #fadbd8;
    }

    .shop-overlay {
      position: absolute;
      inset: 0;
      background: rgba(8, 18, 28, 0.92);
      backdrop-filter: blur(5px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 10;
      text-align: center;
    }
    .shop-card {
      background: linear-gradient(180deg, #152535 0%, #0d1722 100%);
      border: 2px solid #2c445a;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 350px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
    }
    .shop-title {
      font-size: 22px;
      margin: 0 0 6px 0;
      color: #f1c40f;
    }
    .shop-subtitle {
      font-size: 13px;
      color: #90a4ae;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .trade-box {
      background: rgba(241, 196, 15, 0.1);
      border: 1px dashed #f1c40f;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-upgrade {
      width: 100%;
      background: #1e3a5f;
      border: 1px solid #3b82f6;
      color: white;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 10px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-upgrade:disabled { opacity: 0.4; border-color: #555; }
    .btn-launch {
      width: 100%;
      background: linear-gradient(180deg, #e67e22 0%, #d35400 100%);
      border: 1px solid #f39c12;
      color: white;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 8px;
      cursor: pointer;
      letter-spacing: 1px;
    }
    .btn-launch:disabled {
      background: #444;
      border-color: #666;
      color: #aaa;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<div id="game-container">
  <div class="hud-box" id="hud-left">
    Distance: <span id="dist-val">0</span>m<br>
    Current: <span id="spd-val">1.8</span>x
  </div>
  
  <div class="hud-box" id="hud-right">
    🐟 Fish: <span id="fish-val">0</span><br>
    💵 Cash: $<span id="cash-val">0</span>
  </div>

  <div id="dock-prompt">⚓ PRESS TO DOCK & SELL FISH</div>

  <canvas id="canvas"></canvas>

  <div class="controls-overlay">
    <div class="steer-group">
      <div class="ctrl-btn steer-btn" id="btn-left">◀</div>
      <div class="ctrl-btn steer-btn" id="btn-right">▶</div>
    </div>
    <div class="gas-group">
      <div class="ctrl-btn drive-btn rev-btn" id="btn-rev">REV ▼</div>
      <div class="ctrl-btn drive-btn gas-btn" id="btn-gas">GAS ▲</div>
    </div>
  </div>

  <div id="shop" class="shop-overlay">
    <div class="shop-card">
      <h2 class="shop-title" id="shop-header">⚓ River Fish Market</h2>
      <div class="shop-subtitle" id="shop-desc">Catch fish in the river, stop at docks to trade for cash, and upgrade your boat!</div>
      
      <div class="trade-box" id="trade-container">
        <div>
          <div style="font-size: 12px; color: #aaa;">CARGO HOLD</div>
          <div style="font-size: 16px; font-weight: bold; color: #fff;"><span id="shop-fish-count">0</span> Fish</div>
        </div>
        <button class="ctrl-btn" id="sell-fish-btn" style="height: 36px; padding: 0 12px; font-size: 13px; background: #27ae60; border-color: #2ecc71; color: #fff;">SELL ALL ($5/ea)</button>
      </div>

      <button class="btn-upgrade" id="buy-motor">
        <span>Engine Lvl <span id="lvl-m">1</span></span>
        <span id="cost-m">$10</span>
      </button>
      <button class="btn-upgrade" id="buy-rudder">
        <span>Rudder Lvl <span id="lvl-r">1</span></span>
        <span id="cost-r">$10</span>
      </button>

      <button class="btn-launch" id="start-btn">LAUNCH BOAT</button>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
  }

  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playPickupSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(440, audioCtx.currentTime);
    osc.frequency.setValueAtTime(587.33, audioCtx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.25);
  }
  function playSellSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
    osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08);
    osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.16);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.35);
  }
  function playCrashSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(130, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.4);
  }

  let distance = 0;
  let fishCollected = 0;
  let cash = 0;
  let motorLevel = 1;
  let rudderLevel = 1;
  let playing = false;
  let nextDockDistance = 120;

  const boat = { x: 0, y: 0, angle: 0, width: 28, height: 56 };
  let currentSpeed = 1.8;
  let items = [];
  let obstacles = [];
  let docks = [];
  let activeDockNear = null;
  let inputState = { left: false, right: false, gas: false, rev: false };

  function generateRockShape(radius) {
    const points = [];
    const numPoints = 8 + Math.floor(Math.random() * 5);
    for (let i = 0; i < numPoints; i++) {
      const angle = (i / numPoints) * Math.PI * 2;
      const r = radius * (0.75 + Math.random() * 0.4);
      points.push({ x: Math.cos(angle) * r, y: Math.sin(angle) * r });
    }
    return points;
  }

  window.addEventListener('keydown', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') inputState.left = true;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') inputState.right = true;
    if (e.code === 'ArrowUp' || e.code === 'KeyW') inputState.gas = true;
    if (e.code === 'ArrowDown' || e.code === 'KeyS') inputState.rev = true;
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') inputState.left = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') inputState.right = false;
    if (e.code === 'ArrowUp' || e.code === 'KeyW') inputState.gas = false;
    if (e.code === 'ArrowDown' || e.code === 'KeyS') inputState.rev = false;
  });

  function bindTouch(id, key) {
    const btn = document.getElementById(id);
    const start = (e) => { e.preventDefault(); inputState[key] = true; btn.classList.add('active'); };
    const end = (e) => { e.preventDefault(); inputState[key] = false; btn.classList.remove('active'); };
    btn.addEventListener('touchstart', start); btn.addEventListener('touchend', end);
    btn.addEventListener('mousedown', start); btn.addEventListener('mouseup', end); btn.addEventListener('mouseleave', end);
  }
  bindTouch('btn-left', 'left');
  bindTouch('btn-right', 'right');
  bindTouch('btn-gas', 'gas');
  bindTouch('btn-rev', 'rev');

  document.getElementById('dock-prompt').addEventListener('click', openDockMarket);
  document.getElementById('sell-fish-btn').addEventListener('click', () => {
    if (fishCollected > 0) {
      cash += fishCollected * 5;
      fishCollected = 0;
      playSellSound();
      updateShopUI();
    }
  });

  document.getElementById('start-btn').addEventListener('click', () => {
    if (document.getElementById('start-btn').disabled) return;
    startGame();
  });

  document.getElementById('buy-motor').addEventListener('click', () => {
    if (cash >= motorLevel * 10) { cash -= motorLevel * 10; motorLevel++; updateShopUI(); }
  });
  document.getElementById('buy-rudder').addEventListener('click', () => {
    if (cash >= rudderLevel * 10) { cash -= rudderLevel * 10; rudderLevel++; updateShopUI(); }
  });

  function updateShopUI() {
    document.getElementById('fish-val').innerText = fishCollected;
    document.getElementById('cash-val').innerText = cash;
    document.getElementById('shop-fish-count').innerText = fishCollected;
    document.getElementById('lvl-m').innerText = motorLevel;
    document.getElementById('cost-m').innerText = `$${motorLevel * 10}`;
    document.getElementById('lvl-r').innerText = rudderLevel;
    document.getElementById('cost-r').innerText = `$${rudderLevel * 10}`;
    document.getElementById('buy-motor').disabled = cash < motorLevel * 10;
    document.getElementById('buy-rudder').disabled = cash < rudderLevel * 10;
    document.getElementById('sell-fish-btn').disabled = fishCollected === 0;
  }

  function startGame() {
    initAudio();
    resizeCanvas();
    boat.x = canvas.width / 2;
    boat.y = canvas.height - 180;
    boat.angle = 0;
    distance = 0;
    currentSpeed = 1.8;
    items = [];
    obstacles = [];
    docks = [];
    activeDockNear = null;
    nextDockDistance = 120;
    playing = true;
    document.getElementById('dock-prompt').style.display = 'none';
    document.getElementById('shop').style.display = 'none';
    requestAnimationFrame(gameLoop);
  }

  function openDockMarket() {
    playing = false;
    document.getElementById('dock-prompt').style.display = 'none';
    document.getElementById('shop-header').innerText = "⚓ Docked at Outfitter";
    document.getElementById('shop-desc').innerText = "Trade your fish cargo for cash and upgrade your boat!";
    
    const launchBtn = document.getElementById('start-btn');
    launchBtn.innerText = "RESUME TRIP";
    launchBtn.disabled = false;

    updateShopUI();
    document.getElementById('shop').style.display = 'flex';
  }

  function drawDetailedBoat(b) {
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.angle);

    if (inputState.gas || inputState.rev) {
      ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.beginPath();
      const dir = inputState.gas ? 1 : -1;
      ctx.arc(0, (dir * b.height / 2) + (dir * 10), 8 + Math.random() * 4, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = '#4a2c11';
    ctx.beginPath();
    ctx.moveTo(0, -b.height / 2);
    ctx.bezierCurveTo(b.width / 1.1, -b.height / 4, b.width / 1.1, b.height / 3, b.width / 2, b.height / 2);
    ctx.lineTo(-b.width / 2, b.height / 2);
    ctx.bezierCurveTo(-b.width / 1.1, b.height / 3, -b.width / 1.1, -b.height / 4, 0, -b.height / 2);
    ctx.fill();
    ctx.strokeStyle = '#2b1808';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#8b5a2b';
    ctx.beginPath();
    ctx.moveTo(0, -b.height / 2 + 5);
    ctx.bezierCurveTo(b.width / 1.5, -b.height / 4, b.width / 1.5, b.height / 3, b.width / 2 - 3, b.height / 2 - 3);
    ctx.lineTo(-b.width / 2 + 3, b.height / 2 - 3);
    ctx.bezierCurveTo(-b.width / 1.5, b.height / 3, -b.width / 1.5, -b.height / 4, 0, -b.height / 2 + 5);
    ctx.fill();

    ctx.fillStyle = '#5c3a1e';
    ctx.fillRect(-b.width / 2.3, -b.height / 8, b.width / 1.15, 6);
    ctx.fillRect(-b.width / 2.2, b.height / 4, b.width / 1.1, 6);

    ctx.strokeStyle = '#d0d0d0';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(b.width / 3, 0); ctx.lineTo(b.width / 2 + 10, -b.height / 3); ctx.stroke();

    ctx.fillStyle = '#111';
    ctx.fillRect(-5, b.height / 2 - 2, 10, 10);
    ctx.fillStyle = '#333';
    ctx.fillRect(-7, b.height / 2 + 4, 14, 6);

    ctx.restore();
  }

  function drawTexturedRock(rock) {
    ctx.save();
    ctx.translate(rock.x, rock.y);

    ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
    ctx.beginPath();
    ctx.arc(2, 4, rock.radius + 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#656d78';
    ctx.beginPath();
    rock.points.forEach((pt, i) => {
      if (i === 0) ctx.moveTo(pt.x, pt.y);
      else ctx.lineTo(pt.x, pt.y);
    });
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = '#434a54';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.restore();
  }

  function drawFish(item) {
    ctx.save();
    ctx.translate(item.x, item.y);

    ctx.fillStyle = '#3498db';
    ctx.beginPath();
    ctx.ellipse(0, 0, 10, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(8, 0);
    ctx.lineTo(14, -5);
    ctx.lineTo(14, 5);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-5, -2, 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawDock(dock) {
    ctx.save();
    ctx.translate(dock.x, dock.y);

    ctx.fillStyle = '#795548';
    ctx.fillRect(0, -20, dock.width, 40);
    ctx.strokeStyle = '#3e2723';
    ctx.lineWidth = 2;
    ctx.strokeRect(0, -20, dock.width, 40);

    ctx.fillStyle = '#212121';
    ctx.fillRect(dock.width - 6, -24, 8, 8);
    ctx.fillRect(dock.width - 6, 16, 8, 8);

    ctx.restore();
  }

  function gameLoop() {
    if (!playing) return;

    const turnSpeed = 0.04 + (rudderLevel * 0.007);
    if (inputState.left) boat.angle -= turnSpeed;
    if (inputState.right) boat.angle += turnSpeed;

    let drivePower = 0;
    if (inputState.gas) {
      drivePower = 2.4 + (motorLevel * 0.6);
    } else if (inputState.rev) {
      drivePower = -(1.5 + (motorLevel * 0.3));
    }

    const forwardX = Math.sin(boat.angle) * drivePower;
    const forwardY = -Math.cos(boat.angle) * drivePower;

    boat.x += forwardX;
    boat.y += forwardY + currentSpeed;

    distance += 0.1;
    currentSpeed = 1.8 + (distance / 600);

    if (boat.y < 60) boat.y = 60;

    if (boat.y > canvas.height + 40) {
      playCrashSound();
      endGame("The swift river swept your boat downriver!");
      return;
    }

    if (boat.x < 35 || boat.x > canvas.width - 35) {
      playCrashSound();
      endGame("You crashed into the river bank!");
      return;
    }

    if (distance >= nextDockDistance) {
      docks.push({
        x: 25,
        y: -40,
        width: 65
      });
      nextDockDistance += 150 + Math.random() * 100;
    }

    if (Math.random() < 0.035) {
      items.push({ x: Math.random() * (canvas.width - 120) + 60, y: -30 });
    }
    if (Math.random() < 0.008 + (distance / 12000)) {
      const radius = 16 + Math.random() * 12;
      obstacles.push({
        x: Math.random() * (canvas.width - 140) + 70,
        y: -40,
        radius: radius,
        points: generateRockShape(radius)
      });
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#2d4a22';
    ctx.fillRect(0, 0, 30, canvas.height);
    ctx.fillRect(canvas.width - 30, 0, 30, canvas.height);

    activeDockNear = null;
    for (let i = docks.length - 1; i >= 0; i--) {
      let dock = docks[i];
      dock.y += currentSpeed;
      drawDock(dock);

      const distToDock = Math.hypot(boat.x - (dock.x + dock.width), boat.y - dock.y);
      if (distToDock < 55) {
        activeDockNear = dock;
      }

      if (dock.y > canvas.height + 60) {
        docks.splice(i, 1);
      }
    }

    const promptElem = document.getElementById('dock-prompt');
    if (activeDockNear) {
      promptElem.style.display = 'block';
    } else {
      promptElem.style.display = 'none';
    }

    for (let i = items.length - 1; i >= 0; i--) {
      let item = items[i];
      item.y += currentSpeed;
      drawFish(item);

      if (Math.hypot(boat.x - item.x, boat.y - item.y) < 22) {
        fishCollected += 1;
        playPickupSound();
        items.splice(i, 1);
      }
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
      let rock = obstacles[i];
      rock.y += currentSpeed;
      drawTexturedRock(rock);

      if (rock.y > canvas.height + 60) {
        obstacles.splice(i, 1);
        continue;
      }

      if (Math.hypot(boat.x - rock.x, boat.y - rock.y) < rock.radius + 14) {
        playCrashSound();
        endGame("Smashed into a jagged rock!");
        return;
      }
    }

    drawDetailedBoat(boat);

    document.getElementById('dist-val').innerText = Math.floor(distance);
    document.getElementById('spd-val').innerText = (currentSpeed / 1.8).toFixed(1);
    document.getElementById('fish-val').innerText = fishCollected;
    document.getElementById('cash-val').innerText = cash;

    requestAnimationFrame(gameLoop);
  }

  function endGame(reason) {
    playing = false;
    document.getElementById('dock-prompt').style.display = 'none';
    document.getElementById('shop-header').innerText = "💥 Boat Damaged!";
    document.getElementById('shop-desc').innerText = `${reason} Traveled ${Math.floor(distance)} meters.`;
    
    const launchBtn = document.getElementById('start-btn');
    launchBtn.disabled = true;
    updateShopUI();
    document.getElementById('shop').style.display = 'flex';

    let countdown = 3;
    launchBtn.innerText = `TRY AGAIN (${countdown}s)`;

    const timer = setInterval(() => {
      countdown--;
      if (countdown > 0) {
        launchBtn.innerText = `TRY AGAIN (${countdown}s)`;
      } else {
        clearInterval(timer);
        launchBtn.innerText = "TRY AGAIN";
        launchBtn.disabled = false;
      }
    }, 1000);
  }

  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();
</script>
</body>
</html>
