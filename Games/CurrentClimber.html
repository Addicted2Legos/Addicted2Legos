<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Upriver Navigator</title>
  <style>
    * {
      box-sizing: border-box;
      touch-action: none; /* Prevents touch scrolling on mobile */
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #111;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 450px;
      height: 100%;
      max-height: 800px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      background: #1e5799;
    }
    canvas {
      width: 100%;
      flex-grow: 1;
      display: block;
    }
    .hud {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-weight: bold;
      font-size: 18px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      z-index: 5;
    }
    /* Touch Controls Overlay */
    .controls-container {
      width: 100%;
      height: 120px;
      background: #0d2847;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px;
      gap: 10px;
      z-index: 5;
      border-top: 3px solid #333;
    }
    .touch-btn {
      flex: 1;
      height: 100%;
      background: #2980b9;
      color: white;
      border: 2px solid #3498db;
      border-radius: 12px;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      active-bg: #1c5980;
    }
    .touch-btn:active, .touch-btn.active {
      background: #1f618d;
      transform: scale(0.96);
    }
    .touch-btn.throttle {
      background: #27ae60;
      border-color: #2ecc71;
    }
    .touch-btn.throttle:active, .touch-btn.throttle.active {
      background: #1e8449;
    }
    .shop-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      padding: 20px;
      text-align: center;
      z-index: 10;
    }
    .btn {
      background: #27ae60;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      max-width: 280px;
    }
    .btn:disabled { background: #555; opacity: 0.6; }
  </style>
</head>
<body>

<div id="game-container">
  <div class="hud">
    <div id="score-display">Distance: 0m</div>
    <div id="cash-display">Coins: $0</div>
  </div>

  <canvas id="canvas"></canvas>

  <!-- On-Screen Mobile Touch Controls -->
  <div class="controls-container">
    <div class="touch-btn" id="btn-left">◀ Steer</div>
    <div class="touch-btn throttle" id="btn-throttle">▲ Gas</div>
    <div class="touch-btn" id="btn-right">Steer ▶</div>
  </div>

  <div id="shop" class="shop-overlay">
    <h1 id="shop-title">Upriver Navigator</h1>
    <p id="shop-desc">Hold <b>GAS</b> to fight the current! Don't let your boat turn sideways or crash into rocks.</p>
    <button class="btn" id="buy-motor">Upgrade Motor ($10)</button>
    <button class="btn" id="buy-rudder">Upgrade Rudder ($10)</button>
    <button class="btn" id="start-btn" style="margin-top: 15px; background: #e67e22;">Launch Boat</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resizeCanvas() {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
  }
  window.addEventListener('resize', resizeCanvas);

  // --- Audio System ---
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playPickupSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
    osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.25);
  }

  function playCrashSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(120, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.4);
    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.4);
  }

  // --- Game State ---
  let distance = 0;
  let coins = 0;
  let motorLevel = 1;
  let rudderLevel = 1;
  let playing = false;

  const boat = {
    x: 0,
    y: 0,
    angle: 0,
    width: 22,
    height: 42
  };

  let currentSpeed = 2.0;
  let items = [];
  let obstacles = [];
  let inputState = { left: false, right: false, throttle: false };

  // Keyboard
  window.addEventListener('keydown', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') inputState.left = true;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') inputState.right = true;
    if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') inputState.throttle = true;
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') inputState.left = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') inputState.right = false;
    if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') inputState.throttle = false;
  });

  // Touch Handlers for On-Screen Buttons
  function bindTouch(elementId, stateKey) {
    const btn = document.getElementById(elementId);
    const start = (e) => { e.preventDefault(); inputState[stateKey] = true; btn.classList.add('active'); };
    const end = (e) => { e.preventDefault(); inputState[stateKey] = false; btn.classList.remove('active'); };
    
    btn.addEventListener('touchstart', start);
    btn.addEventListener('touchend', end);
    btn.addEventListener('mousedown', start);
    btn.addEventListener('mouseup', end);
    btn.addEventListener('mouseleave', end);
  }

  bindTouch('btn-left', 'left');
  bindTouch('btn-right', 'right');
  bindTouch('btn-throttle', 'throttle');

  document.getElementById('start-btn').addEventListener('click', startGame);
  document.getElementById('buy-motor').addEventListener('click', () => {
    if (coins >= motorLevel * 10) {
      coins -= motorLevel * 10;
      motorLevel++;
      updateShopUI();
    }
  });
  document.getElementById('buy-rudder').addEventListener('click', () => {
    if (coins >= rudderLevel * 10) {
      coins -= rudderLevel * 10;
      rudderLevel++;
      updateShopUI();
    }
  });

  function updateShopUI() {
    document.getElementById('cash-display').innerText = `Coins: $${coins}`;
    document.getElementById('buy-motor').innerText = `Upgrade Motor Lvl ${motorLevel + 1} ($${motorLevel * 10})`;
    document.getElementById('buy-rudder').innerText = `Upgrade Rudder Lvl ${rudderLevel + 1} ($${rudderLevel * 10})`;
    document.getElementById('buy-motor').disabled = coins < motorLevel * 10;
    document.getElementById('buy-rudder').disabled = coins < rudderLevel * 10;
  }

  function startGame() {
    initAudio();
    resizeCanvas();
    boat.x = canvas.width / 2;
    boat.y = canvas.height - 150;
    boat.angle = 0;
    distance = 0;
    currentSpeed = 1.8; // Friendly starting current speed
    items = [];
    obstacles = [];
    playing = true;
    document.getElementById('shop').style.display = 'none';
    requestAnimationFrame(gameLoop);
  }

  function gameLoop() {
    if (!playing) return;

    // Steering
    const turnSpeed = 0.035 + (rudderLevel * 0.006);
    if (inputState.left) boat.angle -= turnSpeed;
    if (inputState.right) boat.angle += turnSpeed;

    // Upgraded Throttle Power: Level 1 provides sufficient speed over base river current (1.8)
    let appliedPower = 0.8; // Idle drift force forward
    if (inputState.throttle) {
      appliedPower = 2.4 + (motorLevel * 0.6); // Strong push upstream
    }

    const forwardX = Math.sin(boat.angle) * appliedPower;
    const forwardY = -Math.cos(boat.angle) * appliedPower;
    
    // Sideways river drag kicks in harder if turned sideways
    const sidewaysDrag = Math.sin(boat.angle) * currentSpeed * 1.6;

    boat.x += forwardX + sidewaysDrag;
    boat.y += forwardY + currentSpeed;

    // Difficulty increases with distance
    distance += 0.1;
    currentSpeed = 1.8 + (distance / 600);

    // Keep boat in upper bounds
    if (boat.y < 80) boat.y = 80;

    // --- Loss Conditions ---
    if (Math.abs(boat.angle) > 1.2 || boat.y > canvas.height + 30) {
      playCrashSound();
      endGame("The current turned your boat sideways and washed you down!");
      return;
    }

    if (boat.x < 30 || boat.x > canvas.width - 30) {
      playCrashSound();
      endGame("You crashed into the river bank!");
      return;
    }

    // --- Spawns ---
    if (Math.random() < 0.035) {
      items.push({ x: Math.random() * (canvas.width - 100) + 50, y: -20, radius: 9 });
    }

    if (Math.random() < 0.008 + (distance / 12000)) {
      obstacles.push({ x: Math.random() * (canvas.width - 120) + 60, y: -30, radius: 12 + Math.random() * 8 });
    }

    // --- Render ---
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // River banks
    ctx.fillStyle = '#27ae60';
    ctx.fillRect(0, 0, 25, canvas.height);
    ctx.fillRect(canvas.width - 25, 0, 25, canvas.height);

    // Items (Coins)
    for (let i = items.length - 1; i >= 0; i--) {
      let item = items[i];
      item.y += currentSpeed;
      
      ctx.fillStyle = '#f1c40f';
      ctx.beginPath();
      ctx.arc(item.x, item.y, item.radius, 0, Math.PI * 2);
      ctx.fill();

      if (Math.hypot(boat.x - item.x, boat.y - item.y) < item.radius + 15) {
        coins += 5;
        playPickupSound();
        items.splice(i, 1);
      }
    }

    // Obstacles (Rocks)
    for (let i = obstacles.length - 1; i >= 0; i--) {
      let rock = obstacles[i];
      rock.y += currentSpeed;

      ctx.fillStyle = '#7f8c8d';
      ctx.beginPath();
      ctx.arc(rock.x, rock.y, rock.radius, 0, Math.PI * 2);
      ctx.fill();

      if (rock.y > canvas.height + 50) {
        obstacles.splice(i, 1);
        continue;
      }

      if (Math.hypot(boat.x - rock.x, boat.y - rock.y) < rock.radius + 12) {
        playCrashSound();
        endGame("You hit a rock!");
        return;
      }
    }

    // Player Boat
    ctx.save();
    ctx.translate(boat.x, boat.y);
    ctx.rotate(boat.angle);

    ctx.fillStyle = '#9b59b6';
    ctx.beginPath();
    ctx.moveTo(0, -boat.height / 2);
    ctx.lineTo(boat.width / 2, boat.height / 2);
    ctx.lineTo(-boat.width / 2, boat.height / 2);
    ctx.closePath();
    ctx.fill();

    // Outboard Motor
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(-4, boat.height / 2, 8, 8);
    ctx.restore();

    document.getElementById('score-display').innerText = `Distance: ${Math.floor(distance)}m`;
    document.getElementById('cash-display').innerText = `Coins: $${coins}`;

    requestAnimationFrame(gameLoop);
  }

  function endGame(reason) {
    playing = false;
    document.getElementById('shop-title').innerText = "Washed Out!";
    document.getElementById('shop-desc').innerText = `${reason} Distance: ${Math.floor(distance)}m.`;
    document.getElementById('start-btn').innerText = "Try Again";
    updateShopUI();
    document.getElementById('shop').style.display = 'flex';
  }

  resizeCanvas();
</script>
</body>
</html>
