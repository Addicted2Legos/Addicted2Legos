<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ledger · DualAscent</title>
    <!-- Clerk: this app uses its own Clerk application, separate from ClickLasers.html.
         Replace data-clerk-publishable-key and src domain with the values from that app's dashboard (Configure > API Keys) -->
    <script
      async
      crossorigin="anonymous"
      data-clerk-publishable-key="pk_test_ZWFzeS1jb3lvdGUtNjAuY2xlcmsuYWNjb3VudHMuZGV2JA"
      src="https://easy-coyote-60.clerk.accounts.dev/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
      type="text/javascript"
    ></script>
    <!-- Supabase: this app uses its own Supabase project, separate from ClickLasers.html.
         Replace SUPABASE_URL / SUPABASE_ANON_KEY constants in app.js once your project is set up.
         Schema additions this version depends on live in DualAscent/Supabase/ — run these in the
         Supabase SQL editor first: 20260805_dualledger_v2.sql (is_solo, member_profiles, learning_items),
         then 20260806_dualascent_goal_types.sql (goal_type on goals, for individual vs. shared goals),
         then 20260807_fix_household_members_recursion.sql (fixes "infinite recursion detected in policy
         for relation household_members" when loading your household), then 20260813_apply_missing_schema.sql
         (applies the above tables/columns that were written but never actually run live), then
         20260815_partner_email_link.sql (replaces the invite-code partner flow with mutual email entry),
         then 20260815_support_messages.sql (adds the Support page's question/comment board),
         then 20260815_solo_partner_upgrade.sql (fixes linking a partner from an already-solo
         household so it correctly flips is_solo and unlocks shared features). -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="Images/DualAscentLogoTransparentBackground.png">
</head>
<body data-page="tab-ledger">

<div class="container">
<div class="page-shell">
<nav class="step-sidebar" id="step-sidebar" style="display:none;"></nav>

<div class="main-col">
    <div id="auth-bar">
        <a href="support.html" class="support-link">Support</a>
        <button id="sign-in-btn" class="action-btn clerk-sign-in-trigger" style="margin-top:0;">Sign In</button>
        <div id="user-button"></div>
    </div>

    <div id="app-shell" style="display:none;">

        <div id="archetype-banner" class="archetype-banner" style="display:none;">
            <span id="archetype-banner-text"></span>
            <a href="archetype.html" class="archetype-banner-link">Update →</a>
        </div>

        <div class="step-content">

        <div id="tab-ledger" class="tab-content active">
            <div id="ledger-gate" class="gate-message">Sign in above to start tracking shared expenses.</div>
            <div id="ledger-app" style="display:none;">
                <h2>Household Ledger</h2>
                <p>Log shared expenses and always know exactly who owes whom.</p>

                <div id="balance-summary" class="summary-box"></div>

                <div class="card">
                    <h3>Add an Expense</h3>
                    <label>Description</label>
                    <input type="text" id="ledger-desc" placeholder="e.g., Groceries, Electric Bill">
                    <label>Amount ($)</label>
                    <input type="number" id="ledger-amount" placeholder="80.00">
                    <label>Paid By</label>
                    <select id="ledger-paid-by"></select>
                    <label>Payer's Share (%) <span style="font-weight:normal; color:var(--text-muted);">— default 50/50, edit for an uneven split</span></label>
                    <input type="number" id="ledger-share-pct" value="50" min="0" max="100">
                    <button class="action-btn" onclick="addLedgerEntry()">Add Expense</button>
                </div>

                <div class="card">
                    <h3>Recent Entries</h3>
                    <div id="ledger-list"></div>
                </div>
            </div>
        </div>

        </div>
    </div>
</div>
</div>
</div>

<img src="Images/DualAscentLogoWide.png" alt="DualAscent" class="page-footer-logo">

<div id="toast-container"></div>

<script src="nav.js"></script>
<script src="app.js"></script>

</body>
</html>
