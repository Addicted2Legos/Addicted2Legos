<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error Log · DualAscent</title>
    <!-- Clerk: this app uses its own Clerk application, separate from ClickLasers.html.
         Replace data-clerk-publishable-key and src domain with the values from that app's dashboard (Configure > API Keys) -->
    <script
      async
      crossorigin="anonymous"
      data-clerk-publishable-key="pk_test_ZWFzeS1jb3lvdGUtNjAuY2xlcmsuYWNjb3VudHMuZGV2JA"
      src="https://easy-coyote-60.clerk.accounts.dev/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
      type="text/javascript"
    ></script>
    <!-- Supabase: this app uses its own Supabase project, separate from ClickLasers.html.
         Needs 20260816_admin_and_error_log.sql applied — see admin.html's comment for details. -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="Images/DualAscentLogoTransparentBackground.png">
</head>
<body data-page="admin-errors">

<div class="container">
<div class="page-shell">
<nav class="step-sidebar" id="step-sidebar" style="display:none;"></nav>

<div class="main-col">
    <div id="auth-bar">
        <a href="connectedaccounts.html" class="support-link">Connected Accounts</a>
        <a href="support.html" class="support-link">Support</a>
        <button id="sign-in-btn" class="action-btn clerk-sign-in-trigger" style="margin-top:0;">Sign In</button>
        <div id="user-button"></div>
    </div>

    <div id="app-shell" style="display:none;">

        <div class="step-content">

        <div id="tab-admin-errors" class="tab-content active">
            <h2>Error Log</h2>
            <p><a href="admin.html">← Back to Admin</a></p>

            <div id="admin-gate" class="gate-message" style="display:none;">
                <span class="gate-icon">🔒</span>
                <span class="gate-title">Admins only</span>
                <span class="gate-detail">You don't have admin access on this account.</span>
            </div>

            <div id="error-log-content" style="display:none;">

                <div id="error-log-list-wrap">
                    <div class="card" style="overflow-x:auto;">
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>Date/Time</th>
                                    <th>Severity</th>
                                    <th>Source</th>
                                    <th>Message</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="error-log-rows"></tbody>
                        </table>
                    </div>
                </div>

                <div id="error-log-detail-wrap" style="display:none;">
                    <div class="error-detail-nav">
                        <button class="action-btn secondary-btn" onclick="renderErrorLogList()">← Back to list</button>
                        <span id="error-detail-position"></span>
                        <div>
                            <button class="action-btn secondary-btn" id="error-detail-prev-btn" onclick="navigateErrorDetail(-1)">← Older</button>
                            <button class="action-btn secondary-btn" id="error-detail-next-btn" onclick="navigateErrorDetail(1)">Newer →</button>
                        </div>
                    </div>

                    <div class="card">
                        <div class="error-detail-field">
                            <label>Date/Time</label>
                            <div class="error-detail-value" id="error-detail-when"></div>
                        </div>
                        <div class="error-detail-field">
                            <label>Severity</label>
                            <div class="error-detail-value" id="error-detail-severity"></div>
                        </div>
                        <div class="error-detail-field">
                            <label>Source</label>
                            <div class="error-detail-value" id="error-detail-source"></div>
                        </div>
                        <div class="error-detail-field">
                            <label>Message</label>
                            <div class="error-detail-value" id="error-detail-message"></div>
                        </div>
                        <div class="error-detail-field">
                            <label>Stack Trace / Details</label>
                            <pre class="error-detail-value" id="error-detail-stack"></pre>
                        </div>
                        <div class="error-detail-field">
                            <label>Context</label>
                            <pre class="error-detail-value" id="error-detail-context"></pre>
                        </div>
                        <div class="error-detail-field">
                            <label>Page</label>
                            <div class="error-detail-value" id="error-detail-page"></div>
                        </div>
                        <div class="error-detail-field">
                            <label>URL</label>
                            <div class="error-detail-value" id="error-detail-url"></div>
                        </div>
                        <div class="error-detail-field">
                            <label>Signed-in User</label>
                            <div class="error-detail-value" id="error-detail-user"></div>
                        </div>
                        <div class="error-detail-field">
                            <label>Browser</label>
                            <div class="error-detail-value" id="error-detail-user-agent"></div>
                        </div>

                        <button class="action-btn" id="error-detail-resolve-btn" onclick="toggleErrorResolved()">Mark Resolved</button>
                        <p id="error-detail-resolved-info"></p>
                    </div>
                </div>

            </div>
        </div>

        </div>
    </div>
</div>
</div>
</div>

<img src="Images/DualAscentLogoWide.png" alt="DualAscent" class="page-footer-logo">

<div id="toast-container"></div>

<script src="nav.js"></script>
<script src="app.js"></script>

</body>
</html>
