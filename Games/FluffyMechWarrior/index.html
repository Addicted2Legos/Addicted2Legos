<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ongoing Environment Sandbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Game Wrapper Container -->
    <div id="gameContainer">
        <!-- HUD Overlay for Real-time Feedback -->
        <div id="hud">
            <div class="hud-card">HP: <span id="playerHp">3</span></div>
            <div class="hud-card">Controls: WASD + Space Bar</div>
        </div>

        <!-- The main high-performance drawing layer -->
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- Loaded as plain scripts (not ES modules) so the game also
         works when index.html is opened directly from disk, where
         browsers block module imports over the file:// protocol -->
    <script src="./src/AssetLoader.js"></script>
    <script src="./src/data/gameConfig.js"></script>
    <script src="./src/entities/Bullet.js"></script>
    <script src="./src/entities/Enemy.js"></script>
    <script src="./src/entities/Player.js"></script>
    <script src="./src/entities/EntityManager.js"></script>
    <script src="./src/Game.js"></script>
    <script src="./src/main.js"></script>
    
    <script>window.GAME_NAME = "Fluffy Mech Warrior";</script>
    <script src="../analytics.js" defer></script>
</body>
</html>
