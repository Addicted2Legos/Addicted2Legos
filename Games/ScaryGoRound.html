<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Merry-Go-Round Endurance Challenge</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      touch-action: manipulation;
    }
    #ui-container {
      width: 90%;
      max-width: 400px;
      padding-top: env(safe-area-inset-top, 15px);
      margin-top: 10px;
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }
    h1 {
      margin: 0;
      font-size: clamp(18px, 4.5vw, 24px);
      color: #facc15;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .stats-row {
      display: flex;
      justify-content: space-between;
      margin: 8px 0 4px 0;
      font-size: 14px;
      color: #94a3b8;
      font-weight: 600;
    }
    .stat-val {
      color: #38edf8;
    }
    /* Intensity Meter Gauge */
    #meter-box {
      width: 100%;
      height: 16px;
      background: #1e293b;
      border-radius: 10px;
      border: 2px solid #334155;
      overflow: hidden;
      position: relative;
    }
    #meter-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #eab308, #ef4444);
      transition: width 0.1s linear;
      border-radius: 8px;
    }
    #game-wrapper {
      position: relative;
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      touch-action: none;
    }
    #win-screen {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 23, 42, 0.98);
      padding: 30px 40px;
      border-radius: 24px;
      border: 4px solid #facc15;
      text-align: center;
      box-shadow: 0 0 50px rgba(250, 204, 21, 0.5);
      z-index: 20;
    }
    button {
      background: #e11d48;
      color: white;
      border: none;
      padding: 16px 32px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 4px 15px rgba(225, 29, 72, 0.4);
    }
    button:active { transform: scale(0.95); }
  </style>
</head>
<body>

<div id="ui-container">
  <h1>Endurance Spin</h1>
  
  <div class="stats-row">
    <span>RPM: <span id="rpm" class="stat-val">0</span></span>
    <span>Target Time: <span id="timer" class="stat-val">0.0s / 10s</span></span>
    <span>Kids: <span id="count" class="stat-val">20</span></span>
  </div>

  <div id="meter-box">
    <div id="meter-bar"></div>
  </div>
</div>

<div id="game-wrapper">
  <canvas id="game"></canvas>
  
  <div id="win-screen">
    <h2 style="font-size: 32px; color: #facc15; margin: 0 0 10px 0;">VICTORY!</h2>
    <p style="color: #fff; margin: 0;">You held high speed for 10 seconds!</p>
    <button id="restart-btn">Play Again</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const countEl = document.getElementById('count');
  const rpmEl = document.getElementById('rpm');
  const timerEl = document.getElementById('timer');
  const meterBar = document.getElementById('meter-bar');
  const winScreen = document.getElementById('win-screen');
  const restartBtn = document.getElementById('restart-btn');

  let size = 0, center = 0, radius = 0;
  let angle = 0, angularVelocity = 0;
  let kids = [], flyingKids = [];

  // Rules: Hold high speed threshold (0.13 rad/frame) for 10 seconds total accumulated time
  const TARGET_SPEED = 0.13; 
  let highSpeedTime = 0; // accumulated seconds at target speed

  const KID_COLORS = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4'];

  function resize() {
    const wrapper = document.getElementById('game-wrapper');
    size = Math.min(wrapper.clientWidth, wrapper.clientHeight) * 0.95;
    canvas.width = size;
    canvas.height = size;
    center = size / 2;
    radius = size * 0.42;
  }
  window.addEventListener('resize', resize);
  resize();

  function initKids() {
    kids = [];
    flyingKids = [];
    highSpeedTime = 0;
    for (let i = 0; i < 20; i++) {
      kids.push({
        id: i,
        rRatio: 0.2 + Math.random() * 0.7,
        a: Math.random() * Math.PI * 2,
        color: KID_COLORS[i % KID_COLORS.length],
        // Each kid falls off at a staggered point between 0s and 10s of sustained high speed
        requiredHoldTime: 0.5 + (i / 20) * 9.5 + Math.random() * 0.4 
      });
    }
    countEl.textContent = kids.length;
    timerEl.textContent = "0.0s / 10s";
    winScreen.style.display = 'none';
  }

  function drawKidWithEyes(x, y, r, color, rotationAngle) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotationAngle);

    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.lineWidth = size * 0.005;
    ctx.strokeStyle = '#ffffff';
    ctx.stroke();

    const eyeRadius = r * 0.35;
    const eyeOffset = r * 0.4;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(-eyeOffset, -r * 0.1, eyeRadius, 0, Math.PI * 2);
    ctx.arc(eyeOffset, -r * 0.1, eyeRadius, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#000000";
    ctx.beginPath();
    ctx.arc(-eyeOffset, -r * 0.1 - eyeRadius * 0.3, eyeRadius * 0.5, 0, Math.PI * 2);
    ctx.arc(eyeOffset, -r * 0.1 - eyeRadius * 0.3, eyeRadius * 0.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function handleTap(e) {
    if (kids.length > 0) {
      e.preventDefault();
      angularVelocity += 0.038;
    }
  }

  window.addEventListener('touchstart', handleTap, { passive: false });
  window.addEventListener('mousedown', handleTap);

  restartBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    angularVelocity = 0;
    initKids();
  });

  function update() {
    angle += angularVelocity;
    angularVelocity *= 0.985; // Friction

    // Meter & Speed Calculations
    const rpm = Math.round(angularVelocity * 60 * (60 / (Math.PI * 2)));
    rpmEl.textContent = rpm;

    const intensity = Math.min(1.0, angularVelocity / TARGET_SPEED);
    meterBar.style.width = (intensity * 100) + "%";

    // Build endurance time if speed exceeds threshold
    if (angularVelocity >= TARGET_SPEED) {
      highSpeedTime += 1 / 60; // 60 FPS frame step
      timerEl.textContent = Math.min(10, highSpeedTime).toFixed(1) + "s / 10s";
    }

    // Check which kids lose grip based on sustained time
    for (let i = kids.length - 1; i >= 0; i--) {
      let k = kids[i];
      if (highSpeedTime >= k.requiredHoldTime) {
        let kRadius = k.rRatio * radius;
        let currentSpeed = angularVelocity * kRadius;
        let worldAngle = angle + k.a;

        let x = center + Math.cos(worldAngle) * kRadius;
        let y = center + Math.sin(worldAngle) * kRadius;
        let vx = -Math.sin(worldAngle) * currentSpeed;
        let vy = Math.cos(worldAngle) * currentSpeed;

        flyingKids.push({ x, y, vx, vy, color: k.color, rotation: worldAngle });
        kids.splice(i, 1);
        countEl.textContent = kids.length;

        if (navigator.vibrate) navigator.vibrate(40);
        if (kids.length === 0) winScreen.style.display = 'block';
      }
    }

    // Update airborne kids
    for (let i = flyingKids.length - 1; i >= 0; i--) {
      let fk = flyingKids[i];
      fk.x += fk.vx;
      fk.y += fk.vy;
      fk.rotation += angularVelocity * 2;
      if (fk.x < -100 || fk.x > size + 100 || fk.y < -100 || fk.y > size + 100) {
        flyingKids.splice(i, 1);
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, size, size);

    ctx.save();
    ctx.translate(center, center);
    ctx.rotate(angle);

    // Render Carousel
    const wedges = 12;
    const slice = (Math.PI * 2) / wedges;
    for (let i = 0; i < wedges; i++) {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, radius, i * slice, (i + 1) * slice);
      ctx.fillStyle = (i % 2 === 0) ? '#38bdf8' : '#e0f2fe';
      ctx.fill();
    }

    ctx.lineWidth = size * 0.02;
    ctx.strokeStyle = '#e11d48';
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.stroke();

    // Kids on platform
    const kidSize = size * 0.028;
    kids.forEach(k => {
      let kx = Math.cos(k.a) * (k.rRatio * radius);
      let ky = Math.sin(k.a) * (k.rRatio * radius);
      drawKidWithEyes(kx, ky, kidSize, k.color, k.a + Math.PI / 2);
    });

    ctx.fillStyle = '#facc15';
    ctx.beginPath();
    ctx.arc(0, 0, radius * 0.12, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();

    // Flying kids
    flyingKids.forEach(fk => {
      drawKidWithEyes(fk.x, fk.y, kidSize, fk.color, fk.rotation);
    });

    update();
    requestAnimationFrame(draw);
  }

  initKids();
  draw();
</script>

    <script>window.GAME_NAME = "Scary Go Round";</script>
    <script src="analytics.js" defer></script>
</body>
</html>
