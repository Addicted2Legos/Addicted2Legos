<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Realistic Waterfall Parting</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #080f0b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            font-weight: 500;
            pointer-events: none;
            text-shadow: 0 2px 6px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <div id="ui">Touch the waterfall to block and split the water</div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let damTop, damBottom, damLeft, damWidth;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            
            damTop = height * 0.15;
            damBottom = height * 0.82;
            damWidth = Math.min(width * 0.88, 900);
            damLeft = (width - damWidth) / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        // Touch & Mouse Handling
        const activeTouches = [];

        function handlePointer(e) {
            e.preventDefault();
            activeTouches.length = 0;
            const rect = canvas.getBoundingClientRect();

            if (e.touches) {
                for (let i = 0; i < e.touches.length; i++) {
                    activeTouches.push({
                        x: e.touches[i].clientX - rect.left,
                        y: e.touches[i].clientY - rect.top,
                        r: 35 // Finger obstacle radius
                    });
                }
            } else if (isMouseDown) {
                activeTouches.push({
                    x: e.clientX - rect.left,
                    y: e.clientY - rect.top,
                    r: 35
                });
            }
        }

        let isMouseDown = false;
        canvas.addEventListener('touchstart', handlePointer, { passive: false });
        canvas.addEventListener('touchmove', handlePointer, { passive: false });
        canvas.addEventListener('touchend', handlePointer, { passive: false });
        canvas.addEventListener('mousedown', (e) => { isMouseDown = true; handlePointer(e); });
        canvas.addEventListener('mousemove', (e) => { if(isMouseDown) handlePointer(e); });
        canvas.addEventListener('mouseup', () => { isMouseDown = false; activeTouches.length = 0; });

        // High density vertical stream lines
        const NUM_STREAMS = 220;
        const streams = [];

        for (let i = 0; i < NUM_STREAMS; i++) {
            streams.push({
                xRatio: i / (NUM_STREAMS - 1),
                speed: 4 + Math.random() * 3,
                width: 1.5 + Math.random() * 2,
                alpha: 0.5 + Math.random() * 0.4
            });
        }

        let time = 0;

        function render() {
            time += 0.05;
            ctx.clearRect(0, 0, width, height);

            // 1. ENVIRONMENT BACKGROUND
            ctx.fillStyle = '#0a140d';
            ctx.fillRect(0, 0, width, height);

            // Upper Pool
            let topGrad = ctx.createLinearGradient(0, 0, 0, damTop);
            topGrad.addColorStop(0, '#0d261a');
            topGrad.addColorStop(1, '#1b4d35');
            ctx.fillStyle = topGrad;
            ctx.fillRect(0, 0, width, damTop);

            // Wall Background (Dark behind water)
            let wallGrad = ctx.createLinearGradient(0, damTop, 0, damBottom);
            wallGrad.addColorStop(0, '#151718');
            wallGrad.addColorStop(1, '#08090a');
            ctx.fillStyle = wallGrad;
            ctx.fillRect(damLeft, damTop, damWidth, damBottom - damTop);

            // Concrete Side Concrete Abutments
            ctx.fillStyle = '#2b2d30';
            ctx.fillRect(0, 0, damLeft, height);
            ctx.fillRect(damLeft + damWidth, 0, damLeft, height);

            // Spillway Lip
            ctx.fillStyle = '#51565a';
            ctx.fillRect(damLeft - 4, damTop - 5, damWidth + 8, 6);

            // 2. WATERFALL CURTAIN WITH EXCLUSION/PARTING LOGIC
            const steps = 60;
            const dy = (damBottom - damTop) / steps;

            for (let s = 0; s < NUM_STREAMS; s++) {
                const stream = streams[s];
                const originX = damLeft + (stream.xRatio * damWidth);

                ctx.beginPath();
                ctx.lineWidth = stream.width;
                
                // Realistic water gradient
                let streamGrad = ctx.createLinearGradient(0, damTop, 0, damBottom);
                streamGrad.addColorStop(0, `rgba(225, 250, 255, ${stream.alpha})`);
                streamGrad.addColorStop(0.5, `rgba(165, 225, 240, ${stream.alpha * 0.7})`);
                streamGrad.addColorStop(1, `rgba(240, 255, 255, ${stream.alpha})`);
                ctx.strokeStyle = streamGrad;

                let currX = originX;
                let currY = damTop;
                ctx.moveTo(currX, currY);

                for (let i = 1; i <= steps; i++) {
                    let nextY = damTop + (i * dy);
                    let nextX = originX;

                    // Calculate deflection for all active touch obstacles
                    for (let touch of activeTouches) {
                        // Only affect water at or below touch point
                        if (nextY >= touch.y - touch.r) {
                            let distX = nextX - touch.x;
                            let distY = nextY - touch.y;

                            // Shadow/Wedge region below finger where water cannot go
                            let verticalDist = nextY - touch.y;
                            let clearWidth = touch.r + (verticalDist * 0.25); // Wedge opens downward

                            if (Math.abs(distX) < clearWidth && verticalDist > -touch.r) {
                                // Force water strictly OUTWARD to left or right
                                let direction = distX >= 0 ? 1 : -1;
                                if (distX === 0) direction = stream.xRatio > 0.5 ? 1 : -1;

                                let pushAmount = clearWidth - Math.abs(distX) + 8;
                                nextX += direction * pushAmount;
                            }
                        }
                    }

                    // Gentle fluid motion texture down the spillway
                    let textureShift = Math.sin((time * stream.speed) + (i * 0.3)) * 0.7;
                    nextX += textureShift;

                    ctx.lineTo(nextX, nextY);
                }

                ctx.stroke();
            }

            // 3. BOTTOM POOL & SPLASH EFFECTS
            let poolGrad = ctx.createLinearGradient(0, damBottom, 0, height);
            poolGrad.addColorStop(0, '#132e22');
            poolGrad.addColorStop(1, '#050c09');
            ctx.fillStyle = poolGrad;
            ctx.fillRect(0, damBottom, width, height - damBottom);

            // Splash Mist at Base
            let mistGrad = ctx.createLinearGradient(0, damBottom - 15, 0, damBottom + 25);
            mistGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
            mistGrad.addColorStop(0.5, 'rgba(230, 250, 255, 0.8)');
            mistGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = mistGrad;
            ctx.fillRect(damLeft, damBottom - 15, damWidth, 40);

            // Touch Indicators & Splashes around fingers
            for (let touch of activeTouches) {
                // Obstacle circle (Finger position)
                ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.beginPath();
                ctx.arc(touch.x, touch.y, touch.r, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Top Splash Rim where water hits the finger
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.beginPath();
                ctx.arc(touch.x, touch.y - touch.r + 4, touch.r * 0.8, Math.PI, 0);
                ctx.fill();
            }

            requestAnimationFrame(render);
        }

        render();
    </script>
</body>
</html>
