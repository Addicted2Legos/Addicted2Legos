<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Realistic Water Flow</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d1a10;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.85);
            font-size: 15px;
            pointer-events: none;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div id="ui">Touch or drag anywhere to redirect the water flow</div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let damTop, damBottom, damLeft, damWidth;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            
            damTop = height * 0.20;
            damBottom = height * 0.75;
            damWidth = Math.min(width * 0.85, 800);
            damLeft = (width - damWidth) / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        // Touch & Mouse Interaction handling
        const activeTouches = [];

        function handlePointer(e) {
            e.preventDefault();
            activeTouches.length = 0;
            const rect = canvas.getBoundingClientRect();

            if (e.touches) {
                for (let i = 0; i < e.touches.length; i++) {
                    activeTouches.push({
                        x: e.touches[i].clientX - rect.left,
                        y: e.touches[i].clientY - rect.top
                    });
                }
            } else if (isMouseDown) {
                activeTouches.push({
                    x: e.clientX - rect.left,
                    y: e.clientY - rect.top
                });
            }
        }

        let isMouseDown = false;
        canvas.addEventListener('touchstart', handlePointer, { passive: false });
        canvas.addEventListener('touchmove', handlePointer, { passive: false });
        canvas.addEventListener('touchend', handlePointer, { passive: false });
        canvas.addEventListener('mousedown', (e) => { isMouseDown = true; handlePointer(e); });
        canvas.addEventListener('mousemove', (e) => { if(isMouseDown) handlePointer(e); });
        canvas.addEventListener('mouseup', () => { isMouseDown = false; activeTouches.length = 0; });

        // Flow Stream Lines (Simulates solid fluid curtain)
        const NUM_STREAMS = 120;
        const streams = [];

        for (let i = 0; i < NUM_STREAMS; i++) {
            streams.push({
                offsetRatio: i / NUM_STREAMS,
                speed: 1.5 + Math.random() * 1.5,
                phase: Math.random() * 100,
                width: 1.5 + Math.random() * 2
            });
        }

        // Simulating continuous water movement offset
        let flowOffset = 0;

        function drawBackground() {
            // Dark forest background
            ctx.fillStyle = '#111f15';
            ctx.fillRect(0, 0, width, height);

            // Upper Quiet River Basin
            let topGrad = ctx.createLinearGradient(0, 0, 0, damTop);
            topGrad.addColorStop(0, '#0a1d13');
            topGrad.addColorStop(1, '#1b3d2b');
            ctx.fillStyle = topGrad;
            ctx.fillRect(0, 0, width, damTop);

            // Concrete Side Walls
            ctx.fillStyle = '#2b2e30';
            ctx.fillRect(0, 0, damLeft, height);
            ctx.fillRect(damLeft + damWidth, 0, damLeft, height);

            // Concrete Weir Backwall (Dark behind falling water)
            let wallGrad = ctx.createLinearGradient(0, damTop, 0, damBottom);
            wallGrad.addColorStop(0, '#1a1c1d');
            wallGrad.addColorStop(1, '#0e0f10');
            ctx.fillStyle = wallGrad;
            ctx.fillRect(damLeft, damTop, damWidth, damBottom - damTop);

            // Top Spillway Edge
            ctx.fillStyle = '#4f5458';
            ctx.fillRect(damLeft - 5, damTop - 6, damWidth + 10, 8);
        }

        function drawWaterSheet() {
            flowOffset += 0.08;
            
            const numSteps = 40; // Vertical resolution for smooth bending
            const stepHeight = (damBottom - damTop) / numSteps;

            ctx.save();
            
            // Render the solid water sheet via dynamic vertical stream lines
            for (let s = 0; s < NUM_STREAMS; s++) {
                const stream = streams[s];
                const baseX = damLeft + (stream.offsetRatio * damWidth);
                
                ctx.beginPath();
                ctx.lineWidth = stream.width + (width > 600 ? 3 : 1.5);

                // Natural water color gradient
                let streamGrad = ctx.createLinearGradient(0, damTop, 0, damBottom);
                streamGrad.addColorStop(0, 'rgba(215, 245, 250, 0.85)');
                streamGrad.addColorStop(0.2, 'rgba(160, 220, 235, 0.65)');
                streamGrad.addColorStop(0.8, 'rgba(180, 230, 242, 0.75)');
                streamGrad.addColorStop(1, 'rgba(240, 253, 255, 0.9)');

                ctx.strokeStyle = streamGrad;

                let currentX = baseX;
                let currentY = damTop;
                ctx.moveTo(currentX, currentY);

                for (let i = 1; i <= numSteps; i++) {
                    let nextY = damTop + (i * stepHeight);
                    let nextX = baseX;

                    // Apply touch displacement (fluid bending)
                    for (let touch of activeTouches) {
                        let dx = nextX - touch.x;
                        let dy = nextY - touch.y;
                        let dist = Math.sqrt(dx * dx + dy * dy);
                        let maxDist = 70; // Influence radius

                        if (dist < maxDist) {
                            let push = (1 - dist / maxDist) * 45;
                            let direction = dx >= 0 ? 1 : -1;
                            nextX += direction * push;
                        }
                    }

                    // Add subtle fluid wave oscillation
                    nextX += Math.sin(flowOffset * stream.speed + i * 0.3 + stream.phase) * 1.2;

                    ctx.lineTo(nextX, nextY);
                }

                ctx.stroke();
            }

            ctx.restore();
        }

        function drawFoamAndSplash() {
            // Bottom Pool Water
            let poolGrad = ctx.createLinearGradient(0, damBottom, 0, height);
            poolGrad.addColorStop(0, '#153227');
            poolGrad.addColorStop(1, '#091510');
            ctx.fillStyle = poolGrad;
            ctx.fillRect(0, damBottom, width, height - damBottom);

            // Base Mist/Foam Layer (Dense continuous mist at bottom)
            let mistGrad = ctx.createLinearGradient(0, damBottom - 20, 0, damBottom + 30);
            mistGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
            mistGrad.addColorStop(0.5, 'rgba(235, 250, 252, 0.7)');
            mistGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');

            ctx.fillStyle = mistGrad;
            ctx.fillRect(damLeft, damBottom - 25, damWidth, 55);

            // Touch interaction highlight ring
            for (let touch of activeTouches) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(touch.x, touch.y, 40, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = 'rgba(200, 245, 255, 0.15)';
                ctx.beginPath();
                ctx.arc(touch.x, touch.y, 35, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            drawBackground();
            drawWaterSheet();
            drawFoamAndSplash();

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
