<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Downward Waterfall Flow</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050b07;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            font-weight: 500;
            pointer-events: none;
            text-shadow: 0 2px 6px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <div id="ui">Touch the waterfall to split the falling water</div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let damTop, damBottom, damLeft, damWidth;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            
            damTop = height * 0.15;
            damBottom = height * 0.82;
            damWidth = Math.min(width * 0.88, 900);
            damLeft = (width - damWidth) / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        // Pointer Tracking
        const activeTouches = [];

        function handlePointer(e) {
            e.preventDefault();
            activeTouches.length = 0;
            const rect = canvas.getBoundingClientRect();

            if (e.touches) {
                for (let i = 0; i < e.touches.length; i++) {
                    activeTouches.push({
                        x: e.touches[i].clientX - rect.left,
                        y: e.touches[i].clientY - rect.top,
                        r: 40 // Obstacle radius
                    });
                }
            } else if (isMouseDown) {
                activeTouches.push({
                    x: e.clientX - rect.left,
                    y: e.clientY - rect.top,
                    r: 40
                });
            }
        }

        let isMouseDown = false;
        canvas.addEventListener('touchstart', handlePointer, { passive: false });
        canvas.addEventListener('touchmove', handlePointer, { passive: false });
        canvas.addEventListener('touchend', handlePointer, { passive: false });
        canvas.addEventListener('mousedown', (e) => { isMouseDown = true; handlePointer(e); });
        canvas.addEventListener('mousemove', (e) => { if(isMouseDown) handlePointer(e); });
        canvas.addEventListener('mouseup', () => { isMouseDown = false; activeTouches.length = 0; });

        // Physics Water Strands
        const NUM_PARTICLES = 500;
        const particles = [];

        class WaterDroplet {
            constructor() {
                this.reset(true);
            }

            reset(randomY = false) {
                this.x = damLeft + Math.random() * damWidth;
                this.y = randomY ? damTop + Math.random() * (damBottom - damTop) : damTop;
                this.vy = 8 + Math.random() * 6; // High downward velocity
                this.vx = 0;
                this.length = 15 + Math.random() * 25; // Vertical trailing line length
                this.width = 1.5 + Math.random() * 2.5;
                this.alpha = 0.4 + Math.random() * 0.5;
            }

            update() {
                // Gravity acceleration (strictly DOWN)
                this.vy += 0.3;
                
                // Position updates
                let nextY = this.y + this.vy;
                let nextX = this.x + this.vx;

                // Air resistance / friction recovery
                this.vx *= 0.85;

                // Collision & Parting Logic around Finger
                for (let touch of activeTouches) {
                    let dx = nextX - touch.x;
                    let dy = nextY - touch.y;
                    
                    // Direct touch collision
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < touch.r + 5) {
                        let side = dx >= 0 ? 1 : -1;
                        if (dx === 0) side = Math.random() > 0.5 ? 1 : -1;
                        
                        // Push violently to the side
                        this.vx = side * (8 + Math.random() * 4);
                        nextX = touch.x + side * (touch.r + 6);
                    }

                    // Shadow / Wake Wedge UNDER the finger (downward wedge)
                    if (nextY > touch.y && nextY < touch.y + 180) {
                        let vertDist = nextY - touch.y;
                        let wedgeWidth = touch.r + (vertDist * 0.35); // Expanding wake wedge down
                        let distFromCenter = nextX - touch.x;

                        if (Math.abs(distFromCenter) < wedgeWidth) {
                            let side = distFromCenter >= 0 ? 1 : -1;
                            nextX = touch.x + (side * wedgeWidth);
                            this.vx = side * 3;
                        }
                    }
                }

                this.x = nextX;
                this.y = nextY;

                // Reset when hitting bottom basin
                if (this.y >= damBottom) {
                    this.reset(false);
                }
            }

            draw() {
                ctx.beginPath();
                ctx.lineWidth = this.width;
                
                // Trail line pointing DOWN
                let grad = ctx.createLinearGradient(this.x, this.y - this.length, this.x, this.y);
                grad.addColorStop(0, `rgba(255, 255, 255, 0)`);
                grad.addColorStop(0.7, `rgba(180, 235, 250, ${this.alpha})`);
                grad.addColorStop(1, `rgba(255, 255, 255, ${this.alpha + 0.2})`);

                ctx.strokeStyle = grad;
                ctx.moveTo(this.x - (this.vx * 1.5), this.y - this.length);
                ctx.lineTo(this.x, this.y);
                ctx.stroke();
            }
        }

        // Initialize particles
        for (let i = 0; i < NUM_PARTICLES; i++) {
            particles.push(new WaterDroplet());
        }

        function drawEnvironment() {
            // Dark Background
            ctx.fillStyle = '#060f09';
            ctx.fillRect(0, 0, width, height);

            // Upper Pool
            let topGrad = ctx.createLinearGradient(0, 0, 0, damTop);
            topGrad.addColorStop(0, '#0a2116');
            topGrad.addColorStop(1, '#184732');
            ctx.fillStyle = topGrad;
            ctx.fillRect(0, 0, width, damTop);

            // Back Wall (Dark behind falling sheet)
            let wallGrad = ctx.createLinearGradient(0, damTop, 0, damBottom);
            wallGrad.addColorStop(0, '#121415');
            wallGrad.addColorStop(1, '#070809');
            ctx.fillStyle = wallGrad;
            ctx.fillRect(damLeft, damTop, damWidth, damBottom - damTop);

            // Concrete Abutments
            ctx.fillStyle = '#26282a';
            ctx.fillRect(0, 0, damLeft, height);
            ctx.fillRect(damLeft + damWidth, 0, damLeft, height);

            // Concrete Dam Lip
            ctx.fillStyle = '#4d5256';
            ctx.fillRect(damLeft - 4, damTop - 5, damWidth + 8, 6);
        }

        function drawBottomPool() {
            // Lower Basin Pool
            let poolGrad = ctx.createLinearGradient(0, damBottom, 0, height);
            poolGrad.addColorStop(0, '#11291e');
            poolGrad.addColorStop(1, '#040a07');
            ctx.fillStyle = poolGrad;
            ctx.fillRect(0, damBottom, width, height - damBottom);

            // Base Foam/Mist where water crashes down
            let mistGrad = ctx.createLinearGradient(0, damBottom - 20, 0, damBottom + 25);
            mistGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
            mistGrad.addColorStop(0.5, 'rgba(230, 252, 255, 0.85)');
            mistGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');

            ctx.fillStyle = mistGrad;
            ctx.fillRect(damLeft, damBottom - 20, damWidth, 45);

            // Touch Indicators & Splashes
            for (let touch of activeTouches) {
                // Splash ring where top water hits the finger
                ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                ctx.beginPath();
                ctx.arc(touch.x, touch.y - touch.r + 5, touch.r * 0.9, Math.PI, 0);
                ctx.fill();

                // Finger obstacle footprint
                ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.beginPath();
                ctx.arc(touch.x, touch.y, touch.r, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            drawEnvironment();

            // Render and update every particle downward
            for (let p of particles) {
                p.update();
                p.draw();
            }

            drawBottomPool();

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
