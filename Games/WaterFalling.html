<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Waterfall Flow</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0c1810;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.85);
            font-size: 15px;
            pointer-events: none;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <div id="ui">Touch to part the falling water</div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let damTop, damBottom, damLeft, damWidth;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            
            damTop = height * 0.18;
            damBottom = height * 0.78;
            damWidth = Math.min(width * 0.85, 800);
            damLeft = (width - damWidth) / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        // Touch & Mouse Interaction handling
        const activeTouches = [];

        function handlePointer(e) {
            e.preventDefault();
            activeTouches.length = 0;
            const rect = canvas.getBoundingClientRect();

            if (e.touches) {
                for (let i = 0; i < e.touches.length; i++) {
                    activeTouches.push({
                        x: e.touches[i].clientX - rect.left,
                        y: e.touches[i].clientY - rect.top,
                        radius: 50 // Splitting radius around finger
                    });
                }
            } else if (isMouseDown) {
                activeTouches.push({
                    x: e.clientX - rect.left,
                    y: e.clientY - rect.top,
                    radius: 50
                });
            }
        }

        let isMouseDown = false;
        canvas.addEventListener('touchstart', handlePointer, { passive: false });
        canvas.addEventListener('touchmove', handlePointer, { passive: false });
        canvas.addEventListener('touchend', handlePointer, { passive: false });
        canvas.addEventListener('mousedown', (e) => { isMouseDown = true; handlePointer(e); });
        canvas.addEventListener('mousemove', (e) => { if(isMouseDown) handlePointer(e); });
        canvas.addEventListener('mouseup', () => { isMouseDown = false; activeTouches.length = 0; });

        // Streams for smooth vertical sheet
        const NUM_STREAMS = 160;
        const streams = [];

        for (let i = 0; i < NUM_STREAMS; i++) {
            streams.push({
                offsetRatio: i / NUM_STREAMS,
                speed: 3 + Math.random() * 2,
                phase: Math.random() * 50,
                width: 1.5 + Math.random() * 2
            });
        }

        let flowOffset = 0;

        function drawBackground() {
            // Background Environment
            ctx.fillStyle = '#0f1a14';
            ctx.fillRect(0, 0, width, height);

            // Upper Quiet Reservoir
            let topGrad = ctx.createLinearGradient(0, 0, 0, damTop);
            topGrad.addColorStop(0, '#0a1d13');
            topGrad.addColorStop(1, '#1a3c2b');
            ctx.fillStyle = topGrad;
            ctx.fillRect(0, 0, width, damTop);

            // Concrete Side Abutments
            ctx.fillStyle = '#2d3032';
            ctx.fillRect(0, 0, damLeft, height);
            ctx.fillRect(damLeft + damWidth, 0, damLeft, height);

            // Concrete Backwall behind water
            let wallGrad = ctx.createLinearGradient(0, damTop, 0, damBottom);
            wallGrad.addColorStop(0, '#1d1f21');
            wallGrad.addColorStop(1, '#0e0f10');
            ctx.fillStyle = wallGrad;
            ctx.fillRect(damLeft, damTop, damWidth, damBottom - damTop);

            // Spillway Crest Edge
            ctx.fillStyle = '#565b60';
            ctx.fillRect(damLeft - 5, damTop - 6, damWidth + 10, 8);
        }

        function drawWaterSheet() {
            flowOffset += 0.12; // Downward movement tracking
            
            const numSteps = 50; // High resolution downward steps
            const stepHeight = (damBottom - damTop) / numSteps;

            ctx.save();
            
            for (let s = 0; s < NUM_STREAMS; s++) {
                const stream = streams[s];
                const baseX = damLeft + (stream.offsetRatio * damWidth);
                
                ctx.beginPath();
                ctx.lineWidth = stream.width + (width > 600 ? 2.5 : 1.2);

                // Waterfall Color Gradient
                let streamGrad = ctx.createLinearGradient(0, damTop, 0, damBottom);
                streamGrad.addColorStop(0, 'rgba(220, 248, 255, 0.85)');
                streamGrad.addColorStop(0.25, 'rgba(170, 225, 238, 0.65)');
                streamGrad.addColorStop(0.85, 'rgba(195, 238, 248, 0.75)');
                streamGrad.addColorStop(1, 'rgba(245, 255, 255, 0.95)');

                ctx.strokeStyle = streamGrad;

                let currentX = baseX;
                let currentY = damTop;
                ctx.moveTo(currentX, currentY);

                // Calculate downward flow curve for this stream
                for (let i = 1; i <= numSteps; i++) {
                    let nextY = damTop + (i * stepHeight); // Strictly DOWNWARD progression
                    let nextX = baseX;

                    // Apply outward splitting force around any finger/touch
                    for (let touch of activeTouches) {
                        let dx = nextX - touch.x;
                        let dy = nextY - touch.y;
                        let dist = Math.sqrt(dx * dx + dy * dy);

                        // Push water to left/right off finger
                        if (dist < touch.radius && nextY >= touch.y - 10) {
                            let pushForce = (1 - (dist / touch.radius));
                            // Determine which side of the finger center the water is on
                            let side = dx >= 0 ? 1 : -1; 
                            
                            // Strong horizontal displacement to split water
                            nextX += side * (touch.radius - Math.abs(dx) + 15) * pushForce;
                        }
                    }

                    // Gentle downward wave animation
                    nextX += Math.sin((flowOffset * stream.speed) + (i * 0.25) + stream.phase) * 0.8;

                    ctx.lineTo(nextX, nextY);
                }

                ctx.stroke();
            }

            ctx.restore();
        }

        function drawBottomPool() {
            // Lower Basin Pool
            let poolGrad = ctx.createLinearGradient(0, damBottom, 0, height);
            poolGrad.addColorStop(0, '#17362a');
            poolGrad.addColorStop(1, '#08120d');
            ctx.fillStyle = poolGrad;
            ctx.fillRect(0, damBottom, width, height - damBottom);

            // Base Foam/Mist where falling water lands
            let mistGrad = ctx.createLinearGradient(0, damBottom - 20, 0, damBottom + 25);
            mistGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
            mistGrad.addColorStop(0.5, 'rgba(235, 252, 255, 0.75)');
            mistGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');

            ctx.fillStyle = mistGrad;
            ctx.fillRect(damLeft, damBottom - 20, damWidth, 45);

            // Draw finger touch point indicator
            for (let touch of activeTouches) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(touch.x, touch.y, touch.radius * 0.8, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            drawBackground();
            drawWaterSheet();
            drawBottomPool();

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
