<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Inverted Direction Waterfall Flow</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050b07;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            font-weight: 500;
            pointer-events: none;
            text-shadow: 0 2px 6px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <div id="ui">Touch to part the falling water into parallel streams</div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let damTop, damBottom, damLeft, damWidth;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            
            damTop = height * 0.15;
            damBottom = height * 0.82;
            damWidth = Math.min(width * 0.88, 900);
            damLeft = (width - damWidth) / 2;
        }
        window.addEventListener('resize', resize);
        resize();

        // Pointer Tracking
        const activeTouches = [];

        function handlePointer(e) {
            e.preventDefault();
            activeTouches.length = 0;
            const rect = canvas.getBoundingClientRect();

            if (e.touches) {
                for (let i = 0; i < e.touches.length; i++) {
                    activeTouches.push({
                        x: e.touches[i].clientX - rect.left,
                        y: e.touches[i].clientY - rect.top,
                        r: 35 // Finger radius
                    });
                }
            } else if (isMouseDown) {
                activeTouches.push({
                    x: e.clientX - rect.left,
                    y: e.clientY - rect.top,
                    r: 35
                });
            }
        }

        let isMouseDown = false;
        canvas.addEventListener('touchstart', handlePointer, { passive: false });
        canvas.addEventListener('touchmove', handlePointer, { passive: false });
        canvas.addEventListener('touchend', handlePointer, { passive: false });
        canvas.addEventListener('mousedown', (e) => { isMouseDown = true; handlePointer(e); });
        canvas.addEventListener('mousemove', (e) => { if(isMouseDown) handlePointer(e); });
        canvas.addEventListener('mouseup', () => { isMouseDown = false; activeTouches.length = 0; });

        // Stream Particles
        const NUM_PARTICLES = 600;
        const particles = [];

        class WaterDroplet {
            constructor() {
                this.reset(true);
            }

            reset(randomY = false) {
                this.x = damLeft + Math.random() * damWidth;
                // Inverted Y positioning: spawn at bottom, move UP to reverse optical motion
                this.y = randomY ? damTop + Math.random() * (damBottom - damTop) : damBottom;
                this.vy = -(8 + Math.random() * 6); // Upward velocity vector
                this.vx = 0;
                this.length = 18 + Math.random() * 25;
                this.width = 1.5 + Math.random() * 2.5;
                this.alpha = 0.4 + Math.random() * 0.5;
            }

            update() {
                this.y += this.vy;
                let nextX = this.x + this.vx;

                // Dampen horizontal velocity so streams fall straight once parted
                this.vx *= 0.7;

                for (let touch of activeTouches) {
                    let dx = nextX - touch.x;
                    let dy = this.y - touch.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    // 1. Direct Touch Collision: Shift water to the exact outer edge of the finger
                    if (dist < touch.r + 2) {
                        let side = dx >= 0 ? 1 : -1;
                        if (dx === 0) side = Math.random() > 0.5 ? 1 : -1;
                        
                        // Set position right at the side boundary
                        nextX = touch.x + side * (touch.r + 4);
                        this.vx = 0; // Prevent diagonal spraying
                    }

                    // 2. Straight Vertical Channeling: Force water below/above finger to stay aligned in straight lines
                    let vertDist = Math.abs(dy);
                    let vertLimit = 150; 

                    if (vertDist < vertLimit) {
                        let side = dx >= 0 ? 1 : -1;
                        let targetX = touch.x + side * (touch.r + 6);
                        
                        // Strict straight corridor check
                        if (Math.abs(dx) < touch.r + 6) {
                            nextX = targetX;
                            this.vx = 0;
                        }
                    }
                }

                this.x = nextX;

                // Reset when passing top boundary
                if (this.y <= damTop) {
                    this.reset(false);
                }
            }

            draw() {
                ctx.beginPath();
                ctx.lineWidth = this.width;
                
                // Trail line pointing up
                let grad = ctx.createLinearGradient(this.x, this.y + this.length, this.x, this.y);
                grad.addColorStop(0, `rgba(255, 255, 255, 0)`);
                grad.addColorStop(0.7, `rgba(180, 235, 250, ${this.alpha})`);
                grad.addColorStop(1, `rgba(255, 255, 255, ${this.alpha + 0.2})`);

                ctx.strokeStyle = grad;
                ctx.moveTo(this.x, this.y + this.length);
                ctx.lineTo(this.x, this.y);
                ctx.stroke();
            }
        }

        for (let i = 0; i < NUM_PARTICLES; i++) {
            particles.push(new WaterDroplet());
        }

        function drawEnvironment() {
            ctx.fillStyle = '#060f09';
            ctx.fillRect(0, 0, width, height);

            // Top Basin
            let topGrad = ctx.createLinearGradient(0, 0, 0, damTop);
            topGrad.addColorStop(0, '#0a2116');
            topGrad.addColorStop(1, '#184732');
            ctx.fillStyle = topGrad;
            ctx.fillRect(0, 0, width, damTop);

            // Wall Background
            let wallGrad = ctx.createLinearGradient(0, damTop, 0, damBottom);
            wallGrad.addColorStop(0, '#121415');
            wallGrad.addColorStop(1, '#070809');
            ctx.fillStyle = wallGrad;
            ctx.fillRect(damLeft, damTop, damWidth, damBottom - damTop);

            // Concrete Side Walls
            ctx.fillStyle = '#26282a';
            ctx.fillRect(0, 0, damLeft, height);
            ctx.fillRect(damLeft + damWidth, 0, damLeft, height);

            // Concrete Dam Lip
            ctx.fillStyle = '#4d5256';
            ctx.fillRect(damLeft - 4, damTop - 5, damWidth + 8, 6);
        }

        function drawBottomPool() {
            let poolGrad = ctx.createLinearGradient(0, damBottom, 0, height);
            poolGrad.addColorStop(0, '#11291e');
            poolGrad.addColorStop(1, '#040a07');
            ctx.fillStyle = poolGrad;
            ctx.fillRect(0, damBottom, width, height - damBottom);

            // Base Foam/Mist
            let mistGrad = ctx.createLinearGradient(0, damBottom - 20, 0, damBottom + 25);
            mistGrad.addColorStop(0, 'rgba(255, 255, 255, 0)');
            mistGrad.addColorStop(0.5, 'rgba(230, 252, 255, 0.85)');
            mistGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');

            ctx.fillStyle = mistGrad;
            ctx.fillRect(damLeft, damBottom - 20, damWidth, 45);

            // Touch Indicators
            for (let touch of activeTouches) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
                ctx.beginPath();
                ctx.arc(touch.x, touch.y, touch.r, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            drawEnvironment();

            for (let p of particles) {
                p.update();
                p.draw();
            }

            drawBottomPool();

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
