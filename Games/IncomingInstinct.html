<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Critter Corners: Animal Rescue Whack!</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #game-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      perspective: 800px;
      overflow: hidden;
      cursor: none;
    }
    /* Dynamic background warp lines */
    .warp-line {
      position: absolute;
      background: rgba(255, 255, 255, 0.05);
      pointer-events: none;
    }
    /* Flying Entities */
    .entity {
      position: absolute;
      transform-style: preserve-3d;
      will-change: transform, opacity;
      pointer-events: none;
      filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.4));
    }
    .entity-inner {
      font-size: 80px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }
    /* Splats on Screen */
    .splat {
      position: absolute;
      pointer-events: none;
      z-index: 50;
      transform: translate(-50%, -50%) scale(0);
      animation: splatAnim 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes splatAnim {
      0% { transform: translate(-50%, -50%) scale(0.2) rotate(0deg); opacity: 0.2; }
      100% { transform: translate(-50%, -50%) scale(1) rotate(var(--rand-rot)); opacity: 0.9; }
    }
    .splat-text {
      font-size: 110px;
      filter: blur(1px) contrast(1.5);
      opacity: 0.85;
    }
    .splat-drip {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 40px;
      background: currentColor;
      border-radius: 4px;
      animation: dripAnim 2s ease-in forwards;
    }
    /* Fluffy Whacking Stick (cursor weapon) */
    #stick {
      position: absolute;
      width: 110px;
      height: 200px;
      margin-left: -55px;
      margin-top: -190px;
      pointer-events: none;
      z-index: 100;
    }
    .stick-swing {
      position: relative;
      width: 100%;
      height: 100%;
      transform-origin: 50% 95%;
    }
    .stick-swing.swing {
      animation: stickSwing 0.22s ease-out;
    }
    @keyframes stickSwing {
      0% { transform: rotate(0deg); }
      35% { transform: rotate(-52deg); }
      65% { transform: rotate(30deg); }
      100% { transform: rotate(0deg); }
    }
    .stick-shaft {
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 16px;
      height: 120px;
      background: linear-gradient(180deg, #c68a4e, #7c4a24);
      border-radius: 10px;
      box-shadow: inset -4px 0 6px rgba(0,0,0,0.35), 2px 2px 6px rgba(0,0,0,0.4);
    }
    .stick-fluff {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 108px;
      height: 108px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 30%, #ffffff, #fbe4ff 45%, #f0aef7 75%, #dd8bec 100%);
      box-shadow:
        -32px -6px 0 -8px #ffffffcc,
        34px -10px 0 -10px #ffffffbb,
        -22px 24px 0 -12px #ffffffaa,
        26px 26px 0 -8px #ffffffcc,
        2px -34px 0 -14px #ffffffbb,
        -8px 34px 0 -16px #ffffffaa;
    }
    .stick-impact {
      position: absolute;
      inset: -20px;
      border-radius: 50%;
      border: 3px dashed rgba(255,255,255,0);
      opacity: 0;
    }
    .stick-swing.swing .stick-impact {
      animation: impactPulse 0.3s ease-out;
    }
    @keyframes impactPulse {
      0% { transform: scale(0.5); opacity: 0.9; border-color: rgba(255,255,255,0.8); }
      100% { transform: scale(1.9); opacity: 0; border-color: rgba(255,255,255,0); }
    }
    /* Sorting corner zones */
    .corner-zone {
      position: absolute;
      width: 116px;
      height: 116px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.55);
      border: 3px dashed rgba(255,255,255,0.25);
      backdrop-filter: blur(6px);
      z-index: 40;
    }
    .corner-zone .corner-icon {
      font-size: 42px;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
    }
    .corner-zone .corner-label {
      font-size: 11px;
      color: #cbd5e1;
      font-weight: 700;
      margin-top: 2px;
      text-align: center;
      letter-spacing: 0.3px;
    }
    .corner-zone .corner-count {
      position: absolute;
      top: -10px;
      right: -10px;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 800;
      font-size: 14px;
      min-width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    .corner-zone.flash {
      animation: cornerFlash 0.4s ease;
    }
    @keyframes cornerFlash {
      0% { transform: scale(1); border-color: rgba(255,255,255,0.25); }
      40% { transform: scale(1.15); border-color: #4ade80; box-shadow: 0 0 25px rgba(74,222,128,0.6); }
      100% { transform: scale(1); border-color: rgba(255,255,255,0.25); }
    }
    .corner-tl { top: 20px; left: 20px; }
    .corner-tr { top: 20px; right: 20px; }
    .corner-bl { bottom: 20px; left: 20px; }
    .corner-br { bottom: 20px; right: 20px; }
    @media (max-width: 640px) {
      .corner-zone { width: 84px; height: 84px; border-radius: 14px; }
      .corner-zone .corner-icon { font-size: 30px; }
      .corner-zone .corner-label { font-size: 8px; }
    }
    /* HUD */
    #hud {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 14px;
      z-index: 150;
      color: #f8fafc;
      font-weight: 700;
    }
    .stat-card {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 10px 20px;
      border-radius: 16px;
      font-size: 18px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      white-space: nowrap;
    }
    /* Hint */
    #hint {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: #f8fafc;
      background: rgba(15, 23, 42, 0.75);
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: 600;
      z-index: 150;
      border: 1px solid rgba(255,255,255,0.15);
      transition: opacity 0.6s ease;
      pointer-events: none;
    }
    #hint.hidden { opacity: 0; }
    /* Game Over Overlay */
    #game-over {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      color: white;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #game-over.active {
      opacity: 1;
      pointer-events: auto;
    }
    #game-over h1 {
      font-size: 56px;
      margin: 0 0 10px 0;
      color: #ef4444;
      text-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
    }
    #game-over p {
      font-size: 24px;
      margin-bottom: 30px;
      color: #94a3b8;
    }
    .btn {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 16px 36px;
      font-size: 22px;
      font-weight: 800;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
    }
    .btn:hover {
      transform: scale(1.05);
      background: #7dd3fc;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.7);
    }
  </style>
</head>
<body>

  <div id="game-container">
    <div id="hud">
      <div class="stat-card">Sorted: <span id="score" style="color: #38bdf8;">0</span></div>
      <div class="stat-card">Splats: <span id="splats" style="color: #ef4444;">0 / 5</span></div>
    </div>

    <div class="corner-zone corner-tl" data-corner="tl">
      <div class="corner-icon">🐱</div>
      <div class="corner-label">Kitten Corner</div>
      <div class="corner-count" id="count-tl">0</div>
    </div>
    <div class="corner-zone corner-tr" data-corner="tr">
      <div class="corner-icon">🦆</div>
      <div class="corner-label">Duck Pond</div>
      <div class="corner-count" id="count-tr">0</div>
    </div>
    <div class="corner-zone corner-bl" data-corner="bl">
      <div class="corner-icon">🦫</div>
      <div class="corner-label">Capybara Spa</div>
      <div class="corner-count" id="count-bl">0</div>
    </div>
    <div class="corner-zone corner-br" data-corner="br">
      <div class="corner-icon">🐰</div>
      <div class="corner-label">Bunny Burrow</div>
      <div class="corner-count" id="count-br">0</div>
    </div>

    <div id="hint">Click or tap near an animal to whack it into its matching corner!</div>

    <div id="stick">
      <div class="stick-swing" id="stick-swing">
        <div class="stick-shaft"></div>
        <div class="stick-fluff">
          <div class="stick-impact"></div>
        </div>
      </div>
    </div>

    <div id="game-over">
      <h1>SCREEN CLEANING NEEDED!</h1>
      <p>Final Score: <span id="final-score">0</span> animals sorted</p>
      <button class="btn" onclick="resetGame()">PLAY AGAIN</button>
    </div>
  </div>

  <script>
    const container = document.getElementById('game-container');
    const stick = document.getElementById('stick');
    const stickSwing = document.getElementById('stick-swing');
    const scoreEl = document.getElementById('score');
    const splatsEl = document.getElementById('splats');
    const gameOverEl = document.getElementById('game-over');
    const finalScoreEl = document.getElementById('final-score');
    const hintEl = document.getElementById('hint');

    // Types of incoming animals, each assigned to a home corner with its own gait style
    const TYPES = [
      { emoji: '🐱', name: 'kitten',    size: 90,  corner: 'tl', gait: { style: 'run',    speed: 0.35, bob: 6,  sway: 3,  rot: 6  } },
      { emoji: '🦆', name: 'duck',      size: 82,  corner: 'tr', gait: { style: 'waddle', speed: 0.25, bob: 5,  sway: 10, rot: 14 } },
      { emoji: '🦫', name: 'capybara',  size: 110, corner: 'bl', gait: { style: 'waddle', speed: 0.15, bob: 8,  sway: 6,  rot: 8  } },
      { emoji: '🐰', name: 'bunny',     size: 88,  corner: 'br', gait: { style: 'hop',    speed: 0.3,  bob: 14, sway: 2,  rot: 4  } }
    ];

    const HIT_RADIUS = 150;
    const WHACK_MIN_Z = -900;
    const TIP_OFFSET_Y = 135; // distance from cursor to the fluffy tip of the stick

    let score = 0;
    let splatCount = 0;
    const MAX_SPLATS = 5;
    let entities = [];
    let mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    let isGameOver = false;
    let spawnTimer = 0;
    let isPointerDown = false;
    let lastSwingTime = 0;
    let hasWhackedOnce = false;

    const cornerPos = {};
    function computeCornerPositions() {
      document.querySelectorAll('.corner-zone').forEach(el => {
        const r = el.getBoundingClientRect();
        cornerPos[el.dataset.corner] = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
      });
    }
    computeCornerPositions();
    window.addEventListener('resize', computeCornerPositions);

    function updatePointer(x, y) {
      mouse.x = x;
      mouse.y = y;
      stick.style.transform = `translate3d(${x}px, ${y}px, 0)`;
    }
    updatePointer(mouse.x, mouse.y);

    function triggerSwingAnim() {
      stickSwing.classList.remove('swing');
      void stickSwing.offsetWidth; // restart animation
      stickSwing.classList.add('swing');
    }

    function attemptWhack() {
      if (isGameOver) return;
      triggerSwingAnim();
      if (!hasWhackedOnce) {
        hasWhackedOnce = true;
        hintEl.classList.add('hidden');
      }
      const tipX = mouse.x;
      const tipY = mouse.y - TIP_OFFSET_Y;
      entities.forEach(entity => entity.tryWhack(tipX, tipY));
    }

    function throttledSwing() {
      const now = performance.now();
      if (now - lastSwingTime > 160) {
        lastSwingTime = now;
        attemptWhack();
      }
    }

    // Pointer tracking
    window.addEventListener('mousemove', (e) => {
      updatePointer(e.clientX, e.clientY);
      if (isPointerDown) throttledSwing();
    });
    container.addEventListener('mousedown', (e) => {
      isPointerDown = true;
      updatePointer(e.clientX, e.clientY);
      attemptWhack();
    });
    window.addEventListener('mouseup', () => { isPointerDown = false; });

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) {
        isPointerDown = true;
        updatePointer(e.touches[0].clientX, e.touches[0].clientY);
        attemptWhack();
      }
    }, { passive: true });
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        updatePointer(e.touches[0].clientX, e.touches[0].clientY);
        if (isPointerDown) throttledSwing();
      }
    }, { passive: true });
    window.addEventListener('touchend', () => { isPointerDown = false; });

    // Create warp speed lines for depth effect
    for (let i = 0; i < 30; i++) {
      const line = document.createElement('div');
      line.className = 'warp-line';
      const angle = Math.random() * Math.PI * 2;
      const dist = 200 + Math.random() * 600;
      line.style.left = `${window.innerWidth / 2 + Math.cos(angle) * dist}px`;
      line.style.top = `${window.innerHeight / 2 + Math.sin(angle) * dist}px`;
      line.style.width = `${2 + Math.random() * 3}px`;
      line.style.height = `${20 + Math.random() * 50}px`;
      line.style.transform = `rotate(${angle + Math.PI/2}rad)`;
      container.appendChild(line);
    }

    function lerp(a, b, t) { return a + (b - a) * t; }

    class Entity {
      constructor() {
        const type = TYPES[Math.floor(Math.random() * TYPES.length)];
        this.type = type;
        this.emoji = type.emoji;
        this.gait = type.gait;
        this.gaitPhase = Math.random() * 10;

        // 3D coordinates (z runs from -2000 deep to 0 at the screen)
        this.z = -2000;
        // Target near screen center with slight variance
        this.targetX = (Math.random() - 0.5) * (window.innerWidth * 0.6);
        this.targetY = (Math.random() - 0.5) * (window.innerHeight * 0.6);

        this.startX = this.targetX * 0.1;
        this.startY = this.targetY * 0.1;

        this.screenX = window.innerWidth / 2 + this.startX;
        this.screenY = window.innerHeight / 2 + this.startY;
        this.currentScale = 0.1;

        // Speed accelerates as the game progresses
        this.speed = 12 + Math.random() * 8 + (score * 0.2);

        this.rotZ = 0;
        this.blown = false;

        // DOM Element
        this.el = document.createElement('div');
        this.el.className = 'entity';
        this.inner = document.createElement('div');
        this.inner.className = 'entity-inner';
        this.inner.style.fontSize = `${type.size}px`;
        this.inner.textContent = this.emoji;
        this.el.appendChild(this.inner);
        container.appendChild(this.el);
      }

      tryWhack(tipX, tipY) {
        if (this.blown || this.z <= WHACK_MIN_Z) return;
        const dx = this.screenX - tipX;
        const dy = this.screenY - tipY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < HIT_RADIUS) {
          this.startBlown();
        }
      }

      startBlown() {
        this.blown = true;
        const corner = cornerPos[this.type.corner] || { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        this.blownFromX = this.screenX;
        this.blownFromY = this.screenY;
        this.blownFromScale = this.currentScale;
        this.blownTargetX = corner.x;
        this.blownTargetY = corner.y;
        this.blownT = 0;
        this.blownDuration = 18 + Math.random() * 8;
      }

      update() {
        if (this.blown) {
          this.blownT++;
          const p = Math.min(1, this.blownT / this.blownDuration);
          const ease = 1 - Math.pow(1 - p, 3);
          const curX = lerp(this.blownFromX, this.blownTargetX, ease);
          const curY = lerp(this.blownFromY, this.blownTargetY, ease);
          const curScale = Math.max(0.15, this.blownFromScale * (1 - 0.65 * ease));
          this.rotZ += 22;

          this.el.style.opacity = `${1 - ease * 0.6}`;
          this.el.style.transform = `translate3d(${curX - 50}px, ${curY - 50}px, ${this.z}px) rotateZ(${this.rotZ}deg) scale(${curScale})`;

          if (p >= 1) {
            registerSort(this.type.corner);
            this.destroy();
            return false;
          }
        } else {
          // Fly toward screen
          this.z += this.speed;

          const progress = (this.z + 2000) / 2000;

          const screenX = (window.innerWidth / 2) + (this.startX * (1 - progress) + this.targetX * progress);
          const screenY = (window.innerHeight / 2) + (this.startY * (1 - progress) + this.targetY * progress);
          this.screenX = screenX;
          this.screenY = screenY;

          // Check Splat on Screen (Hit Z threshold) - missed animal
          if (this.z >= 0) {
            createSplat(screenX, screenY, this.emoji);
            this.destroy();
            splatCount++;
            splatsEl.textContent = `${splatCount} / ${MAX_SPLATS}`;

            if (splatCount >= MAX_SPLATS) {
              triggerGameOver();
            }
            return false;
          }

          // Locomotion animation so the animal looks like it's moving, not tumbling
          this.gaitPhase += this.gait.speed;
          const g = this.gait;
          let sway = 0, bobY = 0, rot = 0, scaleX = 1, scaleY = 1;
          if (g.style === 'hop') {
            const hop = Math.max(0, Math.sin(this.gaitPhase));
            bobY = -hop * g.bob;
            sway = Math.sin(this.gaitPhase * 0.5) * g.sway;
            rot = -hop * g.rot;
            scaleY = 1 + hop * 0.18;
            scaleX = 1 - hop * 0.12;
          } else if (g.style === 'waddle') {
            sway = Math.sin(this.gaitPhase) * g.sway;
            bobY = -Math.abs(Math.sin(this.gaitPhase * 2)) * g.bob;
            rot = Math.sin(this.gaitPhase) * g.rot;
          } else {
            bobY = -Math.abs(Math.sin(this.gaitPhase * 2)) * g.bob;
            sway = Math.sin(this.gaitPhase) * g.sway;
            rot = Math.sin(this.gaitPhase * 2) * g.rot;
          }
          this.inner.style.transform = `translate(${sway}px, ${bobY}px) rotate(${rot}deg) scale(${scaleX}, ${scaleY})`;

          // Screen positioning via CSS 3D Transforms
          const scale = Math.max(0.1, (this.z + 2000) / 2000);
          this.currentScale = scale;
          this.el.style.transform = `translate3d(${screenX - 50}px, ${screenY - 50}px, ${this.z}px) scale(${scale})`;
        }

        return true;
      }

      destroy() {
        if (this.el && this.el.parentNode) {
          this.el.parentNode.removeChild(this.el);
        }
      }
    }

    function registerSort(cornerKey) {
      score++;
      scoreEl.textContent = score;

      const countEl = document.getElementById(`count-${cornerKey}`);
      if (countEl) countEl.textContent = parseInt(countEl.textContent, 10) + 1;

      const zoneEl = document.querySelector(`.corner-zone[data-corner="${cornerKey}"]`);
      if (zoneEl) {
        zoneEl.classList.remove('flash');
        void zoneEl.offsetWidth;
        zoneEl.classList.add('flash');
      }
    }

    function createSplat(x, y, emoji) {
      const splat = document.createElement('div');
      splat.className = 'splat';
      splat.style.left = `${x}px`;
      splat.style.top = `${y}px`;
      splat.style.setProperty('--rand-rot', `${(Math.random() - 0.5) * 60}deg`);

      const text = document.createElement('div');
      text.className = 'splat-text';
      text.textContent = emoji;

      // Add a liquid drip effect to the splat
      const drip = document.createElement('div');
      drip.className = 'splat-drip';

      splat.appendChild(text);
      splat.appendChild(drip);
      container.appendChild(splat);

      // Fade out splat after a while
      setTimeout(() => {
        splat.style.transition = 'opacity 2s ease';
        splat.style.opacity = '0';
        setTimeout(() => splat.remove(), 2000);
      }, 4000);
    }

    function triggerGameOver() {
      isGameOver = true;
      finalScoreEl.textContent = score;
      gameOverEl.classList.add('active');
    }

    function resetGame() {
      // Clear entities & splats
      entities.forEach(e => e.destroy());
      entities = [];
      document.querySelectorAll('.splat').forEach(s => s.remove());

      score = 0;
      splatCount = 0;
      scoreEl.textContent = score;
      splatsEl.textContent = `${splatCount} / ${MAX_SPLATS}`;
      document.querySelectorAll('.corner-count').forEach(el => el.textContent = '0');
      isGameOver = false;
      gameOverEl.classList.remove('active');
    }

    // Main Game Loop
    function loop() {
      if (!isGameOver) {
        // Spawn rate speeds up over time
        spawnTimer++;
        const spawnInterval = Math.max(15, 60 - Math.floor(score / 3));

        if (spawnTimer >= spawnInterval) {
          entities.push(new Entity());
          spawnTimer = 0;
        }

        // Update all incoming animals
        entities = entities.filter(entity => entity.update());
      }

      requestAnimationFrame(loop);
    }

    // Start loop
    loop();

    // Fade the hint automatically after a few seconds even if untouched
    setTimeout(() => hintEl.classList.add('hidden'), 6000);
  </script>
</body>
</html>
